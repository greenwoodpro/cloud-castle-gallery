<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小王子的浮空城堡 · The Little Prince's Floating Castle</title>
<style>
  :root{
    --cream:#fbf5e8; --ink:#5a4a40; --ink2:#8a7660; --line:#e6d7b8;
    --rose:#c48a8a; --gold:#c9a05a; --blue:#6a7fb0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f2e6cf;
    font-family:"Georgia","Songti SC","STSong","SimSun",serif;color:var(--ink)}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- 顶部标题 ---------- */
  #title{
    position:fixed;top:18px;left:20px;z-index:5;pointer-events:none;
    text-shadow:0 1px 0 rgba(255,250,235,.8);
  }
  #title h1{
    margin:0;font-size:20px;font-weight:600;letter-spacing:3px;color:#6b5535;
  }
  #title .sub{
    margin-top:5px;font-size:11.5px;letter-spacing:1.5px;color:#9a8260;font-style:italic;
  }
  #title .quote{
    margin-top:10px;font-size:11px;color:#a08a68;max-width:250px;line-height:1.7;
    border-left:2px solid #d8c09a;padding-left:9px;font-style:italic;
  }

  /* ---------- 右侧信息面板 ---------- */
  #panel{
    position:fixed;top:18px;right:18px;width:312px;max-height:calc(100% - 118px);
    background:rgba(253,248,236,.93);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 10px 32px rgba(120,95,55,.16);z-index:6;
    display:flex;flex-direction:column;overflow:hidden;
    transition:transform .35s ease, opacity .35s ease;
  }
  #panel.hidden{transform:translateX(340px);opacity:0;pointer-events:none}
  #tabs{display:flex;border-bottom:1px solid var(--line);background:rgba(246,236,216,.6)}
  #tabs button{
    flex:1;border:0;background:transparent;padding:11px 4px 9px;cursor:pointer;
    font-family:inherit;font-size:12px;color:#9a8260;letter-spacing:.5px;
    border-bottom:2px solid transparent;transition:.2s;
  }
  #tabs button:hover{color:#6b5535;background:rgba(255,245,225,.5)}
  #tabs button.on{color:#6b5535;border-bottom-color:var(--rose);font-weight:600}
  #tabBody{padding:14px 16px 16px;overflow-y:auto;line-height:1.85;font-size:12px;color:#6b5535}
  #tabBody::-webkit-scrollbar{width:5px}
  #tabBody::-webkit-scrollbar-thumb{background:#d8c8a8;border-radius:3px}
  .sec{margin-bottom:13px}
  .sec h3{
    margin:0 0 5px;font-size:12.5px;color:#8a5a4a;letter-spacing:1px;font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .sec h3::before{
    content:"";width:5px;height:5px;border-radius:50%;background:var(--rose);flex:none;
  }
  .sec p{margin:0 0 3px}
  .sec .dim{color:#9a8260;font-size:11px}

  /* ---------- 底部控制条 ---------- */
  #dock{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;
    padding:12px 14px 14px;
    background:linear-gradient(to top,rgba(242,230,207,.92),rgba(242,230,207,0));
  }
  .btn{
    background:rgba(253,248,236,.9);border:1px solid var(--line);color:#7a6244;
    border-radius:999px;padding:7px 13px;font-size:11.5px;font-family:inherit;
    cursor:pointer;transition:.18s;letter-spacing:.5px;white-space:nowrap;
    box-shadow:0 2px 8px rgba(120,95,55,.08);
  }
  .btn:hover{background:#fff6e4;transform:translateY(-1.5px);color:#5a4028;
    box-shadow:0 5px 14px rgba(120,95,55,.15)}
  .btn:active{transform:translateY(0)}
  .btn.on{background:#e8c9c0;border-color:#d0a89a;color:#7a4a3a}
  .sep{width:1px;height:18px;background:#d8c8a8;margin:0 3px}

  /* ---------- 提示 ---------- */
  #hint{
    position:fixed;left:20px;bottom:74px;font-size:10.5px;color:#a89478;
    letter-spacing:.6px;line-height:1.8;z-index:5;pointer-events:none;
    background:rgba(253,248,236,.65);padding:7px 11px;border-radius:10px;
    border:1px solid rgba(230,215,184,.6);
  }

  /* ---------- 载入 ---------- */
  #load{
    position:fixed;inset:0;background:#f2e6cf;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;transition:opacity .8s ease;
  }
  #load .ring{
    width:44px;height:44px;border-radius:50%;
    border:2px solid #e0cda8;border-top-color:#c48a8a;
    animation:spin 1.1s linear infinite;
  }
  #load .txt{font-size:13px;letter-spacing:3px;color:#9a8260}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 纸纹叠加 */
  #grain{
    position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;
  }

  @media (max-width:820px){
    #panel{width:262px}
    #title h1{font-size:16px}
    #title .quote{display:none}
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="grain"></div>

<div id="load">
  <div class="ring"></div>
  <div class="txt">正在唤醒浮空岛</div>
</div>

<div id="title">
  <h1>小王子的浮空城堡</h1>
  <div class="sub">A CASTLE FLOATING ABOVE THE CLOUDS</div>
  <div class="quote">「真正重要的东西，用眼睛是看不见的。」<br>—— 献给每一个曾经是孩子的大人</div>
</div>

<div id="panel">
  <div id="tabs">
    <button data-t="inner" class="on">内部构造</button>
    <button data-t="people">人物</button>
    <button data-t="terrain">地形</button>
    <button data-t="env">环境</button>
  </div>
  <div id="tabBody"></div>
</div>

<div id="hint">
  左键拖动 · 旋转视角　|　滚轮 · 拉近拉远　|　右键拖动 · 平移<br>
  一切都可以慢慢看，反正这里没有正午。
</div>

<div id="dock">
  <button class="btn" data-fly="overview">城堡全景</button>
  <button class="btn" data-fly="gate">城门吊桥</button>
  <button class="btn" data-fly="court">中庭玫瑰</button>
  <button class="btn" data-fly="keep">主楼大厅</button>
  <button class="btn" data-fly="tower">星空塔台</button>
  <button class="btn" data-fly="lake">镜湖浅滩</button>
  <button class="btn" data-fly="fall">岛缘瀑布</button>
  <button class="btn" data-fly="under">云海仰望</button>
  <div class="sep"></div>
  <button class="btn on" id="bRotate">自动环绕</button>
  <button class="btn" id="bNight">夜幕</button>
  <button class="btn" id="bPanel">收起说明</button>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
/* ============================================================
   小王子的浮空城堡 — Three.js r128 (UMD, 可离线双击打开)
   ============================================================ */
(function(){
'use strict';

/* ---------------- 调色板：小王子水彩 ---------------- */
const C = {
  grass:0x8fbc72, grass2:0x7ea862, grass3:0xa4c884,
  wheat:0xe0c478, wheat2:0xcfb060,
  sand:0xe8d2ac, rock:0xc0aa8e, rockDark:0x9e8a70, rockDeep:0x7c6c58,
  snow:0xf4f0e8,
  water:0x6fb4cc, waterDeep:0x4e92b0, foam:0xe4f2f8,

  stone:0xe8d6b4, stone2:0xd4be94, stoneDark:0xb8a07c,
  roof:0x6a82ac, roof2:0x567098, roofRose:0xc07878,
  wood:0xa87e58, woodDark:0x7e5e42,
  gold:0xd8ac5c, goldDark:0xb88c42,

  rose:0xd06e6e, rose2:0xb45858, leaf:0x6a9258, leaf2:0x527842,
  glass:0xcfe4f0, glassRose:0xe4bcbc,

  skin:0xf0cba6, coat:0x5a78a8, hair:0xdcbe62, scarf:0x78a878,
  fox:0xd08a54, sheep:0xefe6da, armor:0x98a2ac, cape:0xb04a4a,
  cloud:0xf8eeda, ink:0x4e3e34,

  lamp:0xffd888, winDay:0xc8b48e, winNight:0xffbe66
};

/* ---------------- 工具 ---------------- */
function mat(color, o){
  o = o || {};
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: o.rough !== undefined ? o.rough : 0.88,
    metalness: o.metal !== undefined ? o.metal : 0.0,
    flatShading: !!o.flat,
    emissive: o.emissive !== undefined ? o.emissive : 0x000000,
    emissiveIntensity: o.ei !== undefined ? o.ei : 1,
    transparent: !!o.transparent,
    opacity: o.opacity !== undefined ? o.opacity : 1,
    side: o.side !== undefined ? o.side : THREE.FrontSide
  });
}
function box(w,h,d,color,o){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,o)); }
function cyl(rt,rb,h,seg,color,o){ return new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||12), mat(color,o)); }
function sph(r,color,o){ return new THREE.Mesh(new THREE.SphereGeometry(r,12,10), mat(color,o)); }
function cone(r,h,seg,color,o){ return new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||10), mat(color,o)); }

/* 墨线勾边 —— 绘本感的关键 */
function ink(mesh, opacity, threshold){
  opacity = opacity === undefined ? 0.22 : opacity;
  const e = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, threshold === undefined ? 28 : threshold),
    new THREE.LineBasicMaterial({ color:0x5a4a40, transparent:true, opacity:opacity })
  );
  mesh.add(e);
  return mesh;
}
function shadowOn(m){ m.castShadow = true; m.receiveShadow = true; return m; }

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf0d8b4, 95, 320);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 900);
camera.position.set(46, 28, 56);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.target.set(0, 8, 0);
controls.minDistance = 10;
controls.maxDistance = 170;
controls.maxPolarAngle = Math.PI * 0.96;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;

/* ---------------- 灯光 ---------------- */
const hemi = new THREE.HemisphereLight(0xb8c8e8, 0xd8b888, 0.52);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffdcac, 1.12);
sun.position.set(48, 58, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -55; sc.right = 55; sc.top = 55; sc.bottom = -55;
sc.near = 1; sc.far = 180;
sun.shadow.bias = -0.0008;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8ea8d8, 0.26);
fill.position.set(-40, 22, -34);
scene.add(fill);

const ambient = new THREE.AmbientLight(0xfff0dc, 0.12);
scene.add(ambient);

/* ============================================================
   天空：水彩渐变 + 太阳 + 星星 + 小行星 + 月亮
   ============================================================ */
const skyUniforms = {
  topColor:     { value: new THREE.Color(0x6d82c2) },
  midColor:     { value: new THREE.Color(0xb8c8e2) },
  bottomColor:  { value: new THREE.Color(0xf4d6ae) },
  sunColor:     { value: new THREE.Color(0xffe6bc) },
  sunDir:       { value: new THREE.Vector3(0.62, 0.42, 0.30).normalize() }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(420, 36, 22),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms: skyUniforms,
    vertexShader: [
      'varying vec3 vWorld;',
      'void main(){',
      '  vWorld = (modelMatrix * vec4(position,1.0)).xyz;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;',
      'uniform vec3 sunColor; uniform vec3 sunDir;',
      'varying vec3 vWorld;',
      'void main(){',
      '  vec3 dir = normalize(vWorld);',
      '  float h = dir.y * 0.5 + 0.5;',
      '  vec3 col = mix(bottomColor, midColor, smoothstep(0.40, 0.56, h));',
      '  col = mix(col, topColor, smoothstep(0.56, 0.94, h));',
      '  float s = pow(max(dot(dir, normalize(sunDir)), 0.0), 5.0);',
      '  col += sunColor * s * 0.42;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  })
);
scene.add(sky);

/* 太阳光晕 */
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (function(){
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g = cv.getContext('2d');
    const rg = g.createRadialGradient(64,64,4,64,64,64);
    rg.addColorStop(0,'rgba(255,240,200,0.95)');
    rg.addColorStop(0.35,'rgba(255,225,170,0.32)');
    rg.addColorStop(1,'rgba(255,210,150,0)');
    g.fillStyle = rg; g.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(cv);
  })(),
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
}));
sunSprite.scale.setScalar(72);
sunSprite.position.set(160, 108, 80);
sunSprite.material.opacity = 0.72;
scene.add(sunSprite);

/* 星星（点精灵，白天隐约可见，夜晚明亮） */
function dotTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(32,32,1,32,32,32);
  rg.addColorStop(0,'rgba(255,250,230,1)');
  rg.addColorStop(0.3,'rgba(255,240,200,0.55)');
  rg.addColorStop(1,'rgba(255,235,190,0)');
  g.fillStyle = rg; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const starGeo = new THREE.BufferGeometry();
const starCount = 520;
const starPos = new Float32Array(starCount * 3);
for(let i=0;i<starCount;i++){
  const r = 280 + Math.random()*90;
  const th = Math.random()*Math.PI*2;
  const ph = Math.acos(Math.random()*1.6 - 0.6); // 偏上半球
  starPos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  starPos[i*3+1] = Math.abs(r*Math.cos(ph))*0.75 + 30;
  starPos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  size: 3.2, map: dotTexture(), transparent:true,
  depthWrite:false, blending:THREE.AdditiveBlending,
  opacity: 0.35, color: 0xfff4d8, sizeAttenuation:true
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

/* 月亮（一弯新月） */
const moonGroup = new THREE.Group();
{
  const m = new THREE.Mesh(new THREE.SphereGeometry(14, 24, 18),
    new THREE.MeshBasicMaterial({ color:0xf6ecd2, transparent:true, opacity:0.92 }));
  moonGroup.add(m);
  const cutter = new THREE.Mesh(new THREE.SphereGeometry(13.2, 24, 18),
    new THREE.MeshBasicMaterial({ color:0x000000 }));
  cutter.position.set(6.5, 3.5, 5);
  // 用透明黑不行，直接错位一个稍小的球做"月牙"视觉（背景是天空，用不透明的浅色球叠）
  cutter.visible = false;
  moonGroup.add(cutter);
  // 月牙效果：叠一层半透明天空色球
  const shade = new THREE.Mesh(new THREE.SphereGeometry(13.4, 24, 18),
    new THREE.MeshBasicMaterial({ color:0xb8c8e2, transparent:true, opacity:0.98 }));
  shade.position.set(7.2, 4.2, 5.5);
  moonGroup.add(shade);
}
moonGroup.position.set(-190, 130, -160);
scene.add(moonGroup);

/* 带环的小行星（小王子的 B612 邻居们） */
function ringedPlanet(radius, color, ringColor, pos){
  const g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.SphereGeometry(radius, 18, 14),
    mat(color, { rough:0.9, flat:true }));
  g.add(p);
  const ring = new THREE.Mesh(new THREE.RingGeometry(radius*1.35, radius*2.1, 32),
    new THREE.MeshBasicMaterial({ color:ringColor, transparent:true, opacity:0.55,
      side:THREE.DoubleSide }));
  ring.rotation.x = Math.PI/2.4;
  ring.rotation.y = 0.35;
  g.add(ring);
  g.position.copy(pos);
  return g;
}
scene.add(ringedPlanet(7, 0xd8b8a0, 0xe8d0b0, new THREE.Vector3(150, 82, -140)));
scene.add(ringedPlanet(5, 0xa8b8d0, 0xc8d4e4, new THREE.Vector3(-120, 96, -190)));
scene.add(ringedPlanet(3.4, 0xe0c8b0, 0xf0dcc8, new THREE.Vector3(-40, 150, 60)));

/* ============================================================
   云海（岛下）与飘云
   ============================================================ */
const cloudSea = new THREE.Group();
scene.add(cloudSea);
{
  const cm = mat(C.cloud, { rough:1, flat:true, transparent:true, opacity:0.94 });
  for(let i=0;i<26;i++){
    const g = new THREE.Group();
    const n = 3 + Math.floor(Math.random()*4);
    for(let j=0;j<n;j++){
      const m = new THREE.Mesh(new THREE.SphereGeometry(6+Math.random()*7, 10, 8), cm);
      m.position.set(j*8 - n*3.2, Math.random()*2.2, Math.random()*5);
      m.scale.y = 0.42;
      g.add(m);
    }
    const a = Math.random()*Math.PI*2;
    const r = 20 + Math.random()*110;
    g.position.set(Math.cos(a)*r, -34 - Math.random()*16, Math.sin(a)*r);
    g.userData = { a:a, r:r, sp: 0.004 + Math.random()*0.006, y: g.position.y };
    cloudSea.add(g);
  }
}

const clouds = [];
for(let i=0;i<9;i++){
  const g = new THREE.Group();
  const cm = mat(C.cloud, { rough:1, flat:true, transparent:true, opacity:0.96 });
  const n = 3 + Math.floor(Math.random()*3);
  for(let j=0;j<n;j++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(1.8+Math.random()*2.0, 10, 8), cm);
    m.position.set(j*2.4 - n*1.1, Math.random()*0.7, Math.random()*1.4);
    m.scale.y = 0.62;
    g.add(m);
  }
  const a = Math.random()*Math.PI*2, r = 40 + Math.random()*36;
  g.position.set(Math.cos(a)*r, 8 + Math.random()*26, Math.sin(a)*r);
  g.userData = { a:a, r:r, sp:0.02 + Math.random()*0.018, y:g.position.y };
  clouds.push(g); scene.add(g);
}

/* ============================================================
   浮空岛主体
   ============================================================ */
const island = new THREE.Group();
scene.add(island);

{
  // 草地顶面
  const top = new THREE.Mesh(new THREE.CylinderGeometry(30, 28.2, 3.4, 56, 1), mat(C.grass, { flat:true }));
  top.position.y = -1.7;
  shadowOn(top);
  ink(top, 0.12);
  island.add(top);

  // 顶面草色变化（几块浅色草甸）
  for(let i=0;i<7;i++){
    const a = Math.random()*Math.PI*2, r = 8 + Math.random()*18;
    const patch = new THREE.Mesh(new THREE.CircleGeometry(3.2+Math.random()*3.4, 18),
      mat(Math.random()<0.5 ? C.grass3 : C.grass2, { flat:true }));
    patch.rotation.x = -Math.PI/2;
    patch.position.set(Math.cos(a)*r, 0.05 + i*0.002, Math.sin(a)*r);
    patch.receiveShadow = true;
    island.add(patch);
  }

  // 白垩悬崖环（岛缘）
  const cliff = new THREE.Mesh(new THREE.CylinderGeometry(28.4, 26, 5.2, 40, 1, true),
    mat(C.sand, { flat:true, side:THREE.DoubleSide }));
  cliff.position.y = -5.4;
  island.add(cliff);

  // 倒悬岩锥（岛的"根"）
  const body = new THREE.Mesh(new THREE.CylinderGeometry(26, 3.0, 22, 44, 7, true),
    mat(C.rockDark, { flat:true, side:THREE.DoubleSide }));
  body.position.y = -18;
  shadowOn(body);
  island.add(body);

  const deep = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 1.4, 12, 12, 3, true),
    mat(C.rockDeep, { flat:true, side:THREE.DoubleSide }));
  deep.position.y = -33;
  island.add(deep);

  // 岛底岩块
  for(let i=0;i<18;i++){
    const a = i/18*Math.PI*2 + Math.random()*0.3;
    const r = 16 + Math.random()*10;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.4 + Math.random()*2.2, 0),
      mat(C.rockDark, { flat:true }));
    rock.position.set(Math.cos(a)*r, -4 - Math.random()*10, Math.sin(a)*r);

/* ---- 外墙（八边形轮廓，四角塔） ---- */
function battlementsRing(radius, y, count, w, h, d, color, parent){
  for(let i=0;i<count;i++){
    const a = i/count*Math.PI*2;
    const m = box(w, h, d, color);
    m.position.set(Math.cos(a)*radius, y, Math.sin(a)*radius);
    m.rotation.y = -a;
    shadowOn(m);
    parent.add(m);
  }
}
function wallSegment(x1,z1,x2,z2,h,t){
  const dx = x2-x1, dz = z2-z1;
  const len = Math.hypot(dx,dz);
  const g = new THREE.Group();
  const w = box(len, h, t, C.stone);
  w.position.set((x1+x2)/2, h/2, (z1+z2)/2);
  w.rotation.y = -Math.atan2(dz, dx);
  shadowOn(w); ink(w, 0.2);
  g.add(w);
  // 步道顶
  const walk = box(len, 0.22, t+0.5, C.stone2);
  walk.position.set((x1+x2)/2, h+0.11, (z1+z2)/2);
  walk.rotation.y = -Math.atan2(dz, dx);
  walk.receiveShadow = true;
  g.add(walk);
  // 垛口
  const n = Math.max(3, Math.floor(len/1.5));
  for(let i=0;i<=n;i++){
    const tt = i/n;
    const px = THREE.MathUtils.lerp(x1,x2,tt), pz = THREE.MathUtils.lerp(z1,z2,tt);
    const m = box(0.62, 0.68, t+0.35, C.stone);
    m.position.set(px, h+0.55, pz);
    m.rotation.y = -Math.atan2(dz, dx);
    shadowOn(m);
    g.add(m);
  }
  castle.add(g);
  return g;
}

function cornerTower(x, z, h, r){
  const g = new THREE.Group();
  const base = cyl(r*0.92, r, h, 12, C.stone);
  base.position.y = h/2;
  shadowOn(base); ink(base, 0.22);
  g.add(base);
  // 环形挑檐
  const ring = cyl(r*1.12, r*1.12, 0.34, 12, C.stone2);
  ring.position.y = h - 0.2;
  g.add(ring);
  // 锥顶
  const roof = cone(r*1.22, r*2.1, 12, C.roof, { flat:true });
  roof.position.y = h + r*1.05;
  shadowOn(roof); ink(roof, 0.22);
  g.add(roof);
  // 顶饰
  const fin = sph(0.26, C.gold, { metal:0.55, rough:0.32 });
  fin.position.y = h + r*2.1 + 0.15;
  g.add(fin);
  const pole = cyl(0.045,0.045,1.1,5,C.woodDark);
  pole.position.y = h + r*2.1 + 0.8;
  g.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 0.62), mat(C.cape, { side:THREE.DoubleSide }));
  flag.position.set(0.58, h + r*2.1 + 1.15, 0);
  flag.userData = { flag:true };
  g.add(flag);
  // 窗
  for(let i=0;i<3;i++){
    const a = i/3*Math.PI*2 + 0.4;
    const w = box(0.38, 0.72, 0.12, C.winDay, { emissive:0x000000 });
    w.position.set(Math.cos(a)*r*0.96, h*0.52, Math.sin(a)*r*0.96);
    w.lookAt(0, h*0.52, 0);
    windows.push(w);
    g.add(w);
  }
  g.position.set(x, 0, z);
  castle.add(g);
  return g;
}

   ============================================================ */
function makePerson(o){
  o = o || {};
  const g = new THREE.Group();
  const body = cyl(0.19, 0.28, 0.78, 9, o.coat);
  body.position.y = 0.88;
  shadowOn(body);
  g.add(body);
  const head = sph(0.215, C.skin);
  head.position.y = 1.46;
  shadowOn(head);
  g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.235, 11, 9, 0, Math.PI*2, 0, Math.PI/1.75),
    mat(o.hair || C.hair));
  hair.position.y = 1.51;
  g.add(hair);
  if(o.scarf){
    const sc = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.055, 7, 16), mat(o.scarf));
    sc.position.y = 1.22;
    sc.rotation.x = Math.PI/2;
    g.add(sc);
    // 飘起的围巾尾
    const tail = box(0.1, 0.42, 0.045, o.scarf);
    tail.position.set(0.2, 1.08, -0.12);
    tail.rotation.z = -0.55;
    tail.userData = { scarfTail:true, ph:Math.random()*6 };
    g.add(tail);
    g.userData.scarfTail = tail;
  }
  const legL = cyl(0.075,0.075,0.52,6, 0x5a4a3c);
  legL.position.set(-0.11, 0.26, 0);
  g.add(legL);
  const legR = legL.clone(); legR.position.x = 0.11; g.add(legR);
  const armL = cyl(0.065,0.065,0.52,6, o.coat);
  armL.position.set(-0.3, 0.98, 0);
  armL.rotation.z = 0.28;
  g.add(armL);
  const armR = armL.clone(); armR.position.x = 0.3; armR.rotation.z = -0.28; g.add(armR);

  if(o.cape){
    const cp = box(0.42, 0.85, 0.06, o.cape);
    cp.position.set(0, 1.02, -0.2);
    cp.rotation.x = 0.12;
    g.add(cp);
    g.userData.cape = cp;
  }
  if(o.helmet){
    const hm = sph(0.225, C.armor, { metal:0.55, rough:0.35 });
    hm.position.y = 1.54;
    hm.scale.y = 0.85;
    g.add(hm);
    const visor = box(0.26,0.11,0.16, 0x6a7278, { metal:0.55, rough:0.4 });
    visor.position.set(0, 1.48, 0.16);
    g.add(visor);
  }
  if(o.hat === 'straw'){
    const brim = cyl(0.36,0.36,0.05,12, C.wheat2);
    brim.position.y = 1.66;
    g.add(brim);
    const crown = cyl(0.17,0.2,0.18,10, C.wheat);
    crown.position.y = 1.77;
    g.add(crown);
  }
  if(o.hat === 'hood'){
    const hood = new THREE.Mesh(new THREE.SphereGeometry(0.25, 10, 8, 0, Math.PI*2, 0, Math.PI/1.7),
      mat(o.coat));
    hood.position.y = 1.55;
    g.add(hood);
  }
  if(o.scale) g.scale.setScalar(o.scale);
  if(o.pos) g.position.set(o.pos[0], o.pos[1], o.pos[2]);
  if(o.ry !== undefined) g.rotation.y = o.ry;
  return g;
}

function smallIsland(x, y, z, scale){
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.0, 1.6, 22), mat(C.grass, { flat:true }));
  top.position.y = -0.8;
  shadowOn(top);
  g.add(top);
  const bodyI = new THREE.Mesh(new THREE.CylinderGeometry(5.8, 1.1, 9, 20, 3, true),
    mat(C.rockDark, { flat:true, side:THREE.DoubleSide }));
  bodyI.position.y = -6.0;
  g.add(bodyI);
  g.position.set(x, y, z);
  g.scale.setScalar(scale);
  scene.add(g);
  return g;
}

let night = false;
function setNight(v){
  night = v;
  scene.fog.color.setHex(v ? 0x2a3858 : 0xf0d8b4);
  skyUniforms.topColor.value.setHex(v ? 0x1a2448 : 0x6d82c2);
  skyUniforms.midColor.value.setHex(v ? 0x2e3e68 : 0xb8c8e2);
  skyUniforms.bottomColor.value.setHex(v ? 0x4a4668 : 0xf4d6ae);
  skyUniforms.sunColor.value.setHex(v ? 0x8090c0 : 0xffe6bc);
  hemi.intensity = v ? 0.18 : 0.52;
  sun.intensity = v ? 0.24 : 1.12;
  sun.color.setHex(v ? 0x8898d0 : 0xffdcac);
  fill.intensity = v ? 0.12 : 0.26;
  ambient.intensity = v ? 0.08 : 0.12;
  renderer.toneMappingExposure = v ? 0.82 : 1.0;
  starMat.opacity = v ? 0.95 : 0.35;
  sunSprite.material.opacity = v ? 0.12 : 0.72;

  // 窗：夜里亮起暖黄，白天恢复原本的微光
  windows.forEach(function(w){
    if(v){
      w.material.emissive.setHex(C.winNight);
      w.material.emissiveIntensity = 1.35;
    } else {
      w.material.emissive.setHex(w.userData.baseEmissive || 0x000000);
      w.material.emissiveIntensity = w.userData.baseEI || 0;
    }
  });

  // 灯笼：白天熄灭，夜晚全部点亮；壁炉/炉火/钟楼常亮
  lamps.forEach(function(l){ l.intensity = v ? 1.55 : 0; });
  if(fireLight)    fireLight.intensity    = v ? 1.8  : 1.1;
  if(kitchenLight) kitchenLight.intensity = v ? 1.2  : 0.7;
  if(chapelBell)   chapelBell.intensity   = v ? 1.3  : 0.55;
  if(starLampLight) starLampLight.intensity = v ? 1.5  : 0.0;
  lighthouseIsland.userData.beam.intensity = v ? 2.3 : 1.1;

  const btn = document.getElementById('bNight');
  btn.classList.toggle('on', v);
  btn.textContent = v ? '白昼' : '夜幕';
}

const VIEWS = {
  overview: { pos:[46,28,56],  tgt:[0,8,0] },
  gate:     { pos:[2,10,32],   tgt:[0,5,9] },
  court:    { pos:[6,17,15],   tgt:[0,3.5,1] },
  keep:     { pos:[9,33,13],    tgt:[0,6,-3.5] },
  tower:    { pos:[1,27,4],    tgt:[-6.3,18.2,-5.2] },
  lake:     { pos:[32,11,26],  tgt:[17,1,12] },
  fall:     { pos:[42,-2,28],  tgt:[28,-16,15] },
  under:    { pos:[16,-18,42], tgt:[0,-6,0] }
};
function flyTo(key){
  const v = VIEWS[key];
  if(!v) return;
  const from = camera.position.clone();
  const fromT = controls.target.clone();
  const to = new THREE.Vector3(v.pos[0], v.pos[1], v.pos[2]);
  const toT = new THREE.Vector3(v.tgt[0], v.tgt[1], v.tgt[2]);
  const start = performance.now();
  const dur = 1350;
  controls.autoRotate = false;
  document.getElementById('bRotate').classList.remove('on');
  function step(now){
    const k = Math.min((now - start)/dur, 1);
    const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
    camera.position.lerpVectors(from, to, e);
    controls.target.lerpVectors(fromT, toT, e);
    if(k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

    document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    renderTab(btn.dataset.t);
  });
});
document.querySelectorAll('[data-fly]').forEach(function(btn){
  btn.addEventListener('click', function(){ flyTo(btn.dataset.fly); });
});
document.getElementById('bRotate').addEventListener('click', function(){
  controls.autoRotate = !controls.autoRotate;
  this.classList.toggle('on', controls.autoRotate);
});
document.getElementById('bNight').addEventListener('click', function(){ setNight(!night); });
document.getElementById('bPanel').addEventListener('click', function(){
  const p = document.getElementById('panel');
  p.classList.toggle('hidden');
  this.textContent = p.classList.contains('hidden') ? '展开说明' : '收起说明';
});

addEventListener('resize', function(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   动画循环
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  // 岛屿轻微呼吸
  island.position.y = Math.sin(t*0.32)*0.42;
  island.rotation.y = Math.sin(t*0.11)*0.012;

  // 云
  clouds.forEach(function(c){
    c.userData.a += dt*c.userData.sp*0.11;
    c.position.x = Math.cos(c.userData.a)*c.userData.r;
    c.position.z = Math.sin(c.userData.a)*c.userData.r;
    c.position.y = c.userData.y + Math.sin(t*0.5 + c.userData.a)*0.55;
  });
  cloudSea.children.forEach(function(c){
    c.userData.a += dt*c.userData.sp;
    c.position.x = Math.cos(c.userData.a)*c.userData.r;
    c.position.z = Math.sin(c.userData.a)*c.userData.r;
    c.position.y = c.userData.y + Math.sin(t*0.22 + c.userData.a)*0.7;
  });

  // 浮石
  floaters.forEach(function(f){
    f.position.y = f.userData.base + Math.sin(t*f.userData.sp + f.userData.ph)*1.15;
    f.rotation.y += dt*0.16;
    f.rotation.x += dt*0.07;
  });

  // 树与麦浪
  forest.children.forEach(function(tr){
    if(tr.userData && tr.userData.sway) tr.rotation.z = Math.sin(t*1.15 + tr.userData.ph)*0.024;
  });
  wheatField.children.forEach(function(ch){
    if(ch.userData && ch.userData.sway) ch.rotation.z = Math.sin(t*1.9 + ch.userData.ph)*0.10;
  });
  lakeGroup.children.forEach(function(ch){
    if(ch.userData && ch.userData.sway) ch.rotation.z = Math.sin(t*1.5 + ch.userData.ph)*0.07;
  });

  // 旗帜
  scene.traverse(function(o){
    if(o.userData && o.userData.flag){
      o.rotation.y = Math.sin(t*2.6 + o.id*0.13)*0.32;
      o.scale.x = 1 + Math.sin(t*3.6 + o.id*0.17)*0.09;
    }
    if(o.userData && o.userData.scarfTail){
      o.rotation.z = -0.55 + Math.sin(t*2.8 + o.userData.ph)*0.28;
    }
    if(o.userData && o.userData.flame){
      const s = 1 + Math.sin(t*9 + o.userData.ph)*0.22;
      o.scale.set(s, 1 + Math.sin(t*11 + o.userData.ph)*0.28, s);
    }
    if(o.userData && o.userData.vane){
      o.rotation.y += dt*0.22;
    }
  });

  // 风车
  if(windmillIsland.userData.hub) windmillIsland.userData.hub.rotation.z += dt*0.62;

  // 湖喷泉
  if(lakeGroup.userData.jet){
    lakeGroup.userData.jet.scale.y = 1 + Math.sin(t*3.2)*0.22;
    lakeGroup.userData.jet.material.opacity = 0.62 + Math.sin(t*3.2)*0.16;
  }
  if(lakeGroup.userData.lake){
    lakeGroup.userData.lake.material.opacity = 0.80 + Math.sin(t*1.15)*0.06;
  }

  // 瀑布纹理滚动
  if(waterfall.userData.tex){
    waterfall.userData.tex.offset.y -= dt*0.42;
  }

  // 人物微动作
  prince.position.y = 0.12 + Math.sin(t*1.9)*0.028;
  gardener.rotation.y = 2.6 + Math.sin(t*0.55)*0.35;
  lamplighter.position.x = -3.85 + Math.sin(t*0.42)*0.85;
  lamplighter.rotation.y = 0.7 + Math.sin(t*0.42)*0.5;
  if(cat.userData.tail) cat.userData.tail.rotation.z = -1.15 + Math.sin(t*1.6)*0.32;
  if(fox.userData.tail) fox.userData.tail.rotation.z = 1.25 + Math.sin(t*1.2)*0.18;

  guards[0].position.x = 5.5 + Math.sin(t*0.30)*2.2;
  guards[0].rotation.y = Math.cos(t*0.30) > 0 ? 1.45 : -1.45;
  guards[1].position.x = -5.5 + Math.sin(t*0.26 + 2)*2.2;
  guards[1].rotation.y = Math.cos(t*0.26 + 2) > 0 ? -1.45 : 1.45;

  // 鸟
  birds.forEach(function(b){
    const u = b.userData;
    u.a += dt*u.sp*0.34;
    b.position.set(Math.cos(u.a)*u.r, u.y + Math.sin(t + u.ph)*1.8, Math.sin(u.a)*u.r);
    b.rotation.y = -u.a + Math.PI/2;
    const flap = Math.sin(t*7.5 + u.ph)*0.62;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  });

  // 热气球
  balloon.position.y = 34 + Math.sin(t*0.24)*2.6;
  balloon.position.x = -62 + Math.sin(t*0.12)*7;
  balloon.rotation.y += dt*0.06;

  // 花瓣
  const pp = petalGeo.attributes.position.array;
  for(let i=0;i<petalCount;i++){
    pp[i*3+1] -= dt*petalVel[i].y;
    pp[i*3]   += Math.sin(t*0.85 + petalVel[i].ph)*dt*1.1 + petalVel[i].x*dt;
    pp[i*3+2] += Math.cos(t*0.62 + petalVel[i].ph)*dt*0.65;
    if(pp[i*3+1] < -4){
      pp[i*3+1] = 34 + Math.random()*6;
      pp[i*3]   = (Math.random()-0.5)*70;
      pp[i*3+2] = (Math.random()-0.5)*70;
    }
  }
  petalGeo.attributes.position.needsUpdate = true;

  // 灯塔扫光
  if(lighthouseIsland.userData.beam){
    const k = (Math.sin(t*0.52) + 1)/2;
    lighthouseIsland.userData.beam.intensity = (night ? 2.4 : 1.1) + k*0.9;
  }

  // 星星缓慢闪烁
  starMat.opacity = (night ? 0.92 : 0.32) + Math.sin(t*1.6)*0.05;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* 载入结束 */
const loadEl = document.getElementById('load');
setTimeout(function(){
  loadEl.style.opacity = '0';
  setTimeout(function(){ if(loadEl.parentNode) loadEl.parentNode.removeChild(loadEl); }, 850);
}, 420);

/* URL 锚点直达视角：castle.html#keep 等；#night 切夜幕 */
(function(){
  const h = (location.hash || '').replace('#','');
  if(h === 'night'){
    setTimeout(function(){ setNight(true); }, 500);
    return;
  }
  if(h && VIEWS[h]){
    setTimeout(function(){ flyTo(h); }, 700);
  }
})();

})();
</script>
</body>
</html>
