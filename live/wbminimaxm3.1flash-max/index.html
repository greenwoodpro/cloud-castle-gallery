<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浮空岛上的城堡 · Le Château Flottant</title>
<style>
  :root {
    --ink: #4a3f35;
    --ink-soft: #7b6b5a;
    --paper: #fdf6e9;
    --paper-2: #f7ecd8;
    --line: #ddc9a8;
    --gold: #c9952f;
    --sky: #7fb3d5;
    --rose: #c0505a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ef; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #scene { display: block; width: 100%; height: 100%; }

  /* ---------- 纸纹叠加 ---------- */
  #paper-tex {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    opacity: .16; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(90,70,50,.30) 100%);
  }

  /* ---------- 标题 ---------- */
  #title {
    position: fixed; top: 20px; left: 22px; z-index: 20;
    pointer-events: none;
  }
  #title h1 {
    margin: 0; font-size: 22px; letter-spacing: .16em; font-weight: 600;
    color: #3d332a; text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }
  #title p {
    margin: 5px 0 0; font-size: 11.5px; letter-spacing: .22em;
    color: rgba(74,63,53,.62); text-transform: uppercase;
  }

  /* ---------- 侧面板 ---------- */
  #panel {
    position: fixed; top: 88px; left: 22px; z-index: 20;
    width: 232px;
    background: linear-gradient(170deg, rgba(253,246,233,.94), rgba(244,232,210,.92));
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 8px 30px rgba(70,55,40,.18), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter: blur(6px);
    transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .3s;
    max-height: calc(100vh - 120px);
    display: flex; flex-direction: column;
  }
  #panel.collapsed { transform: translateX(calc(-100% - 26px)); opacity: 0; }
  #panel-toggle {
    position: fixed; top: 92px; left: 22px; z-index: 21;
    width: 30px; height: 30px; border-radius: 3px;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1;
    box-shadow: 0 3px 10px rgba(70,55,40,.16);
    transition: left .35s cubic-bezier(.4,0,.2,1);
  }
  #panel.collapsed ~ #panel-toggle { left: 22px; }
  #panel:not(.collapsed) ~ #panel-toggle { left: 246px; }
  #panel-toggle:hover { background: var(--paper-2); }

  .sec { padding: 13px 15px; border-bottom: 1px dashed var(--line); }
  .sec:last-child { border-bottom: none; }
  .sec h2 {
    margin: 0 0 10px; font-size: 11px; letter-spacing: .2em; font-weight: 600;
    color: var(--ink-soft); text-transform: uppercase;
  }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button.v, button.a {
    font-family: inherit; font-size: 12.5px; color: var(--ink);
    background: rgba(255,252,244,.72); border: 1px solid var(--line);
    border-radius: 3px; padding: 7px 8px; cursor: pointer;
    transition: all .18s; letter-spacing: .04em;
  }
  button.v:hover, button.a:hover { background: #fff; border-color: var(--gold); transform: translateY(-1px); }
  button.v.active, button.a.active {
    background: var(--gold); border-color: #a8781f; color: #fffaf0;
    box-shadow: 0 2px 8px rgba(201,149,47,.35);
  }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .acts .wide { grid-column: 1 / -1; }
  button.a { display: flex; align-items: center; justify-content: center; gap: 5px; }
  button.a.full { grid-column: 1 / -1; }

  #cut-hint {
    margin-top: 8px; font-size: 11.5px; line-height: 1.6; color: var(--ink-soft);
    opacity: 0; transition: opacity .3s; font-style: italic;
  }

  /* ---------- 信息卡 ---------- */
  #info {
    position: fixed; right: 22px; bottom: 22px; z-index: 20;
    width: 320px; max-width: calc(100vw - 44px);
    background: linear-gradient(165deg, rgba(253,246,233,.97), rgba(243,230,205,.95));
    border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 10px 34px rgba(70,55,40,.22), inset 0 1px 0 rgba(255,255,255,.7);
    padding: 15px 17px 16px;
    opacity: 0; transform: translateY(14px) scale(.97);
    transition: all .32s cubic-bezier(.34,1.4,.5,1);
    pointer-events: none;
  }
  #info.show { opacity: 1; transform: none; pointer-events: auto; }
  #info-title {
    font-size: 10px; letter-spacing: .22em; color: var(--ink-soft);
    text-transform: uppercase; margin-bottom: 5px;
  }
  #info-name { font-size: 17px; font-weight: 600; margin: 0 0 8px; color: #3d332a; }
  #info-text { font-size: 13px; line-height: 1.78; color: #5c5044; margin: 0; }
  #info-close {
    position: absolute; top: 10px; right: 11px; width: 22px; height: 22px;
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    font-size: 17px; line-height: 1; border-radius: 50%;
  }
  #info-close:hover { background: rgba(0,0,0,.07); color: var(--ink); }

  /* ---------- 3D 标签 ---------- */
  #labels { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .plabel {
    position: absolute; top: 0; left: 0;
    display: flex; align-items: center; gap: 6px;
    background: rgba(253,246,233,.86); border: 1px solid rgba(201,149,47,.55);
    border-radius: 20px; padding: 3px 10px 3px 5px;
    font-family: inherit; font-size: 11.5px; color: #4a3f35; white-space: nowrap;
    cursor: pointer; pointer-events: auto;
    box-shadow: 0 3px 10px rgba(70,55,40,.2);
    transition: background .18s, transform .18s;
  }
  .plabel:hover { background: #fff; border-color: var(--gold); }
  .plabel .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 0 3px rgba(201,149,47,.22);
  }
  .plabel .txt { letter-spacing: .04em; }

  /* ---------- 底部提示 ---------- */
  #hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 15; font-size: 11.5px; letter-spacing: .12em;
    color: rgba(60,50,40,.55); pointer-events: none; text-align: center;
  }
  #hint span { margin: 0 6px; opacity: .6; }

  /* ---------- 加载页 ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(170deg, #fdf6e9, #e8d9bd);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .7s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .mark { font-size: 40px; letter-spacing: .3em; color: var(--gold); }
  #loading .txt { margin-top: 12px; font-size: 13px; letter-spacing: .2em; color: var(--ink-soft); }
  #loading .bar { margin-top: 18px; width: 190px; height: 2px; background: rgba(201,149,47,.25); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: var(--gold); animation: sl 1.1s infinite ease-in-out; }
  @keyframes sl { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

  @media (max-width: 720px) {
    #panel { width: 200px; }
    #info { width: auto; left: 16px; right: 16px; }
    #title h1 { font-size: 17px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="paper-tex"></div>
<div id="labels"></div>

<div id="title">
  <h1>浮空岛上的城堡</h1>
  <p>Le Château Flottant · B-612</p>
</div>

<button id="panel-toggle" title="收起 / 展开面板">☰</button>

<div id="panel">
  <div class="sec">
    <h2>视角</h2>
    <div class="views">
      <button class="v active" data-view="overview">全景</button>
      <button class="v" data-view="keep">主堡</button>
      <button class="v" data-view="gate">大门</button>
      <button class="v" data-view="island">岛底</button>
      <button class="v" data-view="inside">城堡内</button>
      <button class="v" data-view="garden">玫瑰园</button>
      <button class="v" data-view="lake">湖畔</button>
      <button class="v" data-view="sky">远眺</button>
    </div>
  </div>
  <div class="sec">
    <h2>场景</h2>
    <div class="acts">
      <button class="a" id="btn-night">🌙 <span>夜晚</span></button>
      <button class="a" id="btn-cutaway">🔍 <span>剖视</span></button>
      <button class="a active" id="btn-labels">🏷 <span>注释</span></button>
      <button class="a" id="btn-rotate">🔄 <span>旋转</span></button>
      <button class="a full" id="btn-tour">🎞 <span>自动巡览</span></button>
    </div>
    <div id="cut-hint">屋顶与外墙已淡出，可窥见主堡三层结构：地牢、大厅王座、卧房与瞭望台。</div>
  </div>
</div>

<div id="info">
  <button id="info-close">×</button>
  <div id="info-title">场景注释</div>
  <h3 id="info-name"></h3>
  <p id="info-text"></p>
</div>

<div id="hint">拖拽 <span>·</span> 旋转 <span>·</span> 滚轮缩放 <span>·</span> 右键平移 <span>·</span> 点击金色标签查看细节</div>

<div id="loading">
  <div class="mark">✦</div>
  <div class="txt">正在升起浮空岛…</div>
  <div class="bar"><i></i></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
