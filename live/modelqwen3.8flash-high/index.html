<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浮空岛上的城堡 · 小王子的石头王国</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2440;
    font-family:"Noto Serif SC","Songti SC","KaiTi","Microsoft YaHei",serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  .panel{position:fixed;color:#4a3b2e;pointer-events:none;z-index:10;}
  #title{left:22px;top:20px;max-width:330px;}
  #title h1{margin:0 0 6px;font-size:23px;font-weight:600;letter-spacing:2px;color:#fdf3e3;
    text-shadow:0 1px 10px rgba(60,40,80,.55);}
  #title p{margin:0;font-size:12.5px;line-height:1.75;color:#f3e6d4;opacity:.88;
    text-shadow:0 1px 6px rgba(60,40,80,.5);}

  #hint{right:22px;top:20px;text-align:right;font-size:12px;line-height:1.9;color:#f6ead8;
    text-shadow:0 1px 6px rgba(60,40,80,.6);opacity:.85;}

  /* 羊皮纸质感控制条 */
  #bar{left:50%;bottom:18px;transform:translateX(-50%);pointer-events:auto;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:linear-gradient(#fbf3e2,#f4e6cb);border:1px solid #dcc49a;border-radius:14px;
    padding:9px 14px;box-shadow:0 6px 26px rgba(30,20,50,.35);max-width:92vw;}
  #bar button{font-family:inherit;font-size:12.5px;color:#5a4632;background:#fffbf0;
    border:1px solid #cfae7b;border-radius:9px;padding:6px 11px;cursor:pointer;letter-spacing:1px;
    transition:all .18s;}
  #bar button:hover{background:#f7e9cd;transform:translateY(-1px);}
  #bar button.on{background:#e9b97c;border-color:#c08b4b;color:#4a3218;}
  #bar .sep{width:1px;height:22px;background:#d9c39a;margin:0 4px;}

  #caption{left:22px;bottom:84px;max-width:400px;pointer-events:none;
    background:rgba(250,243,228,.92);border:1px solid #d8c194;border-radius:12px;
    padding:12px 15px;box-shadow:0 6px 22px rgba(30,20,50,.3);
    font-size:12.5px;line-height:1.85;color:#4c3a28;
    transition:opacity .5s;opacity:0;}
  #caption.show{opacity:1;}
  #caption b{display:block;font-size:14px;color:#7c4a2d;letter-spacing:2px;margin-bottom:5px;}

  #fade{position:fixed;inset:0;background:#241d38;display:flex;align-items:center;justify-content:center;
    color:#f5e9d5;font-size:15px;letter-spacing:4px;z-index:50;transition:opacity 1.2s;}
</style>
</head>
<body>
<div id="app"></div>

<div id="fade">有一座城堡，漂浮在星星之间……</div>

<div class="panel" id="title">
  <h1>浮空岛上的城堡</h1>
  <p>一座广义的中世纪石头城堡，安放在黄昏色的浮空岛上。岛上有麦田、风车、松林、池塘与坠入星河的瀑布；城堡有城墙、门楼、礼拜堂与四层高的主塔——塔里住着国王、地理学家、商人和一位戴金围巾的小王子。</p>
</div>

<div class="panel" id="hint">
  左键拖动 · 环绕飞行　滚轮 · 远近<br>
  右键拖动 · 平移　按键 1–8 · 跳转视角<br>
  C · 剖视城堡内部　R · 重置
</div>

<div id="caption"></div>

<div class="panel" id="bar">
  <button data-preset="0" class="on">① 全景远眺</button>
  <button data-preset="1">② 城门与吊桥</button>
  <button data-preset="2">③ 内庭与玫瑰</button>
  <button data-preset="3">④ 厨房地窖</button>
  <button data-preset="4">⑤ 大厅王座</button>
  <button data-preset="5">⑥ 书房星图</button>
  <button data-preset="6">⑦ 塔顶卧室</button>
  <button data-preset="7">⑧ 村庄·瀑布·星丘</button>
  <div class="sep"></div>
  <button id="cut">◧ 剖视内部</button>
  <button id="labels">◍ 人物名牌</button>
  <button id="tour">➻ 自动巡游</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   一、渲染器 / 场景 / 灯光 —— 黄昏小王子色调
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9bfa0, 70, 240);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 900);
camera.position.set(42, 26, 48);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.target.set(-1, 6, 0);
controls.minDistance = 3.5;
controls.maxDistance = 130;
controls.maxPolarAngle = Math.PI * .95;
controls.autoRotateSpeed = .55;

// 三段式卡通渐变（明亮柔和的水彩明暗，暗部不提太黑）
const gradTex = new THREE.DataTexture(
  new Uint8Array([140,138,146,255, 186,184,186,255, 226,224,218,255, 255,255,255,255]),
  4,1, THREE.RGBAFormat);
gradTex.magFilter = gradTex.minFilter = THREE.NearestFilter;
gradTex.needsUpdate = true;

const matCache = new Map();
function T(color, extra){
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradTex }, extra||{}));
  matCache.set(key, m);
  return m;
}
const basic = c => new THREE.MeshBasicMaterial({ color:c });

// 灯光：暖阳西斜 + 蓝紫天光
const hemi = new THREE.HemisphereLight(0xa9bcf2, 0xffd9ae, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd9a6, 2.0);
sun.position.set(38, 44, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;  sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = .45;
sun.shadow.camera.updateProjectionMatrix();   // 改视锥后必须手动刷新，否则阴影相机仍是默认 ±1 小框
scene.add(sun);
scene.add(new THREE.AmbientLight(0x8d7fb8, .55));

// 世界组：浮岛 + 城堡 + 人物一起缓缓起伏（“漂浮”感）
const world = new THREE.Group(); scene.add(world);

/* ============================================================
   二、小工具
   ============================================================ */
function box(w,h,d,mat,x=0,y=0,z=0,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry; return m;
}
function cyl(rt,rb,h,seg,mat,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); return m;
}
function cone(r,h,seg,mat,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), mat);
  m.position.set(x,y,z); return m;
}
function sph(r,mat,x=0,y=0,z=0,sx=1,sy=1,sz=1){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,14,10), mat);
  m.position.set(x,y,z); m.scale.set(sx,sy,sz); return m;
}

// 人物名牌（Canvas Sprite）
const labelGroup = new THREE.Group(); scene.add(labelGroup);
const labelsOn = { v: true };
function makeLabel(text, parent, dy){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 72;
  const c = cv.getContext('2d');
  c.font = '600 30px "Noto Serif SC","Microsoft YaHei",serif';
  const w = c.measureText(text).width + 40;
  c.fillStyle = 'rgba(252,244,226,.92)';
  const x0 = 128 - w/2, y0 = 10, h = 52, r = 22;
  c.beginPath();
  c.moveTo(x0+r,y0); c.arcTo(x0+w,y0,x0+w,y0+h,r); c.arcTo(x0+w,y0+h,x0,y0+h,r);
  c.arcTo(x0,y0+h,x0,y0,r); c.arcTo(x0,y0,x0+w,y0,r); c.closePath(); c.fill();
  c.strokeStyle='rgba(180,140,90,.8)'; c.lineWidth=3; c.stroke();
  c.fillStyle = '#5a4022'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text, 128, 37);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthWrite:false }));
  sp.scale.set(2.4, .68, 1);
  sp.position.set(0, dy, 0);
  parent.add(sp);
  labelGroup.userData.keep = labelGroup; // sprites stay parented; toggled below
}
const allLabels = [];
function addLabel(text, parent, dy){
  makeLabel(text, parent, dy);
  parent.traverse(o => { if (o.isSprite) allLabels.push(o); });
}

/* ============================================================
   三、天空 —— 巨大的黄昏渐变球 + 星星 + 落日 + 远星
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  uniforms:{},
  vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vP;
    void main(){
      float h = normalize(vP).y;                 // -1..1
      vec3 top  = vec3(0.36,0.42,0.66);          // 暮紫蓝
      vec3 mid  = vec3(0.94,0.70,0.55);          // 杏橙
      vec3 low  = vec3(0.99,0.87,0.70);          // 米金
      vec3 col = h>0.12 ? mix(mid,top, smoothstep(0.12,0.75,h))
                        : mix(low,mid, smoothstep(-0.45,0.12,h));
      gl_FragColor = vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400,24,16), skyMat));

// 星星（上半球多点，闪烁）
const starGeo = new THREE.BufferGeometry();
{
  const N=900, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*0.9); // 偏上
    const r=380;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph)*0.85+40;
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
}
const starMat = new THREE.PointsMaterial({ color:0xfff4d2, size:1.9, sizeAttenuation:true,
  transparent:true, opacity:.9, depthWrite:false });
const stars = new THREE.Points(starGeo, starMat); scene.add(stars);

// 落日 + 光晕
const sunBall = sph(7, new THREE.MeshBasicMaterial({color:0xffe9b0}), -170, 70, -210);
scene.add(sunBall);
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(14,16,12),
  new THREE.MeshBasicMaterial({color:0xffd9a0, transparent:true, opacity:.28, depthWrite:false}));
sunGlow.position.copy(sunBall.position); scene.add(sunGlow);

// 远处的行星（带环）
function farPlanet(r, c, x,y,z, ring){
  const g = new THREE.Group();
  g.add(sph(r, T(c), 0,0,0));
  if(ring){
    const rg = new THREE.Mesh(new THREE.TorusGeometry(r*1.7, r*.12, 8, 40), T(0xf3e0b8));
    rg.rotation.x = Math.PI/2.4; g.add(rg);
  }
  g.position.set(x,y,z); scene.add(g); return g;
}
farPlanet(5, 0xc9a9d8, -120, 60, -60, true);
farPlanet(3, 0x9fc9b8, 100, 85, -140, false);
farPlanet(7, 0xe8c89a, 210, 40, -60, true);

/* ============================================================
   四、浮空岛 —— 低多边形地形（草原/丘陵/池塘/岩崖/倒锥底）
   ============================================================ */
const island = new THREE.Group(); world.add(island);

// 岛缘半径（随角度起伏）
function rimRadius(th){
  return 25 + 2.5*Math.sin(3*th+1) + 1.5*Math.sin(7*th) + Math.sin(th*2.3)*1.2;
}
// 地形高度场
const plateau = { x:-4, z:-2, r:11, h:2.5 };       // 城堡高台
function groundH(x,z){
  let h = .45*Math.sin(x*.16+1.2)*Math.cos(z*.14) + .3*Math.sin(x*.34)*Math.sin(z*.42);
  const d1 = Math.hypot(x-plateau.x, z-plateau.z);
  h += plateau.h * Math.max(0, 1 - d1*d1/(plateau.r*plateau.r*.8));   // 城堡台地
  const d2 = Math.hypot(x-13, z+9);
  h += 1.7 * Math.max(0, 1 - d2*d2/40);                                // 风车丘陵
  const d3 = Math.hypot(x-0, z-19);
  h += 1.1 * Math.max(0, 1 - d3*d3/30);                                // 观星丘
  const d4 = Math.hypot(x-5.5, z-14.5);
  h -= 1.6 * Math.max(0, 1 - d4*d4/12);                                // 池塘凹地
  const d5 = Math.hypot(x+15, z+7);
  h += 1.2 * Math.max(0, 1 - d5*d5/42);                                // 松林坡
  return h;
}
{
  // 顶面 + 崖裙（一个连续的径向网格）
  const SEG=30, rows=[];
  const verts=[], idx=[];
  rows.push(0); // 顶面环半径比例
  for(let i=1;i<=5;i++) rows.push(i/5);
  const skirt = [1.03, 1.10, 1.22, 1.38];   // 崖壁下坠
  let vi=0;
  // 中心点
  verts.push(0, groundH(0,0)+.1, 0); vi=1;
  for(let i=1;i<rows.length;i++){           // 顶面
    const f=rows[i];
    for(let j=0;j<SEG;j++){
      const th=j/SEG*Math.PI*2, R=rimRadius(th)*f;
      const x=Math.cos(th)*R, z=Math.sin(th)*R;
      const drop = i===5 ? 0 : 0;
      verts.push(x, groundH(x,z) + (i===5? -0.15:0), z);
    }
  }
  const baseIdx = 1 + (rows.length-1)*SEG;
  for(let k=0;k<skirt.length;k++){          // 崖裙下坠
    const f=skirt[k], yy = -2.2 - k*2.6;
    for(let j=0;j<SEG;j++){
      const th=j/SEG*Math.PI*2, R=rimRadius(th)*f;
      verts.push(Math.cos(th)*R + (k>1?Math.sin(th*9)*.7:0), yy + Math.sin(j*2.7+k)*.6, Math.sin(th)*R);
    }
  }
  const totalRings = (rows.length-1)+skirt.length;
  // 索引：缠绕方向使整个连续曲面法线朝外（顶面朝上、崖壁朝外）
  for(let j=0;j<SEG;j++) idx.push(0, 1+(j+1)%SEG, 1+j);
  for(let r=0;r<totalRings-1;r++){
    const a = 1 + r*SEG, b = a+SEG;
    for(let j=0;j<SEG;j++){
      const j2=(j+1)%SEG;
      idx.push(a+j, a+j2, b+j);
      idx.push(b+j, a+j2, b+j2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  // 顶点色：草色 → 台地土色 → 崖壁岩色
  const p = geo.attributes.position, col=[];
  const cGrass=new THREE.Color(0xabcf90), cGrass2=new THREE.Color(0xcaddac),
        cDirt=new THREE.Color(0xd4bd93), cRock=new THREE.Color(0xa8958d), cDeep=new THREE.Color(0x7d6c72);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    if(y < -1.2){ col.push(...cRock.clone().lerp(cDeep, Math.min(1,-(y+1.2)/9)).toArray()); continue; }
    const d1=Math.hypot(x-plateau.x,z-plateau.z);
    let c = cGrass.clone().lerp(cGrass2, (Math.sin(x*.5)*Math.sin(z*.5)+1)/2);
    if(d1 < plateau.r*.95 && y>1.4) c.lerp(cDirt, .55);
    col.push(...c.toArray());
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  const top = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ vertexColors:true, gradientMap:gradTex }));
  top.receiveShadow = true; island.add(top);
}

// 岛底倒锥岩核 + 垂挂的浮岩
island.add(cone(.8, 15, 9, T(0x7a6a68), 0, -13.5, 0));
island.add(cone(6.5, 9, 9, T(0x8d7c77), 0, -7.5, 0));
for(let i=0;i<5;i++){
  island.add(cone(.5+i*.15, 2.2, 6, T(0x6d5e60),
    Math.sin(i*2.4)*3.2, -20-i*3.5, Math.cos(i*1.7)*3, ));
}
// 垂藤（细柱）
for(let i=0;i<7;i++){
  const th=i*2.1, r=6+Math.random()*8;
  island.add(cyl(.06,.02, 4+Math.random()*5, 5, T(0x7fa07a), Math.cos(th)*r, -3.5-Math.random()*3, Math.sin(th)*r));
}

/* ============================================================
   五、城堡 —— 城墙/塔楼/门楼/主塔(四层)/礼拜堂/内庭
   ============================================================ */
const CASTLE = new THREE.Group(); world.add(CASTLE);
const roofParts = [];                                   // 剖视时隐藏的屋顶（保持原父级，只切可见性）
const nearWalls = [];                                   // 剖视时隐藏的近侧墙体
const CY0 = 2.55;                                       // 台地面层高度
const C = { x:-4, z:-2 };                              // 城墙圆心
const K = { x:-5.5, z:-4, hx:3, hz:2.5 };              // 主塔中心与半宽

const STONE = T(0xefe3c8), STONE2 = T(0xe3d3b2), STONE_D = T(0xd9c6a0);
const ROOF  = T(0xdf8f66), ROOF2 = T(0xc9765a), WOOD = T(0x9a6b45), WOOD2 = T(0x7c5334);
const GOLD  = T(0xf2c14e);

function inCastle(g){ CASTLE.add(g); return g; }
function inRoof(m){ roofParts.push(m); return m; }

/* ---- 5.1 环形城墙 + 雉堞 ---- */
{
  const SEG=14, R=9.5, WH=3.2;
  const crenelMats = [];
  for(let s=0;s<SEG;s++){
    const a0=s/SEG*Math.PI*2, a1=(s+1)/SEG*Math.PI*2, am=(a0+a1)/2;
    const x0=C.x+Math.cos(a0)*R, z0=C.z+Math.sin(a0)*R;
    const x1=C.x+Math.cos(a1)*R, z1=C.z+Math.sin(a1)*R;
    const len=Math.hypot(x1-x0,z1-z0)+.25;
    const mx=(x0+x1)/2, mz=(z0+z1)/2;
    const ry = Math.atan2(x1-x0, z1-z0) + Math.PI/2;
    // 门楼处留缺口（角度 40° 附近一段）
    let deg = am*180/Math.PI; if(deg<0) deg+=360;
    if(deg>25 && deg<62) continue;                 // 缺口给城门
    const seg = new THREE.Group();
    seg.add(box(len, WH, .8, STONE, 0, CY0+WH/2, 0));
    seg.add(box(len, .35, 1.15, STONE2, 0, CY0+WH+.1, 0));
    // 雉堞
    const n = Math.max(3, Math.round(len/1.1));
    for(let i=0;i<n;i++){
      if(i%2===1) continue;
      seg.add(box(len/n*.9, .65, .5, STONE2, -len/2 + (i+.5)*len/n, CY0+WH+.6, 0));
    }
    seg.position.set(mx, 0, mz); seg.rotation.y = ry - Math.PI/2;
    // 标记朝向东南（来客视角方向）的墙段 → 剖视隐藏
    if((deg >= 0 && deg <= 155) || deg >= 335) nearWalls.push(seg);
    inCastle(seg);
  }
}

/* ---- 5.2 三座圆塔（城墙外侧） ---- */
function wallTower(deg, r=1.75, h=5.6, coneH=2.6){
  const th = deg*Math.PI/180, R=9.5;
  const x=C.x+Math.cos(th)*R, z=C.z+Math.sin(th)*R;
  const g=new THREE.Group(); g.position.set(x,0,z);
  g.add(cyl(r, r+.25, h, 10, STONE, 0, CY0+h/2, 0));
  g.add(cyl(r+.35, r+.35, .4, 10, STONE2, 0, CY0+h+.1, 0));
  for(let i=0;i<10;i+=2){

const people = [];
function makePerson({coat, pants=0x4a5b8c, skin=0xf6d5b0, hair=0x5a4030, hat=null, accent=0xffffff, label}){
  const g=new THREE.Group();
  const body=cyl(.22,.3,.85,8,T(coat),0,.55,0); g.add(body);
  const head=sph(.24,T(skin),0,1.15,0); g.add(head);
  g.add(sph(.25,T(hair),0,1.24,-.02,1,.75,1));
  if(hat){ // hat: [color, h, r]
    g.add(cyl(hat[2]*.55,hat[2]*.6,hat[1],10,T(hat[0]),0,1.24+hat[1]/2,.0));
    g.add(cyl(hat[2]+.12,hat[2]+.12,.06,12,T(hat[0]),0,1.25,0));
  }
  for(const s of[-1,1]){
    const arm=box(.1,.5,.1,T(coat),s*.3,.66,0); arm.rotation.z=s*.18; g.add(arm);
    g.add(box(.12,.55,.12,T(pants),s*.12,.22,0));
  }
  if(label) addLabel(label, g, 1.9);
  g.userData={}; g.castShadow=true;
  g.traverse(o=>o.castShadow=true);
  people.push(g);
  return g;
}

    d:'<b>主塔 · 第三层 书房</b>七层彩色书脊、地球仪、架在木座上的望远镜，桌上摊着画了九颗星的羊皮星图。地理学家从不下海，却记得每一座山的名字——他的书里有整个浮空岛。'},
  { n:'塔顶卧室', pos:[K.x+2,KEEP_FLOORS[3]+2.3,K.z+9.5], tgt:[K.x-.5,KEEP_FLOORS[3]+1,K.z], cut:true,
    d:'<b>主塔 · 第四层 小王子的卧室</b>红毯小床，窗台柜，脚边一只画着三孔的木箱——“你要的绵羊就睡在里面。”这是小王子的房间，不过这会儿他人在楼下花坛边，正替玫瑰挡风；墙垛外，刚好看得见他自己那颗星星。'},
  { n:'村庄 · 瀑布 · 星丘', pos:[30,16,26], tgt:[7,2,5], cut:false,
    d:'<b>岛的东南角</b>磨坊主的风车在坡上转，拾穗的女孩穿过麦田。池塘漫过岛缘化作瀑布，在风里散成发亮的水点坠向云海。观星丘上有长椅、点亮的街灯和一座转动的镀金浑天仪——点灯人每晚在这里点亮星星。'},
];

let fly=null;
function goto(i, instant){
  const p=presets[i];
  document.querySelectorAll('#bar button[data-preset]').forEach(b=>b.classList.toggle('on', +b.dataset.preset===i));
  setCut(p.cut);
  if(instant){
    camera.position.set(...p.pos); controls.target.set(...p.tgt); fly=null;
    showCaption(p.d); return;
  }
  const from = { px:camera.position.x, py:camera.position.y, pz:camera.position.z,
                 tx:controls.target.x, ty:controls.target.y, tz:controls.target.z };
  fly = { t:0, dur:1.3, from, to:{ px:p.pos[0], py:p.pos[1], pz:p.pos[2],
                                   tx:p.tgt[0], ty:p.tgt[1], tz:p.tgt[2] } };
  showCaption(p.d);
}
let cutOn=false;
function setCut(on){
  cutOn=on;
  roofParts.forEach(m=>m.visible=!on);
  nearWalls.forEach(w=>w.visible=!on);
  document.getElementById('cut').classList.toggle('on', on);
}
document.querySelectorAll('#bar button[data-preset]').forEach(b=>b.onclick=()=>goto(+b.dataset.preset));
document.getElementById('cut').onclick=()=>{ setCut(!cutOn); showCutToast(); };
function showCutToast(){
  showCaption(cutOn
    ? '<b>剖视图 · 已开启</b>隐藏了朝向你的外墙与屋顶：主塔四层（厨房→大厅→书房→卧室）与螺旋角楼一览无余。再按一次 C 恢复完整外观。'
    : '<b>外观完整</b>屋顶与外墙已归位，城堡重新变回一座完整的石头城堡。');
}
document.getElementById('labels').onclick=(e)=>{
  labelsOn.v=!labelsOn.v;
  allLabels.forEach(l=>l.visible=labelsOn.v);
  e.target.classList.toggle('on', labelsOn.v);
};
document.getElementById('labels').classList.add('on');
document.getElementById('tour').onclick=(e)=>{
  controls.autoRotate=!controls.autoRotate;
  e.target.classList.toggle('on', controls.autoRotate);
};
addEventListener('keydown', e=>{
  if(e.key>='1'&&e.key<='8') goto(+e.key-1);
  if(e.key==='c'||e.key==='C') { setCut(!cutOn); showCutToast(); }
  if(e.key==='r'||e.key==='R') goto(0);
});

// 指针打断飞行
renderer.domElement.addEventListener('pointerdown', ()=>fly=null);

/* ============================================================
   十、动画循环
   ============================================================ */
const clock = new THREE.Clock();
let lastFirefly = 0;
function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function tick(){
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  // 相机飞行
  if(fly){
    fly.t += dt/fly.dur;
    const k = ease(Math.min(fly.t,1));
    camera.position.set(THREE.MathUtils.lerp(fly.from.px,fly.to.px,k),
                        THREE.MathUtils.lerp(fly.from.py,fly.to.py,k),
                        THREE.MathUtils.lerp(fly.from.pz,fly.to.pz,k));
    controls.target.set(THREE.MathUtils.lerp(fly.from.tx,fly.to.tx,k),
                        THREE.MathUtils.lerp(fly.from.ty,fly.to.ty,k),
                        THREE.MathUtils.lerp(fly.from.tz,fly.to.tz,k));
    if(fly.t>=1) fly=null;
  }
  controls.update();

  // 岛屿（连同城堡与人物）缓缓起伏
  world.position.y = Math.sin(t*.5)*.18;
  world.rotation.y = Math.sin(t*.1)*.015;

  // 风车 / 转子
  island.userData.mill.userData.rotor.rotation.z += dt*1.1;
  island.userData.armilla.rotation.y += dt*.35;
  if(CASTLE.userData.weathervanes) CASTLE.userData.weathervanes.forEach((w,i)=>{ w.rotation.y = Math.sin(t*.6+i)*1.2; });

  // 星星呼吸
  starMat.opacity = .72 + .2*Math.sin(t*1.4);
  sunGlow.scale.setScalar(1+Math.sin(t*.9)*.06);

  // 云绕岛飘
  clouds.forEach(c=>{
    c.userData.a += c.userData.sp*dt;
    c.position.x = Math.cos(c.userData.a)*c.userData.r;
    c.position.z = Math.sin(c.userData.a)*c.userData.r;
    c.position.y = c.userData.y + Math.sin(t*.4+c.userData.a)*.4;
  });

  // B612 自转公转
  const B=scene.userData.B612;
  B.rotation.y += dt*.4;
  B.position.x = Math.cos(t*.07)*30;
  B.position.z = Math.sin(t*.07)*30;
  B.position.y = 15 + Math.sin(t*.3)*1.5;

  // 鸟
  birds.forEach((b,i)=>{
    b.userData.a += dt*b.userData.sp;
    b.position.set(C.x+Math.cos(b.userData.a)*b.userData.r,
                   b.userData.y+Math.sin(t*2+i)*.5,
                   C.z+Math.sin(b.userData.a)*b.userData.r);
    b.rotation.y = -b.userData.a + Math.PI/2;
    const f = Math.sin(t*9+i*2)*.7;
    b.userData.wl.rotation.z = f; b.userData.wr.rotation.z = -f;
  });

  // 瀑布粒子
  {
    const p=fall.pts.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      let y=p.getY(i) - fall.data[i*2]*dt;
      let x=p.getX(i) + dt*.15;
      if(y < -24){ x=fall.origin.x+(Math.random()-.5)*1.1; y=groundH(x,fall.origin.z)+.1; }
      p.setXYZ(i, x, y, fall.origin.z+(Math.random()-.5)*1.1);
    }
    p.needsUpdate=true;
  }

  // 人物轻晃 + 小王子的围巾
  people.forEach((pp,i)=>{
    pp.position.y += 0; // 位置固定；用 children bob 更稳
    pp.children[1].position.y = 1.15 + Math.sin(t*1.8+i*1.3)*.03;
  });
  prince.userData.scarf.forEach((s,i)=>{
    s.position.y = 1.02 + Math.sin(t*2.2 - i*.55)*.07;
    s.position.z = .2 + Math.cos(t*2.2 - i*.55)*.06;
    s.rotation.x = Math.sin(t*2.2 - i*.55)*.25;
  });
  // 商人抬头数星星
  biz.rotation.y = Math.sin(t*.5)*.5 + .6;
  // 羊慢慢踱步
  const sheep=CASTLE.userData.sheep;
  sheep.position.x = -1.2 + Math.sin(t*.35)*.8;
  sheep.rotation.y = Math.cos(t*.35)>0 ? .2 : -2.9;
  // 酒鬼打晃
  drunk.rotation.z = .12 + Math.sin(t*1.7)*.05;

  // 灯火摇曳
  const flick = (base, ph)=> base + Math.sin(t*13+ph)*base*.12 + Math.sin(t*7.3+ph*2)*base*.08;
  scene.traverse(o=>{
    if(o.isPointLight){
      if(o.userData.base===undefined) o.userData.base=o.intensity;
      o.intensity = flick(o.userData.base, o.position.x*3+o.position.z);
    }
  });

  // 萤火虫游动
  {
    const p=firefly.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      const sx=ffSeed[i*3], sy=ffSeed[i*3+1], sz=ffSeed[i*3+2];
      p.setXYZ(i,
        p.getX(i) + Math.sin(t*.6+sx)*dt*.6,
        p.getY(i) + Math.sin(t*.9+sy)*dt*.4,
        p.getZ(i) + Math.cos(t*.6+sz)*dt*.6);
    }
    p.needsUpdate=true;
    fireflyMat.opacity = .55+.4*Math.sin(t*2.1);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* --- 开幕 --- */
tick();
setTimeout(()=>{
  const f=document.getElementById('fade');
  f.style.opacity=0; f.style.pointerEvents='none';
  const hh = location.hash.match(/view=(\d)/);          // #view=1..8 直达预设视角（跳过飞行动画）
  const hhN = hh ? Math.min(8, Math.max(1, +hh[1])) : null;
  goto(hhN ? hhN-1 : 0, !!hhN);
  setTimeout(()=>{ if(!hhN){ controls.autoRotate=true; document.getElementById('tour').classList.add('on'); } }, 2600);
}, 400);
</script>
