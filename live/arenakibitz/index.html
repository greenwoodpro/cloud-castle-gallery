内墙比外墙低矮，开有宽窗与木质回廊。井壁直通岛体中的蓄水层，井边的石槽收集雨水；墙根木箱分别存放盐、灯油与冬季柴薪。",details:[{label:"庭院设施",value:"古井、晾衣绳、菜箱、公告架与靠墙长凳"},{label:"社交规则",value:"靠近的闲散居民会停下交谈，再各自返回工作"},{label:"夜间变化",value:"灯笼点亮，萤火从花坛升起，巡逻仍会继续"}],ambience:"这里最适合观察人物作息；点击任意居民，可以读到他此刻正在做什么。"},{id:"great-hall",name:"大厅、厨房与吟游席",shortName:"城堡大厅",category:"城堡",eyebrow:"KEEP · 公共生活层",position:[1.7,4.7,-.8],camera:[11,8.5,9],target:[1.5,2,-.8],interior:!0,description:"大厅的长桌并非为了盛宴，而是让所有工作的人都能在同一张桌上吃饭。桌面留着刀痕与热汤锅的圆印，北墙石炉负责取暖，西侧小门通向厨房。尽头略高的平台不是王座，而是一张读写岛务账目的书桌和给吟游诗人坐的木凳。",architecture:"大厅为木梁承重的双坡顶空间，高窗把日光投成柔和的色块。厨房设有石灶、排烟罩、铜锅、揉面台与储粮瓮；餐具沿墙挂放，避免潮气。",details:[{label:"可见陈设",value:"长桌、条凳、烛台、壁炉、餐具、梁下旗帜与乐师席"},{label:"厨房动线",value:"储粮瓮 → 揉面台 → 石灶 → 大厅侧门"},{label:"居民故事",value:"米蕾烤面包，芙蕾雅在雨天来此练琴，管家核对账目"}],ambience:"开启“城堡剖面”后，屋顶与前墙会淡出，可查看完整的梁架和室内家具。"},{id:"royal-chamber",name:"领主居室与抄经书房",shortName:"领主书房",category:"城堡",eyebrow:"KEEP · 第二层",position:[-3,7.4,-1],camera:[7,11.5,9],target:[-3,6.2,-1],interior:!0,description:"所谓领主居室，其实更像一位植物学者的私人房间。床幔是褪色的鼠尾草绿，窗边桌上摊着岛屿水位记录和未寄出的信。罗莎琳把历代账本开放给抄写员使用，因此房里总有两把椅子：一把读书，一把等来访者。",architecture:"主塔第二层由厚石墙与木楼板构成，壁炉与下层烟道共用。窄窗洞外侧狭窄、内侧展开为读书壁龛；地毯和挂毡降低石室回声，床下木箱保存冬衣。",details:[{label:"房间分区",value:"睡眠壁龛、书信桌、开放书架、壁炉与衣帽柜"},{label:"藏书内容",value:"航空气象、草药图谱、修桥手册与岛屿家书"},{label:"留意人物",value:"罗莎琳在午后整理水位记录，索菲亚来此抄写"}],ambience:"把世界时间调至夜晚，窗光会逐渐变暖；开启剖面后可同时看见书桌、床幔与壁炉。"},{id:"observatory",name:"星象塔与风向仪",shortName:"星象塔",category:"城堡",eyebrow:"KEEP · 屋顶之上",position:[-3,11.5,-1],camera:[8,16,10],target:[-3,9.4,-1],interior:!0,description:"主塔顶端没有设防御垛口，而是架起一座小小的黄铜望远镜。埃尔文在这里记录云朵移动的方向，也用星图判断浮岛是否偏离旧航路。地板中央摆着一座手动星盘，转动外圈，代表岛屿的小铜球便绕太阳缓慢行走。",architecture:"八角木构观测亭坐落在主塔平屋顶上，可拆卸的顶棚让望远镜直接朝向天空。石阶沿塔内墙盘旋而上，最后一级窄得只容一人通过。",details:[{label:"观测器具",value:"折射望远镜、星盘、风向标、沙漏与手抄星图"},{label:"夜间作息",value:"大多数居民归家后，埃尔文仍会登上塔顶观星"},{label:"天空系统",value:"太阳、月亮、星野与天光颜色均由世界时间驱动"}],ambience:"把世界时间调至夜晚，再将镜头拉近，能看到星野在亭顶缓慢浮现。"},{id:"chapel",name:"彩窗礼拜堂",shortName:"彩窗礼拜堂",category:"城堡",eyebrow:"CASTLE · 西侧静室",position:[-6.2,5,-.2],camera:[-15,8.5,10],target:[-6.2,2,-.2],interior:!0,description:"小小的礼拜堂没有高耸入云的尖塔，只有一扇把清晨染成蓝紫色的彩窗。六排短椅朝向石砌祭台，侧墙摆着旅人留下的木牌：有人祈求顺风，有人只是感谢岛上的一顿热饭。这里也是暴雨时最安静的避雨处。",architecture:"单中厅平面连接半圆后殿，筒形石拱承担屋顶重量。彩窗以铅条拼接抽象的花、星与河流图案；祭台下方小室存放蜡烛和修缮工具。",details:[{label:"室内陈设",value:"六排木椅、石祭台、许愿木牌、烛架与手抄诗集"},{label:"光线变化",value:"彩窗随日照改变亮度，夜间只保留烛光"},{label:"留意人物",value:"安塞尔清晨整理烛台，诺拉雨天会来安静坐一会儿"}],ambience:"这里的声音比其他地点更轻；开启环境音后，风铃之间偶有很远的钟音。"},{id:"rose-garden",name:"玫瑰温室与药草园",shortName:"玫瑰温室",category:"岛屿",eyebrow:"ISLAND · 西南向阳坡",position:[-9,2,8],camera:[-17,8,18],target:[-9,.9,8],description:"玻璃温室里只种着一株需要每天交谈的玫瑰，其余位置都让给了实用的薄荷、鼠尾草与金盏花。伊妮德坚持给每一垄植物留出手写的木牌，因为“名字会让照料变得具体”。温室外的蜂箱为果园授粉，也供给大厅蜡烛。",architecture:"温室用浅色木框与半透玻璃搭建，屋脊设有可开启的通风窗。石砌矮墙在夜间释放白天储存的热量，雨水从檐沟流入旁边的木桶。",details:[{label:"植物分区",value:"单株玫瑰、三垄药草、育苗架与堆肥角"},{label:"生态联系",value:"蜂箱 → 果园授粉；药草 → 诺拉的诊疗小屋"},{label:"天气响应",value:"阵风会让蝴蝶偏离花丛，阵雨来临时它们会躲藏"}],ambience:"白天可见蝴蝶环绕温室与花丛；它们的飞行中心、振翅和风向偏移均由实时状态驱动。"},{id:"mill",name:"星河水磨坊",shortName:"河畔磨坊",category:"岛屿",eyebrow:"ISLAND · 东岸河谷",position:[10,4.5,3.8],camera:[21,9,15],target:[9,1.5,3.5],description:"河水从岛北浅潭出发，绕过芦苇与三块大石，推动一架低速木水轮，最后从岛缘坠入云海。磨坊底层是齿轮与磨盘，上层储存麦袋；卢卡斯能凭水轮声音判断河道里是否卡了树枝。",architecture:"磨坊采用石基木架结构，外墙板刷成灰绿。水轮、水平轴与木制齿轮构成真实可见的传动关系，屋顶小吊梁用于把麦袋送上阁楼。",details:[{label:"内部构造",value:"水轮轴、减速齿轮、双磨盘、筛粉槽与麦袋阁楼"},{label:"河流走向",value:"北潭 → 林地浅滩 → 磨坊 → 东南悬空瀑布"},{label:"动态细节",value:"水轮持续转动，瀑布颗粒与水雾受风力影响"}],ambience:"水面使用流动波纹着色器；靠近时可以观察泡沫、水轮和下落的水雾。"},{id:"terraces",name:"北坡梯田与苹果园",shortName:"梯田果园",category:"岛屿",eyebrow:"ISLAND · 北侧耕作带",position:[-6.5,2,-10.5],camera:[-18,11,-20],target:[-6.5,.8,-10],description:"北坡被修整成三层并不完全规则的梯田，分别种麦、豆与休耕花带。石埂顺着地势弯曲，既能挡住雨水，也给蜥蜴留下晒背的地方。再往下是十二棵老苹果树，树间的蜂箱与温室遥相呼应。",architecture:"每层梯田都有干砌石挡墙、浅排水沟和仅容手推车通过的土路。打谷棚没有门，收获时也是临时饭棚；墙角靠着镰刀、木耙和修墙用的石块。",details:[{label:"地利用",value:"麦作层、豆作层、花带休耕层与十二株果树"},{label:"季节痕迹",value:"草色、树冠与作物色调随岛务面板中的季节设置变化"},{label:"留意人物",value:"汤姆在附近放羊，贝尔纳常来检查挡墙裂缝"}],ambience:"羊群会啃草、休息、寻找邻居；人靠得太近时，它们会主动让开道路。"},{id:"forest",name:"眠云混交林",shortName:"眠云森林",category:"岛屿",eyebrow:"ISLAND · 西侧生态带",position:[-12,4,-3],camera:[-24,10,7],target:[-11.5,1.5,-3],description:"西侧森林不是整齐的木料场，而是由松树、桦树和低矮榛丛组成的混交林。倒木被特意留在原地，成为苔藓与蘑菇的家。林边有一条只容步行的小径，采药人诺拉每日沿着它寻找伞菌和椴树花。",architecture:"林地中央保留一片空隙，石块围成不点火的休息圈。护林小屋用旧船木修建，储藏种子的陶罐挂在梁上，避免被鼠类啃食。",details:[{label:"植被层次",value:"高大针叶树、浅色阔叶树、榛丛、蕨与倒木苔藓"},{label:"野生动物",value:"鸟群环绕林冠，夜间萤火在花丛与林地边缘出现"},{label:"风场响应",value:"林冠摆动、云层漂移与飞鸟转向共同受风速影响"}],ambience:"增大风速可看到林冠、旗帜、云和粒子同时改变；这是一套共享的世界风场。"},{id:"undercliff",name:"倒悬岩层与根之廊",shortName:"岛底岩层",category:"地下",eyebrow:"UNDERGROUND · 岛体剖面",position:[4,-6,5],camera:[21,-2,22],target:[3,-7,3],description:"从岛缘向下看，草地只占了很薄的一层。其下依次是富含石英的浅色岩带、被水流染蓝的古老断层面，以及收束成尖顶的玄武岩核。老树根沿裂隙向下延伸，小岛并非靠魔法凭空漂浮，而像是仍记得一座消失的山。",architecture:"城堡地窖嵌入岛体上部，拱顶储藏室存放木桶、腌菜与备用灯油。再深处是不对居民开放的天然晶洞，地下水从蓝色矿脉旁渗出，汇入东侧河道。",details:[{label:"岩层顺序",value:"草皮 → 石灰岩 → 水蚀层 → 石英脉 → 玄武岩核"},{label:"地窖用途",value:"恒温储粮、木桶陈放、冬季根菜与维修物料"},{label:"环境运动",value:"岛底碎石缓慢漂浮，瀑布水雾向云海中消散"}],ambience:"自由视角可以转到岛屿下方；此处没有视角禁区，能完整观察浮岛的倒悬结构。"}],_o=[{id:"rosalind",name:"罗莎琳",role:"岛务领主",home:[-3,3.65,-1],work:[-1,.35,1.7],color:"#7c8fb2",accent:"#d8b56a",trait:"温和、严谨，总带着水位记录册",story:"她继承的不是一项头衔，而是一册写满修桥、疏河与储粮方法的岛务日志。每天午后，她都会去井边核对水位。",lines:["岛漂浮得稳不稳，要看河里有没有倒影。","如果你见到埃尔文，请告诉他给望远镜盖上布。","晚餐桌上永远多留一把椅子。"]},{id:"otto",name:"奥托",role:"城门看守",home:[-1.8,.35,5],work:[-.3,.35,5.2],color:"#9b695b",accent:"#d2c2a1",trait:"嗓门很大，却记得每个孩子的名字",story:"曾在云海航船上当舵手，如今把升降闸门当作另一种船帆。他的抽屉里收藏着各地带来的纽扣。",lines:["吊桥放下的声音，是城堡在说早安。","雨天进门先蹭蹭靴子，米蕾刚擦过地。","风从西北来时，最好别站在旗杆下面。"]},{id:"mireille",name:"米蕾",role:"面包师与厨娘",home:[1,.35,-3.5],work:[2.5,.35,-1.8],color:"#c7876f",accent:"#f1ddbb",trait:"动作利落，会给失败的面团起名字",story:"她用苹果木烤黑麦面包，也把每天第一炉最丑的一只留在窗台，喂给准时到来的鸟。",lines:["面团和云一样，催得太急就没有孔洞。","闻到了吗？第二炉加了花园里的小茴香。","别碰那只铜锅，它比我的年纪还大。"]},{id:"cedric",name:"塞德里克",role:"铁匠",home:[5.8,.25,4.6],work:[6.8,.25,3.8],color:"#596d72",accent:"#c78b59",trait:"沉默，锻造时却哼着不完整的歌",story:"他负责修马蹄铁，也负责修温室最细的铰链。工坊门口挂着一块“能修就别丢”的旧铁牌。",lines:["岛底那些石头？我只敲过一次，回声像钟。","好的铰链不该让人注意到它。","等这炉火小一点，我给你看新打的玫瑰钉。"]},{id:"ynid",name:"伊妮德",role:"园丁与养蜂人",home:[-9.5,.25,8.5],work:[-8.5,.25,7.2],color:"#81966a",accent:"#d9a0a0",trait:"相信植物能分辨敷衍与真心",story:"她每日记录玫瑰叶片的朝向，却从不把它关在玻璃罩里。温室最暖的一角始终留给迷路的昆虫。",lines:["玫瑰不需要玻璃罩，需要有人记得回来。","薄荷已经越过木牌了，它总想去看河。","别赶那只蜂，它比我们都熟悉近路。"]},{id:"lucas",name:"卢卡斯",role:"磨坊主",home:[9,.25,4.8],work:[8.8,.25,2.8],color:"#6f8f91",accent:"#d4c39b",trait:"能从水声里听出天气变化",story:"他熟悉每一粒麦子的来处，也熟悉河底每一块会移动的白石。水轮轴上刻着他和父亲共同计算过的齿数。",lines:["今天水轮声发闷，上游大概落了树枝。","瀑布没有消失，只是变成了别处的雨。","新磨的粉还温着，替我带一袋给米蕾。"]},{id:"nora",name:"诺拉",role:"采药人与医师",home:[-11,.25,-2],work:[-8.7,.25,7.6],color:"#728b7a",accent:"#c9b8d2",trait:"脚步很轻，口袋里总有干叶与绷带",story:"她把森林当作需要问诊的同伴，从不在同一处采完所有草药。礼拜堂安静的长椅是她雨天写药谱的地方。",lines:["椴树花要留一半给蜂，另一半才够煮茶。","这不是杂草，是把自己种在这里的车前草。","睡不着我给你一包香蜂草，不苦。"]},{id:"pip",name:"皮普",role:"马厩与信使",home:[6.4,.25,5.2],work:[5.7,.25,6.8],color:"#b68554",accent:"#657e9f",trait:"跑得快，记得每条小路的捷径",story:"岛上没有远方可送信，他便替居民传递那些不好意思亲口说的话。小马栗子和他是从小一起长大的。",lines:["栗子知道回家的路了，我有时还不知道。","这封信不能给你看，但里面大概是一句道歉。","从果园后面穿过去，能少绕一座墙。"]},{id:"bernard",name:"贝尔纳",role:"石匠",home:[-6.5,.25,-9.5],work:[-7.2,.25,-8.4],color:"#8a8178",accent:"#bfa77e",trait:"尊重旧墙，每块石头都先听再敲",story:"城堡墙上颜色稍浅的石块大多出自他手。他不把修补痕迹藏起来，因为那也是岛屿继续活下去的证据。",lines:["新石头不必装成旧石头，时间自己会做。","梯田这道裂缝还浅，今晚就能补好。","你听，空心的墙和结实的墙声音不同。"]},{id:"sophia",name:"索菲亚",role:"抄写员",home:[-3.8,3.65,-1],work:[-2.3,3.65,-.2],color:"#8a799f",accent:"#d8c999",trait:"字迹纤细，会为地图补上无名小路",story:"她整理岛志时坚持保留居民的口头说法，因此正式地图边缘常有“栗子喜欢在此转弯”之类的批注。",lines:["地图若没人能认出自己的家，画得再准也没用。","这一页被风吹皱了，但字还能读。","我在抄罗莎琳祖母留下的水位表。"]},{id:"elwin",name:"埃尔文",role:"星象观测员",home:[-3,6.75,-1],work:[-3,9.35,-1],color:"#4e638c",accent:"#d2b76c",trait:"白天困倦，提到星星就忘记时间",story:"他的星图既画恒星，也画浮岛经过的云。他坚信星空不是方向标，而是一封需要几代人才能读完的长信。",lines:["今晚风很轻，适合看那颗金色的小星。","我们不是绕着岛生活，是和岛一起旅行。","嘘，望远镜刚对准，不要碰桌脚。"]},{id:"anselm",name:"安塞尔",role:"礼拜堂守灯人",home:[-6.5,.35,-1.6],work:[-6.1,.35,.3],color:"#8e8070",accent:"#c6b890",trait:"少说教义，多替人留一盏灯",story:"他整理彩窗下的木牌，从不评价愿望的大小。雨夜里礼拜堂的门不上锁，炉边总有擦干衣服的地方。",lines:["愿望很轻，木板只是替它抵挡一点风。","进来吧，湿斗篷可以挂在后排。","晨钟不是催人，是告诉夜路已经走完。"]},{id:"freya",name:"芙蕾雅",role:"吟游诗人",home:[-1,.35,2],work:[-.5,.35,2.8],color:"#a5748a",accent:"#d3aa72",trait:"收集声音，比收集故事更认真",story:"她给磨坊水轮、面包炉和吊桥各写过一支曲子。下雨天她在大厅练琴，晴天则把井边当作露天舞台。",lines:["水轮唱低音，锅盖负责最轻的那一拍。","这首歌还差一个声音，也许是你的脚步。","庭院的回声总比演奏慢半拍，很懂礼貌。"]},{id:"tom",name:"汤姆",role:"牧羊人",home:[-7.8,.25,-10],work:[-10.5,.25,-8.2],color:"#9a8760",accent:"#e3ded0",trait:"能分辨每只羊的脾气与脚步声",story:"他不让羊把休耕花带啃得太短，因为蜜蜂也需要过冬前的最后一餐。羊群中那只最白的叫“云脚”。",lines:["云脚又走到崖边了，它总以为下面是草场。","花带不是浪费田地，是给明年留一点力气。","你慢慢走，它们就不会挤在一起。"]},{id:"mael",name:"玛埃尔",role:"城墙卫兵",home:[4.2,.35,4.2],work:[4.7,3.8,0],color:"#6b7890",accent:"#b7a47b",trait:"认真巡逻，却常被果园香气带偏",story:"他看守的是一座多年没有敌人的城堡，因此更多时候在修松动的垛口、提醒孩子远离崖边。",lines:["东侧风大，别靠那面矮墙太近。","巡逻最怕的不是敌人，是米蕾刚出炉的面包。","夜里灯亮着，你就可以放心回家。"]},{id:"lio",name:"里奥",role:"学徒与地图绘制员",home:[5.8,.25,4.6],work:[-.5,.35,1.8],color:"#b07b61",accent:"#6d8c93",trait:"好奇，常把工具忘在意想不到的地方",story:"他白天跟铁匠学手艺，傍晚帮索菲亚画地图。最新作品是一张标出所有午睡好地方的秘密岛图。",lines:["我正在找锤子，你有在井边见过吗？","地图这块空白，是我还没爬到过的岛底。","长大以后我要给云也画一张地图。"]}],db={clear:"晴朗微风",cloudy:"云海聚拢",rain:"温柔阵雨"};function z_(s){const t=Math.floor(s)%24,e=Math.floor((s-Math.floor(s))*60);return`${String(t).padStart(2,"0")}:${String(e).padStart(2,"0")}`}function Nd({checked:s,onChange:t,label:e}){return q.jsx("button",{type:"button",className:`toggle ${s?"is-on":""}`,role:"switch","aria-checked":s,"aria-label":e,onClick:t,children:q.jsx("span",{})})}function pb({weather:s}){return s==="rain"?q.jsx(py,{size:15}):s==="cloudy"?q.jsx(nb,{size:15}):q.jsx(cb,{size:15})}function mb({ready:s,status:t,settings:e,audioEnabled:a,selectedLocationId:o,selectedResidentId:l,onLocation:u,onResident:h,onSettings:d,onHour:p,onAudio:v,onFocusResident:_,onGreetResident:g}){const[y,M]=qe.useState("places"),[w,S]=qe.useState(!1),[x,C]=qe.useState(!1),[O,T]=qe.useState(!0),[P,N]=qe.useState(!1),[U,E]=qe.useState(t.hour),L=ws.find(I=>I.id===o)??ws[0],F=_o.find(I=>I.id===l),G=t.residents.find(I=>I.id===l),j=t.residents.filter(I=>I.state!=="休息").length;qe.useEffect(()=>{P||E(t.hour)},[t.hour,P]),qe.useEffect(()=>{T(!0),C(!1)}
