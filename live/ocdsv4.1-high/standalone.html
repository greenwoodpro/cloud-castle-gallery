<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>浮空岛 · 中世纪城堡 · 小王子手绘世界</title>
<style>
  :root{
    --paper:#fbf5e8; --ink:#5a5348; --ink2:#7d7465; --line:rgba(150,138,116,.38);
    --blue:#8ea9c9; --rose:#cd8f99; --gold:#d9b573; --green:#8dbda3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9f0f6;
    font-family:Georgia,"Songti SC","STSong",'Noto Serif CJK SC',serif;color:var(--ink)}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{font-size:11px;line-height:1.5;padding:1px 7px;border-radius:9px;white-space:nowrap;
    background:rgba(251,245,232,.72);border:1px solid var(--line);color:var(--ink);
    box-shadow:0 1px 6px rgba(120,110,90,.12);transform:translateY(-2px)}
  .lbl.floor{background:rgba(240,220,180,.82);border-color:rgba(190,160,110,.5)}
  .lbl.fig{font-size:10px;padding:0 5px;background:rgba(255,255,255,.5);color:var(--ink2);border-color:rgba(160,150,130,.3)}
  .lbl.hide{display:none}
  #paper{position:fixed;inset:0;pointer-events:none;z-index:5;mix-blend-mode:multiply;opacity:.35;
    background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),
      radial-gradient(circle at 80% 70%,rgba(210,200,180,.35),rgba(255,255,255,0) 60%);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,0) 52%,rgba(150,140,120,.20) 100%)}
  #ui{position:fixed;left:16px;top:16px;z-index:20;width:286px;max-height:calc(100vh - 32px);overflow:auto;
    background:rgba(252,247,238,.84);backdrop-filter:blur(7px);border:1px solid var(--line);border-radius:16px;
    padding:14px 14px 12px;box-shadow:0 10px 30px rgba(120,110,90,.18);transition:transform .5s ease,opacity .5s ease}
  #ui.fold{transform:translateX(-320px);opacity:0}
  #ui::-webkit-scrollbar{width:6px}
  #ui::-webkit-scrollbar-thumb{background:rgba(160,150,130,.4);border-radius:6px}
  h1{margin:0;font-size:17px;letter-spacing:.06em;font-weight:600}
  h1 span{font-size:11px;letter-spacing:.22em;color:var(--ink2);display:block;margin-top:4px;font-weight:400}
  #clock{margin:9px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.1em}
  .hr{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:11px 0 9px}
  .grp{margin-bottom:9px}
  .grp>span{font-size:11px;letter-spacing:.18em;color:var(--ink2)}
  .row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  button{font-family:inherit;font-size:11.5px;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:9px;padding:4px 8px;
    transition:all .18s ease}
  button:hover{background:#fff;border-color:rgba(140,130,110,.6);transform:translateY(-1px)}
  button.on{background:linear-gradient(180deg,#f3e2c0,#e9d3a8);border-color:rgba(180,150,100,.55);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.7)}
  .tools{display:flex;flex-wrap:wrap;gap:5px}
  .tools button{min-width:64px}
  #figs{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:11px;padding:3px 7px;border-radius:20px;background:rgba(255,255,255,.55)}
  .chip:hover{background:rgba(238,226,200,.95)}
  #keys{position:fixed;left:18px;bottom:14px;z-index:18;font-size:11px;color:var(--ink2);
    background:rgba(252,247,238,.6);border:1px solid var(--line);border-radius:12px;padding:7px 11px;line-height:1.7;
    backdrop-filter:blur(4px)}
  #keys b{color:var(--ink);font-weight:600}
  #card{position:fixed;right:20px;bottom:22px;z-index:22;max-width:330px;padding:13px 15px;border-radius:16px;
    background:rgba(252,247,238,.9);border:1px solid var(--line);box-shadow:0 12px 34px rgba(120,110,90,.22);
    opacity:0;transform:translateY(14px);transition:all .45s ease;pointer-events:none}
  #card.on{opacity:1;transform:none}
  #card b{font-size:13.5px;letter-spacing:.05em}
  #card p{margin:6px 0 0;font-size:11.5px;line-height:1.75;color:var(--ink2)}
  #tip{position:fixed;z-index:32;pointer-events:none;font-size:11px;padding:3px 8px;border-radius:9px;
    background:rgba(70,62,50,.82);color:#f6ead2;opacity:0;transition:opacity .2s}
  #tip.on{opacity:1}
  #loading{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#f7f0e2;transition:opacity .9s ease}
  #loading .t{font-size:22px;letter-spacing:.3em}
  #loading .s{margin-top:10px;font-size:12px;color:var(--ink2);letter-spacing:.2em}
  #loading .d{margin-top:22px;width:120px;height:3px;background:rgba(150,138,116,.25);border-radius:3px;overflow:hidden}
  #loading .d i{display:block;width:40%;height:100%;background:var(--gold);animation:sl 1.3s infinite ease-in-out}
  @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  body.ready #loading{opacity:0;pointer-events:none}
  #brand{position:fixed;right:16px;top:16px;z-index:20;text-align:right;font-size:11px;color:var(--ink2);
    background:rgba(252,247,238,.7);border:1px solid var(--line);border-radius:14px;padding:9px 13px;backdrop-filter:blur(5px)}
  #brand b{display:block;font-size:12.5px;color:var(--ink);letter-spacing:.1em}
</style>
</head>
<body>
<div id="app"></div>
<div id="paper"></div>
<div id="vig"></div>

<div id="ui">
  <h1>浮空岛 · 中世纪城堡<span>LE PETIT CHÂTEAU DANS LE CIEL</span></h1>
  <p id="clock">—</p>
  <div class="hr"></div>
  <div id="views"></div>
  <div class="hr"></div>
  <div class="grp"><span>视角开关</span>
    <div class="row tools">
      <button id="b-cut">剖切城堡</button>
      <button id="b-night">黄昏 / 夜</button>
      <button id="b-labels">地名名牌</button>
      <button id="b-rotate">自动环绕</button>
      <button id="b-bloom">光晕</button>
      <button id="b-ui">收起面板</button>
    </div>
  </div>
  <div class="hr"></div>
  <div class="grp"><span>时间 <i style="font-style:normal;opacity:.6">（拖动看昼夜）</i></span>
    <div class="row" style="align-items:center">
      <input id="time" type="range" min="0" max="1" step="0.005" value="0.42" style="flex:1;accent-color:#d9b573" />
      <button id="b-auto">自动</button>
    </div>
  </div>
  <div class="hr"></div>
  <div class="grp"><span>人物志 · 点名字去看他</span>
    <div id="figs" style="margin-top:6px"></div>
  </div>
</div>

<div id="brand"><b>小王子模式</b>水彩 · 温和 · 细腻</div>
<div id="card"></div>
<div id="tip"></div>
<div id="keys">
  <b>左键</b> 旋转 · <b>右键</b> 平移 · <b>滚轮</b> 缩放 &nbsp;|&nbsp; <b>双击</b> 聚焦 &nbsp;|&nbsp;
  <b>C</b> 剖切 · <b>L</b> 昼夜 · <b>T</b> 名牌 · <b>A</b> 环绕 · <b>H</b> 面板
</div>

<div id="loading">
  <div class="t">浮 空 岛</div>
  <div class="s">正在铺纸、调色、点灯……</div>
  <div class="d"><i></i></div>
</div>

transparent: true, opacity: 0.7 });\n  const cloudSea = new THREE.Group();\n  group.add(cloudSea);\n  const clouds = [];\n  const mkCloud = (parent, y, radius, scale) => {\n    const g = new THREE.Group();\n    const blob = new Merge();\n    const n = RI(5, 9);\n    for (let i = 0; i < n; i++) {\n      const r = R(6, 15) * scale;\n      blob.add('c', gSph(r, 12), [R(-14, 14) * scale, R(-1.6, 1.6) * scale, R(-11, 11) * scale], [0, 0, 0], [1, 0.55, 0.9]);\n    }\n    const m = blob.build({ c: Math.random() < 0.4 ? cloudMatSoft : cloudMat }, { cast: false, receive: false });\n    g.add(m);\n    const a = R(0, TAU);\n    g.position.set(Math.cos(a) * radius, y + R(-6, 6), Math.sin(a) * radius);\n    g.rotation.y = R(0, TAU);\n    g.userData.spin = R(0.0009, 0.0026) * (Math.random() < 0.5 ? 1 : -1);\n    parent.add(g);\n    clouds.push(g);\n    return g;\n  };\n  for (let i = 0; i < 34; i++) mkCloud(cloudSea, R(-58, -32), R(120, 520), R(1.5, 3.4));\n  for (let i = 0; i < 14; i++) mkCloud(cloudSea, R(-34, -26), R(150, 260), R(1.0, 1.8));\n  const upper = new THREE.Group();\n  group.add(upper);\n  for (let i = 0; i < 14; i++) mkCloud(upper, R(74, 132), R(210, 540), R(1.6, 3.4));\n\n  const birds = [];\n  const birdMat = new THREE.MeshBasicMaterial({ color: '#4b4a5e', fog: false, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });\n  for (let f = 0; f < 3; f++) {\n    const flock = new THREE.Group();\n    group.add(flock);\n    const members = [];\n    for (let i = 0; i < RI(3, 5); i++) {\n      const b = new THREE.Group();\n      const wingGeo = new THREE.PlaneGeometry(1.5, 0.42);\n      const L = new THREE.Mesh(wingGeo, birdMat);\n      const Rr = new THREE.Mesh(wingGeo, birdMat);\n      L.position.x = -0.72;\n      Rr.position.x = 0.72;\n      b.add(L, Rr);\n      const body = new THREE.Mesh(gSph(0.16, 6), birdMat);\n      body.scale.set(1, 0.7, 2.2);\n      b.add(body);\n      b.userData = { L, Rr, ph: R(0, TAU), sp: R(7, 11) };\n      b.position.set(R(-6, 6), R (){ vec3 p = position; p.y += sin(uT*0.4 + p.x*0.1)*2.0; p.x += sin(uT*0.23 + p.z*0.08)*2.6;\n        vA = asize; vec4 mv = modelViewMatrix*vec4(p,1.0); gl_PointSize = asize*3.0; gl_Position = projectionMatrix*mv; }`,\n      fragmentShader: `uniform float uOpacity; uniform sampler2D uTex; varying float vA;\n        void main(){ vec4 t = texture2D(uTex, gl_PointCoord); gl_FragColor = vec4(vec3(1.0,0.94,0.82), t.a*uOpacity*0.9); }`,\n      transparent: true,\n      depthWrite: false,\n      blending: THREE.AdditiveBlending\n    });\n    const pts = new THREE.Points(g, m);\n    pts.frustumCulled = false;\n    scene.add(pts);\n    return { pts, m };\n  })();\n\n  function qualityShadow() {\n    return 2048;\n  }\n\n  const tmpA = new THREE.Color(), tmpB = new THREE.Color(), moonTint = new THREE.Color();\n  const cTop = new THREE.Color(), cMid = new THREE.Color(), cBot = new THREE.Color(), cSun = new THREE.Color(), cFog = new THREE.Color();\n  const hemiSky = new THREE.Color(), hemiGnd = new THREE.Color();\n  const sunDir = new THREE.Vector3();\n\n  function update(t) {\n    const { a, b, e } = keyLerp(t);\n    cTop.set(a.top).lerp(tmpA.set(b.top), e);\n    cMid.set(a.mid).lerp(tmpA.set(b.mid), e);\n    cBot.set(a.bot).lerp(tmpA.set(b.bot), e);\n    cSun.set(a.sunC).lerp(tmpA.set(b.sunC), e);\n    cFog.set(a.fog).lerp(tmpA.set(b.fog), e);\n    hemiSky.set(a.hemiSky).lerp(tmpA.set(b.hemiSky), e);\n    hemiGnd.set(a.hemiGnd).lerp(tmpA.set(b.hemiGnd), e);\n    const sunI = lerp(a.sunI, b.sunI, e);\n    const ambI = lerp(a.amb, b.amb, e);\n\n    const ang = (t - 0.25) * TAU;\n    sunDir.set(Math.cos(ang) * 0.92, Math.sin(ang), 0.34 + Math.cos(ang) * 0.12).normalize();\n    const elev = sunDir.y;\n    const night = smoothstep(0.16, -0.10, elev);\n    env.night = night;\n\n    uniforms.uTop.value.copy(cTop);\n    uniforms.uMid.value.copy(cMid);\n    uniforms.uBot.value.copy(cBot);\n    uniforms.uSunColor.value.copy(cSun);\n    uniforms.uSunDir.value.copy(sunDir);\n    uniforms.uSunPow.value = smoothstep(-0.22, 0.06, elev) * 1.25 + 0.14;\n    uniforms.uNoise.value = 0.6 + night * 0.8;\n\n    sun.position.copy(sunDir).multiplyScalar(150);\n    sun.target.position.set(0, 6, 0);\n    const daylight = elev > -0.02;\n    if (!daylight) sun.position.copy(sunDir).multiplyScalar(-150);\n    sun.color.copy(daylight ? cSun : moonTint.set('#b9c9f0'));\n    sun.intensity = daylight ? sunI * (1 - night * 0.5) : 0.5 * night;\n    sun.visible = true;\n\n    hemi.color.copy(hemiSky);\n    hemi.groundColor.copy(hemiGnd);\n    hemi.intensity = lerp(0.7, 0.5, night);\n    amb.color.copy(cMid).lerp(tmpB.set('#8fa4d8'), night * 0.7);\n    amb.intensity = ambI;\n\n    rim.color.copy(cMid).lerp(tmpB.set('#b7c8ea'), 0.4);\n  rim.intensity = 0.22 + night * 0.25;\n  under.intensity = 0.42 + night * 0.28;\n\n    starMat.uniforms.uOpacity.value = clamp(night * 1.5 - 0.25, 0, 1) * env.stars;\n    moon.position.copy(sunDir).multiplyScalar(-1150).setY(Math.max(-sunDir.y, 0.06) * 1050);\n    const moonUp = sunDir.y < 0.1 ? 1 : 0;\n    moonBall.material.opacity = moonUp * clamp(night * 1.4, 0, 1);\n    moonGlow.material.opacity = moonBall.material.opacity * 0.5;\n    moonBall.visible = moonGlow.visible = moonBall.material.opacity > 0.01;\n\n    if (scene.fog) scene.fog.color.copy(cFog);\n    const skyBlend = cloudMat.emissive;\n    skyBlend.copy(cMid).lerp(tmpB.set(cSun).multiplyScalar(1), 0.35);\n    cloudMat.emissiveIntensity = lerp(0.42, 0.2, night);\n    cloudMatSoft.emissiveIntensity = lerp(0.34, 0.14, night);\n    cloudMat.color.copy(cTop).lerp(tmpB.set('#fbf3ea'), 0.62);\n    cloudMatSoft.color.copy(cloudMat.color).lerp(tmpB.set(cMid), 0.35);\n    renderer.toneMappingExposure = lerp(0.98, 0.9, night);\n    dust.m.uniforms.uOpacity.value = 0.34 + night * 0.4;\n  }\n  function botCloud() {\n    return '#fdf7f0';\n  }\n\n  tick((dt, t) => {\n    if (env.auto) env.time = (env.time + dt * 0.0055) % 1;\n    update(env.time);\n    clouds.forEach((c) => {\n      c.rotatio
