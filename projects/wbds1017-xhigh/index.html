function buildLabels() {
  const layer = document.getElementById('labels');
  SPOTS.forEach(s => {
    const el = document.createElement('button');
    el.className = 'label';
    el.type = 'button';
    el.innerHTML = '<i class="dot"></i><span>' + s.short + '</span><i class="bar"></i>';
    el.addEventListener('click', () => openSpot(s));
    layer.appendChild(el);
    labels.push({ el, spot: s, anchor: new T.Vector3(s.anchor[0], s.anchor[1], s.anchor[2]) });
  });
}

let projV;
const placed = [];
function updateLabels() {
  if (!projV) return;
  const w = window.innerWidth, h = window.innerHeight;
  placed.length = 0;
  for (const l of labels) {
    projV.copy(l.anchor).project(camera);
    const inFront = projV.z > -1 && projV.z < 1;
    const x = (projV.x * 0.5 + 0.5) * w;
    const y = (-projV.y * 0.5 + 0.5) * h;
    l.el.style.left = x.toFixed(1) + 'px';
    l.el.style.top = y.toFixed(1) + 'px';
    let o = 0;
    if (inFront) {
      const d = camera.position.distanceTo(l.anchor);
      if (!l.spot.interior) o = clamp(1.6 - d / 90, 0, 1);
      if (l.spot.interior) o = state.inside ? clamp(1.5 - d / 40, 0, 1) : 0;
      if (x < 40 || x > w - 40 || y < 30 || y > h - 90) o = 0;
    }
    if (o > 0.25) {
      for (const p of placed) {
        if (Math.hypot(p[0] - x, p[1] - y) < 74) { o = 0; break; }
      }
      if (o > 0) placed.push([x, y]);
    }
    l.el.style.opacity = o.toFixed(2);
    l.el.style.pointerEvents = o > 0.55 ? 'auto' : 'none';
  }
}

let activeSpot = null;
function markView(key) {
  document.querySelectorAll('[data-view]').forEach(x => {
    x.classList.toggle('on', x.dataset.view === key);
  });
}
function openSpot(s) {
  activeSpot = s;
  if (s.interior && !state.inside) { setInside(true, false); markView('inside'); }
  if (!s.interior && state.inside) { setInside(false, false); markView('overview'); }
  document.getElementById('p-eyebrow').textContent = s.eyebrow;
  document.getElementById('p-title').textContent = s.title;
  document.getElementById('p-body').textContent = s.body;
  const facts = document.getElementById('p-facts');
  facts.innerHTML = s.facts.map(f => '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>').join('');
  document.getElementById('panel').classList.add('on');
  rig.focus(s.view);
}
function closePanel() {
  document.getElementById('panel').classList.remove('on');
  activeSpot = null;
}

function setInside(on, fly) {
  state.inside = on;
  shellMats.forEach(m => {
    m.opacity = on ? 0.11 : 1;
    m.depthWrite = !on;
  });
  shellMeshes.forEach(o => { o.castShadow = !on; });
  shellExtras.forEach(o => { o.visible = !on; });
  cutaway.forEach(o => { o.visible = !on; });
  if (fly !== false) {
    if (on) rig.focus({ target: [0, 6.4, -3.2], radius: 31, theta: 0.18, phi: 1.27 });
    else rig.focus({ target: [0, 3.0, -1.5], radius: 52, theta: 0.55, phi: 1.17 });
  }
}

function syncRotateBtn() {
  const b = document.getElementById('btn-rotate');
  if (b && rig) b.classList.toggle('on', rig.auto);
}

function bindUI() {
  document.querySelectorAll('[data-time]').forEach(b => {
    b.addEventListener('click', () => applyPreset(b.dataset.time));
  });
  document.querySelectorAll('[data-view]').forEach(b => {
    b.addEventListener('click', () => {
      const v = b.dataset.view;
      if (v === 'overview') { setInside(false, false); rig.focus({ target: [0, 3.0, -1.5], radius: 52, theta: 0.62, phi: 1.17 }); }
      if (v === 'castle') { setInside(false, false); rig.focus({ target: [0, 10.4, -3.4], radius: 36, theta: 0.5, phi: 1.1 }); }
      if (v === 'inside') { setInside(true); closePanel(); }
      if (v === 'cliff') { setInside(false, false); rig.focus({ target: [8.4, 1.4, 7.6], radius: 13, theta: 1.75, phi: 1.26 }); }
      markView(v);
    });
  });
  document.getElementById('btn-rotate').addEventListener('click', () => {
    rig.auto = !rig.auto;
    syncRotateBtn();
  });
  document.getElementById('panel-close').addEventListener('click', closePanel);
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });
}

/* ============================================================
   11. 动画
   ============================================================ */
let time = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  rig.update(dt);
  updateEnv(dt);

  // 云
  for (const c of dyn.clouds) {
    c.userData.ang += dt * c.userData.speed;
    c.position.x = Math.sin(c.userData.ang) * c.userData.rad;
    c.position.z = Math.cos(c.userData.ang) * c.userData.rad;
    c.position.y = c.userData.y + Math.sin(time * 0.35 + c.userData.ang * 3) * 0.5;
  }

  // 浮石
  for (const r of dyn.rocks) {
    r.position.y = r.userData.baseY + Math.sin(time * 0.55 + r.userData.phase) * 0.55;
    r.rotation.y += dt * r.userData.spin;
  }

  // 旗帜飘动
  for (const b of dyn.banners) {
    const attr = b.geometry.attributes.position;
    const base = b.userData.base;
    const hh = b.userData.h, ph = b.userData.phase;
    for (let i = 0; i < attr.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      const k = (-y) / hh;
      attr.setZ(i, Math.sin(x * 3.2 + time * 2.4 + ph) * 0.17 * (0.25 + k));
      attr.setX(i, x + Math.sin(time * 1.6 + ph) * 0.015);
    }
    attr.needsUpdate = true;
  }

  // 人物呼吸 / 围巾
  for (const f of dyn.figures) {
    if (f.userData.baseY == null) continue;
    const ph = f.userData.phase || 0;
    f.position.y = f.userData.baseY + Math.sin(time * 1.1 + ph) * 0.018;
    if (f.userData.scarf) {
      f.userData.scarf[0].rotation.z = 0.12 + Math.sin(time * 1.8 + ph) * 0.12;
      f.userData.scarf[1].rotation.z = -0.05 + Math.sin(time * 1.5 + ph + 0.8) * 0.16;
    }
    if (f.userData.tail) {
      f.userData.tail.rotation.z = Math.sin(time * 1.4 + ph) * 0.12;
    }
    if (f.userData.lanternGlow) {
      const s = 0.9 + Math.sin(time * 6 + ph) * 0.08 + Math.sin(time * 13.3) * 0.04;
      f.userData.lanternGlow.scale.setScalar(s);
    }
  }

  // 水波
  for (const r of dyn.ripples) {
    const t = ((time * 0.35 + r.userData.phase) % 3) / 3;
    r.scale.setScalar(0.5 + t * 3.4);
    r.material.opacity = 0.1 * (1 - t);
  }

  // 瀑布粒子
  for (const p of dyn.smoke) {
    const arr = p.geometry.attributes.position.array;
    const spd = p.userData.spd;
    for (let i = 0; i < spd.length; i++) {
      arr[i * 3 + 1] -= spd[i] * dt * 1.6;
      if (arr[i * 3 + 1] < -16) {
        arr[i * 3 + 1] = 0;
        arr[i * 3] = rnd(-2.6, -0.4);
        arr[i * 3 + 2] = rnd(-0.9, 0.9);
      }
    }
    p.geometry.attributes.position.needsUpdate = true;
  }

  // 萤火虫
  if (dyn.fireflies) {
    const arr = dyn.fireflies.geometry.attributes.position.array;
    const seed = dyn.fireflies.userData.seed;
    for (let i = 0; i < seed.length / 2; i++) {
      const ph = seed[i * 2], sp = seed[i * 2 + 1];
      arr[i * 3] += Math.sin(time * sp + ph) * dt * 0.25;
      arr[i * 3 + 1] += Math.cos(time * sp * 0.8 + ph) * dt * 0.18;
      arr[i * 3 + 2] += Math.cos(time * sp * 0.6 + ph * 1.3) * dt * 0.25;
    }
    dyn.fireflies.geometry.attributes.position.needsUpdate = true;
  }

  // 月亮轻微呼吸
  if (moonGlow) moonGlow.material.rotation += dt * 0.02;

  updateLabels();
  renderer.render(scene, camera);
}

/* ============================================================
   12. 启动
   ============================================================ */
async function boot() {
  let err = null;
  for (const url of CDNS) {
    try {
      T = await import(url);
      break;
    } catch (e) { err = e; }
  }
  if (!T) {
    const ld = document.getElementById('loading');
    ld.classList.add('error');
    console.error(err);
    return;
  }
  start();
}

function start() {
  clock = new T.Clock();
  projV = new T.Vector3();
  initEnvColors();

  renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.85));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  document.getElementById('app').appendChild(renderer.domElement);

  scene = new T.Scene();
  scene.fog = new T.FogExp2(0xdae7f0, 0.0026);

  camera = new T.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.4, 1200);
  camera.position.set(30, 28, 40);

  // 光照
  hemiLight = new T.HemisphereLight(0xcbe7ff, 0xdfd0b8, 1.05);
  scene.add(hemiLight);
  ambLight = new T.AmbientLight(0xffffff, 0.16);
  scene.add(ambLight);
  sunLight = new T.DirectionalLight(0xfff4e0, 3.6);
  sunLight.position.set(30, 44, 20);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  const sc = sunLight.shadow.camera;
  sc.left = -26; sc.right = 26; sc.top = 30; sc.bottom = -26;
  sc.near = 1; sc.far = 150;
  sunLight.shadow.bias = -0.0007;
  sunLight.shadow.normalBias = 0.03;
  sunLight.shadow.camera.updateProjectionMatrix();
  scene.add(sunLight);
  fillLight = new T.DirectionalLight(0xbcd6ff, 0.5);
  fillLight.position.set(-24, 14, -26);
  scene.add(fillLight);

  // 窗户发光材质
  windowMat = new T.MeshStandardMaterial({
    color: 0xffe3b4, emissive: 0xffb96a, emissiveIntensity: 0.55, roughness: 0.6
  });

  blockZones.push({ x: 0, z: -2.2, r: 7.4 });
  blockZones.push({ x: 8.6, z: 7.6, r: 2.4 });
  blockZones.push({ x: 4.35, z: 6.2, r: 2.4 });

  initTextures();
  buildSky();
  buildClouds();
  buildIsland();
  buildLake();
  buildPath();
  buildCastle();
  buildVegetation();
  buildFlowers();
  buildFigures();
  buildFireflies();

  rig = new Rig(camera, renderer.domElement);
  rig.radius = 98; rig.dRadius = 52;   // 开场由远拉近
  rig.phi = 1.35; rig.dPhi = 1.2;
  rig.theta = 0.2; rig.dTheta = 0.62;
  rig.auto = true;
  const vm = location.search.match(/view=([a-z]+)/);
  if (vm) {
    const v = vm[1];
    if (v === 'castle') rig.focus({ target: [0, 10.4, -3.4], radius: 36, theta: 0.5, phi: 1.1 });
    if (v === 'prince') rig.focus({ target: [8.7, 1.3, 7.6], radius: 7, theta: 1.85, phi: 1.3 });
    if (v === 'rose') rig.focus({ target: [4.35, 0.9, 6.2], radius: 6, theta: 1.15, phi: 1.28 });
    if (v === 'falls') rig.focus({ target: [-12.6, -1.5, 4.6], radius: 20, theta: -1.15, phi: 1.34 });
    if (v === 'under') rig.focus({ target: [0, -6.0, 0], radius: 42, theta: 0.6, phi: 1.98 });
  }
  if (/inside/.test(location.search)) {
    setTimeout(() => {
      setInside(true, false);
      rig.focus({ target: [0, 6.4, -3.2], radius: 31, theta: 0.18, phi: 1.27 });
      if (/nointro/.test(location.search)) {
        rig.radius = rig.dRadius; rig.phi = rig.dPhi; rig.theta = rig.dTheta; rig.target.copy(rig.tTarget);
      }
    }, 60);
  }
  if (/nointro/.test(location.search)) {
    rig.radius = rig.dRadius; rig.phi = rig.dPhi; rig.theta = rig.dTheta;
    rig.target.copy(rig.tTarget);
  }

  buildLabels();
  bindUI();
  applyPreset('day');
  const tm = location.search.match(/time=(day|dusk|night)/);
  if (tm) applyPreset(tm[1]);
  setInside(false, false);
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === 'overview'));

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  renderer.setAnimationLoop(() => {
    try { animate(); } catch (e) { console.error(e); }
  });

  // 首帧后收起载入层
  setTimeout(() => {
    const ld = document.getElementById('loading');
    ld.classList.add('done');
    setTimeout(() => ld.remove(), 1200);
  }, 420);
}

boot();
</script>
