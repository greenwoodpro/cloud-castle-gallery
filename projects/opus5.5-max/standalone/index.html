<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星辰城堡 · 浮空岛（离线版）</title>
    <style>
      :root {
        --paper: #fbf7ec;
        --ink: #3b2f27;
        --blue: #34507e;
        --gold: #e8b84a;
        --line: #dccfb2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--blue); color: var(--ink); font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'PingFang SC', 'Microsoft YaHei', serif; overflow: hidden; }
      #scene { position: fixed; inset: 0; }
      .panel { position: fixed; background: color-mix(in oklab, var(--paper) 92%, transparent); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px -12px rgba(59, 47, 39, 0.4); backdrop-filter: blur(8px); }
      header.panel { top: 16px; left: 16px; padding: 12px 16px; max-width: 320px; }
      header h1 { margin: 0; font-size: 26px; letter-spacing: 0.1em; }
      header p { margin: 4px 0 10px; font-size: 13px; line-height: 1.6; color: #776656; }
      select { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; }
      #bar { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 999px; max-width: calc(100vw - 24px); overflow-x: auto; }
      #bar button { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
      #bar button:hover { background: #efe6d1; }
      #bar button.on { background: var(--blue); color: var(--paper); }
      #card { top: 16px; right: 16px; width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 110px); overflow-y: auto; padding: 16px 20px; }
      #card h2 { margin: 0; font-size: 24px; }
      #card .sub { margin: 2px 0 12px; color: #776656; font-size: 13px; }
      #card p { font-size: 15px; line-height: 1.7; }
      #card dl { display: grid; grid-template-columns: 64px 1fr; gap: 6px 12px; padding: 12px; border-radius: 12px; background: #efe6d1; font-size: 13px; }
      #card dt { color: #776656; }
      #card dd { margin: 0; }
      .grain { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0.2; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.21  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      @media (max-width: 720px) {
        #card { top: auto; bottom: 76px; max-height: 42vh; }
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div class="grain" aria-hidden="true"></div>
    <header class="panel">
      <h1>星辰城堡</h1>
      <p>漂浮在云海之上的中世纪城堡。拖拽旋转、滚轮缩放、右键平移。</p>
      <label for="place" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">选择要前往的地点</label>
      <select id="place">
        <option value="" disabled selected>选择一处地方前往……</option>
      </select>
    </header>
    <aside id="card" class="panel" hidden aria-live="polite"></aside>
    <nav id="bar" class="panel" aria-label="场景控制"></nav>
    <script src="./castle.js"></script>
  </body>
</html>
