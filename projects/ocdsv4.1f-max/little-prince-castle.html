<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小王子与浮空城堡 · Le Château des Étoiles</title>
<style>
  :root{
    --ink:#5a4636; --ink-soft:#8a7360; --paper:rgba(252,246,232,.93);
    --line:rgba(178,146,108,.55); --gold:#c9a25e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#2f3a72}
  body{font-family:"Palatino Linotype",Palatino,Georgia,"Songti SC","STSong","SimSun",serif;color:var(--ink)}
  canvas{display:block}

  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(46,30,64,.28) 100%),
      linear-gradient(180deg, rgba(46,30,64,.10), rgba(0,0,0,0) 22%);
    mix-blend-mode:multiply;
  }

  .panel{position:fixed;z-index:10;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 12px 34px rgba(58,38,80,.32);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);}

  #panel{top:16px;left:16px;max-width:346px;padding:14px 16px 13px}
  #panel h1{margin:0;font-size:19px;letter-spacing:2.5px;color:#8a5a3c;font-weight:700}
  #panel h1 .spark{color:var(--gold);font-size:14px;vertical-align:2px}
  #panel .sub{margin:3px 0 10px;font-size:12px;letter-spacing:.6px;color:var(--ink-soft)}

  .views{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .vbtn{border:1px solid var(--line);background:rgba(255,251,240,.85);color:var(--ink);
    border-radius:999px;padding:5px 12px;font-size:12.5px;letter-spacing:1px;cursor:pointer;
    font-family:inherit;transition:.22s}
  .vbtn:hover{background:#fff6e0;transform:translateY(-1px);box-shadow:0 4px 10px rgba(150,110,60,.22)}
  .vbtn.on{background:#f3dfb6;border-color:#c9a25e;color:#7a5327;font-weight:700}

  #hint{font-size:11.5px;line-height:1.7;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px}
  #hint b{color:#a8763e;font-weight:700}

  #card{right:16px;bottom:16px;width:328px;max-width:calc(100vw - 32px);padding:14px 16px;
    opacity:0;transform:translateY(16px);pointer-events:none;transition:.38s ease}
  #card.show{opacity:1;transform:none;pointer-events:auto}
  #card h2{margin:0 0 6px;font-size:15.5px;letter-spacing:1.5px;color:#8a5a3c}
  #card h2::before{content:"✦ ";color:var(--gold)}
  #card p{margin:0;font-size:13px;line-height:1.85;color:#63503f;text-align:justify}
  #card .close{position:absolute;top:9px;right:11px;border:none;background:none;font-size:16px;
    color:#b09a7d;cursor:pointer;font-family:inherit;padding:2px 6px}
  #card .close:hover{color:#8a5a3c}

  #loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;background:linear-gradient(180deg,#2f3a72,#6f5a9c 62%,#d88f76);
    color:#f6ead2;letter-spacing:3px;font-size:14px;transition:opacity .9s}
  #loading .star{font-size:26px;animation:spin 3.2s linear infinite;color:#ffd98a}
  #loading.hide{opacity:0;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:640px){
    #panel{max-width:250px;padding:10px 12px}
    #panel h1{font-size:15px}
    #hint{display:none}
  }
</style>
</head>
<body>

<div id="loading"><div class="star">✦</div><div>正在点亮星星…</div></div>
<div id="vignette"></div>

<div class="panel" id="panel">
  <h1><span class="spark">✦</span> 小王子与浮空城堡 <span class="spark">✦</span></h1>
  <div class="sub">Le Château des Étoiles · 一座悬在黄昏里的城堡</div>
  <div class="views">
    <button class="vbtn on" data-view="全景">全景</button>
    <button class="vbtn" data-view="城堡剖面">城堡剖面</button>
    <button class="vbtn" data-view="王座大厅">王座大厅</button>
    <button class="vbtn" data-view="中庭">中庭</button>
    <button class="vbtn" data-view="玫瑰园">玫瑰园</button>
    <button class="vbtn" data-view="岛底瀑布">岛底瀑布</button>
    <button class="vbtn" id="rotBtn">自动旋转</button>
  </div>
  <div id="hint">
    <b>拖拽</b> 旋转视角 · <b>滚轮</b> 缩放 · <b>右键</b> 平移<br>
    点击岛上的 <b>✦</b> 光点，听它讲讲城堡的构造、人物与风土。<br>
    风格致敬圣-埃克苏佩里《小王子》：愿你在这里遇见第 44 次日落。
  </div>
</div>

<div class="panel" id="card">
  <button class="close" id="cardClose">✕</button>
  <h2 id="cardTitle"></h2>
  <p id="cardText"></p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================== 基础环境 ============================== */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.setClearColor(0x2f3a72);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9978c, 88, 250);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 700);
camera.position.set(26, 19, 31);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 95;
controls.maxPolarAngle = 1.85;
controls.autoRotateSpeed = 0.45;

let _seed = 20260618;
const rnd = () => (_seed = (_seed * 1664525 + 1013904223) >>> 0, _seed / 4294967296);
const rr = (a, b) => a + rnd() * (b - a);

/* ============================== 调色板与共享材质 ============================== */

const PAL = {
  skyTop: 0x2f3a72, skyMid: 0x8d78b8, skyHor: 0xf2b184,
  grassA: 0x9bcd7d, grassB: 0xc6d07f,
  rock: [0xb5946f, 0xa5805e, 0x967457, 0x8a6a50, 0x7d5f49, 0x715644, 0x654b3d],
  gold: 0xe8c26a, rose: 0xe8738d, cloud: 0xf6dcd2
};

function stdM(color, o = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.92, metalness: 0 }, o));
}
const goldM = stdM(PAL.gold, { metalness: 0.62, roughness: 0.34 });
const ironM = stdM(0x55525e, { metalness: 0.7, roughness: 0.48 });
const metalM = stdM(0xaab3c4, { metalness: 0.78, roughness: 0.4 });
const winM = stdM(0x7a5732, { emissive: 0xffbe62, emissiveIntensity: 1.75, roughness: 0.7 });
const flameM = stdM(0xffd27a, { emissive: 0xffb84a, emissiveIntensity: 2.6, roughness: 1 });
const fireM = stdM(0xff9040, { emissive: 0xff6a1e, emissiveIntensity: 2.4, roughness: 1 });
const waterM = new THREE.MeshStandardMaterial({ color: 0x86cfdd, roughness: 0.14, metalness: 0.06,
  transparent: true, opacity: 0.9, emissive: 0x1d4a58, emissiveIntensity: 0.4 });
const glassM = new THREE.MeshPhysicalMaterial({ color: 0xd6ecf2, roughness: 0.06, metalness: 0,
  transparent: true, opacity: 0.22, clearcoat: 1, clearcoatRoughness: 0.1, side: THREE.DoubleSide });
const plasterM = stdM(0xf3e6cf);
const soilM = stdM(0x9c7a58);
const thatchM = stdM(0xd9b06a, { roughness: 1 });
const trunkM = stdM(0x8a6242, { roughness: 1 });
const trunkDarkM = stdM(0x7a5233, { roughness: 1 });

/* ============================== 画布纹理 ============================== */

function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  return t;
}
function drawStone(g) {
  g.fillStyle = '#e0d0ae'; g.fillRect(0, 0, 256, 256);
  const shades = ['#f0e2c6', '#eadbba', '#f3e6cc', '#e4d3b2'];
  for (let row = 0; row < 8; row++) {
    const off = (row % 2) ? 32 : 0;
    for (let col = -1; col < 5; col++) {
      g.fillStyle = shades[(row * 3 + col * 5 + 9) % 4];
      g.fillRect(col * 64 + off + 2, row * 32 + 2, 60, 28);
    }
  }
}
const stoneTex = canvasTex(256, 256, drawStone, 2, 1.6);
const towerTex = canvasTex(256, 256, drawStone, 3, 3);

const roofTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#7685c2'; g.fillRect(0, 0, 256, 256);
  for (let r = 0; r < 8; r++) {
    for (let c = -1; c < 9; c++) {
      const x = c * 32 + ((r % 2) ? 16 : 0), y = r * 32;
      g.fillStyle = ['#7b89c4', '#7484c0', '#8290c9'][(r + c + 9) % 3];
      g.beginPath(); g.arc(x + 16, y + 22, 16, Math.PI, 0); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(66,76,128,.32)'; g.lineWidth = 1.5; g.stroke();
    }
  }
}, 3, 2);

const woodTex = canvasTex(256, 256, (g) => {
  for (let i = 0; i < 8; i++) {
    g.fillStyle = ['#a06f45', '#96663f', '#aa7850', '#9c6b43'][i % 4];
    g.fillRect(i * 32, 0, 32, 256);
    g.fillStyle = 'rgba(90,55,25,.35)'; g.fillRect(i * 32 + 30, 0, 2, 256);
  }
  g.strokeStyle = 'rgba(80,50,20,.22)'; g.lineWidth = 1;
  for (let i = 0; i < 42; i++) {
    const x = Math.random() * 256;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + Math.random() * 20 - 10, 256); g.stroke();
  }
}, 1, 1);

const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 1 });
const towerStoneMat = new THREE.MeshStandardMaterial({ map: towerTex, roughness: 1, side: THREE.DoubleSide });
const gableMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 1, side: THREE.DoubleSide });
const roofMat = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.92 });
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.95 });
const stonePlainM = stdM(0xd9c6a2);
const stoneDarkM = stdM(0xb59d7a);

function bannerTex(base, emblem) {
  return canvasTex(128, 160, (g) => {
    g.fillStyle = base; g.fillRect(0, 0, 128, 160);
    g.strokeStyle = 'rgba(255,248,230,.55)'; g.lineWidth = 6; g.strokeRect(9, 9, 110, 142);
    g.fillStyle = emblem;
    const cx = 64, cy = 78, R = 34, r0 = 13;
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rad = (i % 2) ? r0 : R;
      const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,240,200,.85)';
    [[30, 30], [98, 30], [30, 132], [98, 132]].forEach(p => {
      g.beginPath(); g.arc(p[0], p[1], 4, 0, 7); g.fill();
    });
  });
}
const bannerRedTex = bannerTex('#c9564f', '#f2d792');
const bannerBlueTex = bannerTex('#5f6fb4', '#f6e6b8');

function paintingTex(kind) {
  return canvasTex(128, 96, (g) => {
    const sky = g.createLinearGradient(0, 0, 0, 96);
    if (kind === 0) { sky.addColorStop(0, '#f7d9a0'); sky.addColorStop(1, '#e8a06a'); }
    else { sky.addColorStop(0, '#9db4e8'); sky.addColorStop(1, '#f2c9b8'); }
    g.fillStyle = sky; g.fillRect(0, 0, 128, 96);
    g.fillStyle = kind === 0 ? '#8faa6a' : '#7d9c5f';
    g.beginPath(); g.moveTo(0, 70); g.quadraticCurveTo(40, 40, 70, 68);
    g.quadraticCurveTo(100, 80, 128, 60); g.lineTo(128, 96); g.lineTo(0, 96); g.closePath(); g.fill();
    g.fillStyle = kind === 0 ? '#f7ead0' : '#fdf2d8';
    g.beginPath(); g.arc(kind === 0 ? 95 : 35, 26, 10, 0, 7); g.fill();
  });
}

const glowTex = canvasTex(128, 128, (g) => {
  const grd = g.createRadialGradient(64, 64, 2, 64, 64, 62);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(255,255,255,.55)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
});

const starTex = canvasTex(128, 128, (g) => {
  const grd = g.createRadialGradient(64, 64, 4, 64, 64, 60);
  grd.addColorStop(0, 'rgba(255,240,200,.95)');
  grd.addColorStop(0.45, 'rgba(255,220,140,.5)');
  grd.addColorStop(1, 'rgba(255,200,100,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#fff6dd';
  g.beginPath();
  g.moveTo(64, 12); g.quadraticCurveTo(70, 58, 116, 64);
  g.quadraticCurveTo(70, 70, 64, 116); g.quadraticCurveTo(58, 70, 12, 64);
  g.quadraticCurveTo(58, 58, 64, 12); g.closePath(); g.fill();
});

const moonTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#f8efda';
  g.beginPath(); g.arc(128, 128, 86, 0, 7); g.fill();
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.arc(128 + 42, 128 - 28, 80, 0, 7); g.fill();
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = 'rgba(228,212,176,.5)';
  g.beginPath(); g.arc(96, 152, 10, 0, 7); g.fill();
  g.beginPath(); g.arc(78, 116, 7, 0, 7); g.fill();
  g.beginPath(); g.arc(110, 96, 5, 0, 7); g.fill();
});

/* ============================== 几何小工具 ============================== */

function plainBox(w, h, d, m, x, y, z) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z); return o;
}
function rbox(w, h, d, r, m, x, y, z) {
  const rad = Math.max(0.005, Math.min(r, Math.min(w, h, d) / 2 - 0.01));
  const o = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, rad), m);
  o.position.set(x, y, z); return o;
}
function cyl(rt, rb, h, m, x, y, z, seg = 16, open = false, t0 = 0, tl = Math.PI * 2) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open, t0, tl), m);
  o.position.set(x, y, z); return o;
}
function sph(r, m, x, y, z, w = 14, h = 10) {
  const o = new THREE.Mesh(new THREE.SphereGeometry(r, w, h), m);
  o.position.set(x, y, z); return o;
}
function tubeAB(a, b, r, m, seg = 6) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), m);
  o.position.copy(a).addScaledVector(d, 0.5);
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  return o;
}
function sh(o, cast = true, recv = true) { o.castShadow = cast; o.receiveShadow = recv; return o; }

/* ============================== 地形高度场 ============================== */

const KNOLLS = [
  { x: 7.6, z: 6.4, r: 3.2, h: 1.15 },
  { x: -6.8, z: 5.8, r: 2.8, h: 0.6 },
  { x: 10.5, z: -6.5, r: 2.4, h: 0.5 },
  { x: -4.4, z: -8.3, r: 3.0, h: 0.5 },
  { x: -8.5, z: -2.0, r: 2.2, h: 0.25 }
];
function groundY(x, z) {
  const d = Math.hypot(x, z);
  let y = d < 14 ? 3.99 * Math.sqrt(Math.max(0, 1 - (d / 14) ** 2)) : 0;
  for (const k of KNOLLS) {
    const dd = Math.hypot(x - k.x, z - k.z);
    y += k.h * Math.exp(-(dd * dd) / (2 * k.r * k.r));
  }
  return y;
}

/* ============================== 天空 · 星月 ============================== */

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cTop: { value: new THREE.Color(PAL.skyTop) },
      cMid: { value: new THREE.Color(PAL.skyMid) },
      cHor: { value: new THREE.Color(PAL.skyHor) }
    },
    vertexShader: 'varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cHor; varying vec3 vW; void main(){ float h=normalize(vW).y; vec3 col=mix(cHor,cMid,smoothstep(0.0,0.30,h)); col=mix(col,cTop,smoothstep(0.26,0.78,h)); col=mix(col,cHor*0.88,smoothstep(0.0,-0.22,h)); gl_FragColor=vec4(col,1.0); }'
  })
);
scene.add(sky);

function makeStars(count, radius, size, opacity) {
  const pos = [];
  for (let i = 0; i < count; i++) {
    const a = rr(0, Math.PI * 2), e = Math.asin(rr(0.02, 0.98));
    const r = radius * rr(0.96, 1.04);
    pos.push(r * Math.cos(e) * Math.cos(a), r * Math.sin(e), r * Math.cos(e) * Math.sin(a));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size, map: glowTex, transparent: true, opacity, depthWrite: false,
    blending: THREE.AdditiveBlending, color: 0xfff2cf, fog: false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return pts;
}
const starsA = makeStars(700, 250, 2.3, 0.85);
const starsB = makeStars(420, 255, 1.5, 0.7);

const moonPos = new THREE.Vector3(-0.62, 0.42, 0.64).normalize().multiplyScalar(262);
const moon = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshBasicMaterial({ map: moonTex, transparent: true, fog: false, depthWrite: false })
);
moon.position.copy(moonPos); moon.lookAt(0, 0, 0); scene.add(moon);
const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xf6e6bd, transparent: true, opacity: 0.5,
  depthWrite: false, blending: THREE.AdditiveBlending, fog: false
}));
moonGlow.position.copy(moonPos).multiplyScalar(0.985);
moonGlow.scale.setScalar(96); scene.add(moonGlow);

const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xffb37a, transparent: true, opacity: 0.62,
  depthWrite: false, blending: THREE.AdditiveBlending, fog: false
}));
sunGlow.position.set(170, 20, -218); sunGlow.scale.set(150, 120, 1); scene.add(sunGlow);
const sunCore = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xffd9a6, transparent: true, opacity: 0.85,
  depthWrite: false, blending: THREE.AdditiveBlending, fog: false
}));
sunCore.position.set(170, 16, -218); sunCore.scale.set(38, 30, 1); scene.add(sunCore);

/* ============================== 灯光 ============================== */

scene.add(new THREE.HemisphereLight(0x8d9bd8, 0xa98f70, 0.72));

const sun = new THREE.DirectionalLight(0xffbd80, 1.25);
sun.position.set(38, 30, -46);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -24; sun.shadow.camera.right = 24;
sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);
sun.target.position.set(0, 3, 0);

const fill = new THREE.DirectionalLight(0x7f9adf, 0.34);
fill.position.set(-32, 22, 40); scene.add(fill);

/* ============================== 浮空岛本体 ============================== */

const island = new THREE.Group();
scene.add(island);

const grassGeo = new THREE.SphereGeometry(14, 72, 36, 0, Math.PI * 2, 0, Math.PI / 2);
{
  const pos = grassGeo.attributes.position;
  const cA = new THREE.Color(PAL.grassA), cB = new THREE.Color(PAL.grassB), tmp = new THREE.Color();
  const cols = [];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const t = 0.5 + 0.5 * Math.sin(x * 0.32 + Math.sin(z * 0.21) * 1.7) * Math.cos(z * 0.27 + x * 0.11);
    tmp.copy(cA).lerp(cB, Math.max(0, Math.min(1, t * 0.8 + rr(-0.1, 0.1))));

function craggy(geo, amp, ph) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const r = Math.hypot(x, z);
    if (r < 0.001) continue;
    const a = Math.atan2(z, x);
    const k = 1 + amp * (Math.sin(a * 3 + ph) * 0.5 + Math.sin(a * 7 + ph * 1.7) * 0.32 + Math.sin(a * 13 + ph * 2.3) * 0.2);
    p.setX(i, Math.cos(a) * r * k);
    p.setZ(i, Math.sin(a) * r * k);
    p.setY(i, y + Math.sin(a * 5 + ph) * amp * r * 0.3);
  }
  geo.computeVertexNormals();
}

function makePerson(o = {}) {
  const g = new THREE.Group();
  const skin = stdM(o.skin ?? 0xf7d9b8, { roughness: 0.85 });
  const cloth = stdM(o.cloth ?? 0x7fb069, { roughness: 0.95 });
  const dark = stdM(0x4a3a2e);
  const hairM = stdM(o.hair ?? 0x6b4a2f, { roughness: 1 });
  const headY = o.seated ? 0.88 : 0.86;
  const torsoY = o.seated ? 0.5 : 0.48;
  if (o.dress !== undefined) g.add(cyl(0.09, 0.3, 0.65, stdM(o.dress, { roughness: 0.9 }), 0, 0.33, 0, 12));
  else if (o.robe) g.add(cyl(0.09, 0.34, 0.66, stdM(o.robe), 0, 0.33, 0, 12));
  else if (o.seated) [-0.07, 0.07].forEach(x => {
    const th = cyl(0.05, 0.05, 0.34, dark, x, 0.3, 0.17, 7); th.rotation.x = Math.PI / 2; g.add(th);
    g.add(cyl(0.045, 0.045, 0.3, dark, x, 0.15, 0.34, 7));
    g.add(rbox(0.1, 0.06, 0.16, 0.02, dark, x, 0.03, 0.38));
  });
  else [-0.07, 0.07].forEach(x => g.add(cyl(0.05, 0.05, 0.28, dark, x, 0.14, 0, 7)));
  g.add(cyl(0.12, 0.19, 0.4, cloth, 0, torsoY, 0, 12));
  if (o.belt) g.add(cyl(0.135, 0.135, 0.05, goldM, 0, torsoY - 0.12, 0, 10));
  const armR = new THREE.Group(); armR.position.set(0.17, torsoY + 0.18, 0);
  armR.add(cyl(0.038, 0.038, 0.3, cloth, 0, -0.15, 0, 7));
  armR.add(sph(0.045, skin, 0, -0.31, 0, 8, 6));
  armR.rotation.z = o.wave ? -2.35 : -0.24;
  g.add(armR);
  const armL = new THREE.Group(); armL.position.set(-0.17, torsoY + 0.18, 0);
  armL.add(cyl(0.038, 0.038, 0.3, cloth, 0, -0.15, 0, 7));
  armL.add(sph(0.045, skin, 0, -0.31, 0, 8, 6));
  armL.rotation.z = 0.24;
  g.add(armL);
  g.add(sph(0.165, skin, 0, headY, 0, 16, 12));
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.175, 16, 10, 0, Math.PI * 2, 0, 1.9), hairM);
  cap.position.y = headY + 0.01; g.add(cap);
  [-0.055, 0.055].forEach(x => g.add(sph(0.016, stdM(0x3a2e24), x, headY + 0.02, 0.15, 6, 5)));
  [-0.1, 0.1].forEach(x => g.add(sph(0.022, stdM(0xf2a6bd), x, headY - 0.03, 0.115, 6, 5)));
  if (o.messy) [0.01, -0.05, 0.06].forEach((x, i) => g.add(sph(0.05, hairM, x, headY + 0.17 + (i % 2) * 0.02, -0.02 + i * 0.03, 6, 5)));
  if (o.crown) {
    g.add(cyl(0.1, 0.12, 0.09, goldM, 0, headY + 0.15, 0, 10));
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * Math.PI * 2;
      const sp = new THREE.Mesh(new THREE.ConeGeometry(0.022, 0.06, 5), goldM);
      sp.position.set(Math.cos(a) * 0.09, headY + 0.22, Math.sin(a) * 0.09);
      g.add(sp);
    }
  }
  if (o.beard) {
    const b = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 10), stdM(0xf2ede2, { roughness: 1 }));
    b.rotation.x = Math.PI; b.position.set(0, headY - 0.16, 0.09); g.add(b);
  }
  if (o.helmet) {
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8, 0, Math.PI * 2, 0, 1.75), metalM);
    hl.position.y = headY + 0.03; g.add(hl);
    g.add(plainBox(0.03, 0.14, 0.05, metalM, 0, headY - 0.02, 0.16));
  }
  if (o.straw) {
    g.add(cyl(0.19, 0.22, 0.05, thatchM, 0, headY + 0.14, 0, 12));
    g.add(cyl(0.11, 0.14, 0.12, thatchM, 0, headY + 0.22, 0, 10));

  if (o.tiara) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 6, 16), goldM);
    t.rotation.x = Math.PI / 2; t.position.y = headY + 0.15; g.add(t);

  if (o.bun) {
    const s = sph(0.1, hairM, 0, headY - 0.02, -0.16, 10, 8);
    s.scale.set(1, 1, 0.8); g.add(s);
  }
  if (o.scarf) {
    const sm = stdM(o.scarfColor ?? 0xf6efe2, { roughness: 1 });
    const segs = [];
    const root = new THREE.Group(); root.position.set(0, headY - 0.18, -0.13);
    g.add(root);
    let parent = root;
    segs.push({ grp: root });
    for (let i = 0; i < 6; i++) {
      const w = 0.2 - i * 0.022, l = 0.17;
      const grp = new THREE.Group(); grp.position.set(0, 0, -l);
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.03, l), sm);
      m.position.z = -l / 2; grp.add(m);
      parent.add(grp); parent = grp;
      segs.push({ grp });
    }
    g.userData.scarf = segs;
  }
  if (o.lute) {
    const lute = new THREE.Group();
    const body = sph(0.13, woodMat, 0, 0, 0, 10, 8); body.scale.set(1, 0.55, 1.25); lute.add(body);

    lute.rotation.set(0.5, 0, -0.9);
    lute.position.set(0, torsoY + 0.08, 0.18);
    g.add(lute);

  if (o.sword) {
    const blade = plainBox(0.045, 0.75, 0.014, metalM, 0.31, 0.55, 0.02);
    blade.rotation.z = 0.25; g.add(blade);
    g.add(plainBox(0.16, 0.03, 0.03, goldM, 0.36, 0.2, 0.02));
  }
  return g;
}

function fenceLine(x0, z0, x1, z1) {
  const g = new THREE.Group();
  const n = Math.max(2, Math.round(Math.hypot(x1 - x0, z1 - z0) / 0.8));
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const k = i / n, x = x0 + (x1 - x0) * k, z = z0 + (z1 - z0) * k, y = groundY(x, z);
    g.add(cyl(0.035, 0.035, 0.55, woodMat, x, y + 0.27, z, 6));
    if (prev) {
      g.add(tubeAB(new THREE.Vector3(prev[0], prev[1] + 0.42, prev[2]), new THREE.Vector3(x, y + 0.42, z), 0.025, woodMat));
      g.add(tubeAB(new THREE.Vector3(prev[0], prev[1] + 0.2, prev[2]), new THREE.Vector3(x, y + 0.2, z), 0.025, woodMat));
    }
    prev = [x, y, z];
  }
  island.add(g);
}

    for (let i = 0; i < p.count; i++) {

    }

  }
  if (prince && prince.userData.scarf) {
    prince.userData.scarf.forEach((s, i) => {
      s.grp.rotation.x = 0.16 + Math.sin(t * 2.8 - i * 0.75) * 0.18;
    });
  }
  if (chand) {
    chand.rotation.z = Math.sin(t * 0.6) * 0.045;
    chand.rotation.x = Math.cos(t * 0.5) * 0.03;
  }

  starsA.material.opacity = 0.55 + 0.3 * Math.sin(t * 0.8);
  starsB.material.opacity = 0.7 + 0.22 * Math.sin(t * 0.8 + 2.1);
  moonGlow.material.opacity = 0.45 + 0.08 * Math.sin(t * 0.7);

  mistTop.material.opacity = 0.42 + 0.14 * Math.sin(t * 1.7);
  mistTop.scale.setScalar(3.4 + Math.sin(t * 1.7) * 0.4);

  for (const b of birds) {
    const a = t * b.sp + b.ph;
    b.obj.position.set(Math.cos(a) * b.R, b.H + Math.sin(t * 1.3 + b.ph) * 0.5, Math.sin(a) * b.R);
    b.obj.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)) - Math.PI / 2;
    const w = Math.sin(t * 9 + b.ph) * 0.75;
    b.obj.userData.wings[0].rotation.x = w;
    b.obj.userData.wings[1].rotation.x = -w;
  }
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 46) c.position.x = -46;
  }
  for (const g of minis) {
    g.position.y = g.userData.baseY + Math.sin(t * 0.55 + g.userData.ph) * 0.45;
    g.rotation.y = Math.sin(t * 0.1 + g.userData.ph) * 0.06;
  }
  balloon.position.set(Math.cos(t * 0.055) * 21, 16.5 + Math.sin(t * 0.3) * 0.9, Math.sin(t * 0.055) * 21);
  balloon.rotation.y = -t * 0.055 + 0.6;

  ducks.forEach((d, i) => {
    const a = t * 0.14 + i * 2.4 + d.userData.off;
    d.position.set(pondC.x + Math.cos(a) * 1.1, pondTop + 0.02 + Math.sin(t * 1.3 + i) * 0.03, pondC.z + Math.sin(a) * 1.1);
    d.rotation.y = -a + i;
  });

  if (t > shootNext) { shootT = 0; shootNext = t + rr(8, 15);
    shootStart.set(rr(-90, 40), rr(60, 110), rr(-170, -70));
    shootVel.set(90, -34, 46); }
  if (shootT >= 0) {
    shootT += dt;
    const k = shootT / 1.2;
    if (k >= 1) { shootT = -1; shoot.material.opacity = 0; }
    else {
      shoot.position.copy(shootStart).addScaledVector(shootVel, k);
      shoot.material.opacity = Math.sin(Math.PI * k) * 0.9;
    }
  }

  ffPts.material.opacity = 0.5 + 0.3 * Math.sin(t * 1.8);
  const fp = ffGeo.attributes.position;
  for (let i = 0; i < FF_N; i++) {
    const ph = ffPh[i];
    fp.setX(i, ffBase[i * 3] + Math.sin(t * 0.7 + ph) * 0.55);
    fp.setY(i, ffBase[i * 3 + 1] + Math.sin(t * 0.9 + ph * 1.7) * 0.3);
    fp.setZ(i, ffBase[i * 3 + 2] + Math.cos(t * 0.6 + ph * 0.9) * 0.55);
  }
  fp.needsUpdate = true;

  for (const s of smokes) {
    const p = s.geo.attributes.position;
    for (let i = 0; i < s.n; i++) {
      const y = p.getY(i) + s.data[i].vy * dt;
      const x = p.getX(i) + s.data[i].vx * dt;
      const z = p.getZ(i) + s.data[i].vz * dt;
      if (y > s.y + 5.5) p.setXYZ(i, s.x + Math.random() * 0.3 - 0.15, s.y, s.z + Math.random() * 0.3 - 0.15);
      else p.setXYZ(i, x, y, z);
    }
    p.needsUpdate = true;
  }

  const wp = wfGeo.attributes.position;
  for (let i = 0; i < WF_N; i++) {
    let y = wp.getY(i) - wfVel[i] * dt;
    let x = wp.getX(i) + wfDirX * dt;
    let z = wp.getZ(i) + wfDirZ * dt;
    if (y < -32) {
      x = WATERFALL.x + Math.random() * 1.6 - 0.8;
      z = WATERFALL.z + Math.random() * 1.6 - 0.8;
      y = WATERFALL.y + Math.random() * 0.4 - 0.2;
    }
    wp.setXYZ(i, x, y, z);
  }
  wp.needsUpdate = true;

  MARKERS.forEach((M, i) => {
    M.sprite.scale.setScalar(1.15 + Math.sin(t * 2 + i * 1.1) * 0.14);
    M.sprite.position.y = M.p[1] + Math.sin(t * 1.4 + i * 1.3) * 0.15;
  });

  if (camTween) {
    const k = Math.min(1, (performance.now() - camTween.start) / camTween.dur);
    const e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (k >= 1) { camTween = null; controls.enabled = true; }
  }

  controls.update();
  renderer.render(scene, camera);
  frames++;
  if (frames === 4) loadingEl.classList.add('hide');
}

renderer.setAnimationLoop(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
