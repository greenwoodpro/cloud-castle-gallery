<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>云端城堡 · 浮空岛上的中世纪堡垒</title>
<style>
  :root{
    --paper:#fbf3e2;
    --paper-2:#f3e6cd;
    --ink:#5a4632;
    --ink-soft:#8a7458;
    --line:#d8c3a0;
    --gold:#c9974a;
    --rose:#d98d92;
    --sky:#8fb6cd;
    --leaf:#7d9b63;
    --shadow:0 6px 22px rgba(120,96,64,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#cfe0ea;}
  body{
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,"Microsoft YaHei",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;outline:none;}

  /* ---------- 载入 ---------- */
  #loader{
    position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(180deg,#bcd9e8 0%,#e7dcc6 60%,#f3e6cd 100%);
    transition:opacity .8s ease;
  }
  #loader h1{font-size:26px;letter-spacing:.28em;margin:0;font-weight:600;}
  #loader p{margin:0;color:var(--ink-soft);font-size:13px;letter-spacing:.16em;}
  #loader .dots{display:flex;gap:7px;margin-top:6px;}
  #loader .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bob 1.1s infinite ease-in-out;}
  #loader .dots i:nth-child(2){animation-delay:.18s}
  #loader .dots i:nth-child(3){animation-delay:.36s}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}
  #loader.hide{opacity:0;pointer-events:none;}
  #loader .err{max-width:520px;text-align:center;line-height:1.7;font-size:13px;color:#9a5a4a;padding:0 20px;}

  /* ---------- 顶栏 ---------- */
  .panel{
    position:absolute;background:linear-gradient(180deg,rgba(251,243,226,.95),rgba(243,230,205,.92));
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    backdrop-filter:blur(6px);
  }
  #titlebar{
    left:18px;top:16px;padding:12px 18px 11px;max-width:330px;
  }
  #titlebar .zh{font-size:19px;letter-spacing:.16em;font-weight:600;line-height:1.25;}
  #titlebar .en{font-size:10.5px;letter-spacing:.26em;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;}
  #titlebar .tip{font-size:11.5px;color:var(--ink-soft);margin-top:9px;line-height:1.65;border-top:1px dashed var(--line);padding-top:8px;}

  /* ---------- 右侧控制 ---------- */
  #toolbar{right:18px;top:16px;padding:12px 13px;width:186px;}
  #toolbar .grp{margin-bottom:11px;}
  #toolbar .grp:last-child{margin-bottom:0;}
  #toolbar .lbl{font-size:10.5px;letter-spacing:.16em;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;}
  button{
    font-family:inherit;font-size:11.5px;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.62);border:1px solid var(--line);
    border-radius:9px;padding:6px 9px;transition:.18s;letter-spacing:.06em;
  }
  button:hover{background:#fff;border-color:var(--gold);transform:translateY(-1px);}
  button.on{background:var(--gold);color:#fff8ea;border-color:var(--gold);}
  .slider{width:100%;accent-color:var(--gold);}

  /* ---------- 左侧图鉴 ---------- */
  #atlas{
    left:18px;top:132px;bottom:16px;width:274px;padding:10px;
    display:flex;flex-direction:column;
  }
  #atlas .head{display:flex;align-items:baseline;justify-content:space-between;padding:2px 6px 8px;}
  #atlas .head b{font-size:13px;letter-spacing:.16em;font-weight:600;}
  #atlas .head span{font-size:10px;color:var(--ink-soft);letter-spacing:.1em;cursor:pointer;user-select:none;
    border-bottom:1px dashed var(--line);padding-bottom:1px;}
  #atlas .head span:hover{color:var(--gold);border-color:var(--gold);}
  #atlas.folded{bottom:auto;}
  #atlas.folded #atlasList{display:none;}
  #atlasList{overflow-y:auto;flex:1;padding-right:4px;}
  #atlasList::-webkit-scrollbar{width:5px;}
  #atlasList::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .item{border-bottom:1px dashed rgba(216,195,160,.75);padding:7px 6px;}
  .item:last-child{border-bottom:none;}
  .item .row{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .item .no{
    width:20px;height:20px;flex:0 0 20px;border-radius:6px;background:var(--paper-2);
    border:1px solid var(--line);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .item .nm{font-size:12.5px;letter-spacing:.06em;flex:1;}
  .item .ar{font-size:10px;color:var(--ink-soft);transition:.2s;}
  .item.open .ar{transform:rotate(90deg);}
  .item .desc{
    display:none;font-size:11.5px;line-height:1.85;color:#6b563f;
    padding:8px 4px 4px 28px;
  }
  .item.open .desc{display:block;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .item .desc em{font-style:normal;color:var(--rose);}
  .item .desc b{color:#8a6a3c;font-weight:600;}
  .fly{margin:6px 0 2px 28px;font-size:11px;padding:4px 12px;border-radius:20px;}
  .item.open .fly{display:inline-block;}

  /* ---------- 底部提示 ---------- */
  #hint{
    left:50%;transform:translateX(-50%);bottom:16px;padding:8px 18px;
    font-size:11.5px;color:var(--ink-soft);letter-spacing:.1em;display:flex;gap:16px;
  }
  #hint kbd{
    background:var(--paper-2);border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;font-family:inherit;font-size:11px;color:var(--ink);
  }
  /* ---------- 悬浮标签 ---------- */
  #tag{
    position:absolute;pointer-events:none;transform:translate(-50%,-130%);
    background:rgba(251,243,226,.94);border:1px solid var(--line);border-radius:8px;
    padding:4px 10px;font-size:11.5px;letter-spacing:.08em;color:var(--ink);
    box-shadow:var(--shadow);opacity:0;transition:opacity .25s;white-space:nowrap;
  }
  #tag.show{opacity:1;}
  @media (max-width:1180px){
    #atlas{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="titlebar" class="panel">
  <div class="zh">云 端 城 堡</div>
  <div class="en">A Medieval Castle on a Floating Isle</div>
  <div class="tip">一座随云漂流的浮空岛，岛上立着石砌的城堡。画笔取自《小王子》：柔和、温吞、带一点孩子气的认真。</div>
</div>

<div id="toolbar" class="panel">
  <div class="grp">
    <span class="lbl">时 辰</span>
    <div class="btnrow">
      <button data-time="day" class="on">白昼</button>
      <button data-time="dusk">黄昏</button>
      <button data-time="night">星夜</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">剖 面</span>
    <div class="btnrow">
      <button id="btnRoof" class="on">屋顶</button>
      <button id="btnWall">揭墙</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">漫 游</span>
    <div class="btnrow">
      <button id="btnSpin">自动环绕</button>
      <button id="btnLife" class="on">生灵</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">云 海 浓 度</span>
    <input id="cloudSlider" class="slider" type="range" min="0" max="100" value="62" />
  </div>
  <div class="grp">
    <span class="lbl">视 角</span>
    <div class="btnrow">
      <button id="btnReset">复位</button>
      <button id="btnTop">俯瞰</button>
      <button id="btnIn">入城</button>
    </div>
  </div>
</div>

<div id="atlas" class="panel">
  <div class="head"><b>岛 屿 图 鉴</b><span id="atlasFold">收起</span></div>
  <div id="atlasList"></div>
</div>

<div id="hint" class="panel">
  <span><kbd>左键</kbd> 旋转</span>
  <span><kbd>右键</kbd> 平移</span>
  <span><kbd>滚轮</kbd> 远近</span>
  <span><kbd>点击</kbd> 建筑</span>
</div>

<div id="tag"></div>

<div id="loader">
  <h1>云 端 城 堡</h1>
  <p>正在捏这座岛……</p>
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<script type="module">
/* ============================================================================
   云端城堡 —— three.js 浮空岛中世纪城堡
   画风：小王子式水彩插画（柔和哑光、暖色纸调、呼吸感）
   ========================================================================== */

/* ---------- 0. 引导：优先本地 three，失败回落 CDN ---------- */
let THREE = null;
const SOURCES = [
  './vendor/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js'
];
for (const src of SOURCES) {
  try { THREE = await import(src); break; } catch (e) { /* 试下一个 */ }
}
if (!THREE) {
  document.getElementById('loader').innerHTML =
    '<h1>云 端 城 堡</h1><div class="err">没能加载 three.js。<br>' +
    '请确认 vendor/three.module.js 存在，或连上网络后刷新（会自动回落到 CDN）。</div>';
  throw new Error('three.js load failed');
}

/* ---------- 1. 基础：场景 / 相机 / 渲染器 ---------- */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd6e3ea, 120, 430);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 2000);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
app.appendChild(renderer.domElement);

/* ---------- 2. 轨道控制器（自写，含阻尼） ---------- */
class Orbit {
  constructor(cam, dom) {
    this.cam = cam; this.dom = dom;
    this.pan = new THREE.Vector3(0, 6, -14);      // 焦点（相机看向这里）
    this.tPan = this.pan.clone();
    this.sph = new THREE.Spherical(150, 1.10, 0.72);
    this.tSph = this.sph.clone();
    this.drag = null; this.px = 0; this.py = 0;
    this.auto = false; this.spin = 0.045;
    this.minD = 12; this.maxD = 460;
    this.minP = 0.10; this.maxP = 1.52;
    this._bind();
    this.update(0);
  }
  _bind() {
    const d = this.dom;
    d.style.touchAction = 'none';
    d.addEventListener('contextmenu', e => e.preventDefault());
    d.addEventListener('pointerdown', e => {
      d.setPointerCapture(e.pointerId);
      this.drag = (e.button === 0 && !e.shiftKey) ? 'rot' : 'pan';
      this.px = e.clientX; this.py = e.clientY;
      this.pdown = { x: e.clientX, y: e.clientY, t: performance.now() };
    });
    d.addEventListener('pointermove', e => {
      if (!this.drag) return;
      const dx = e.clientX - this.px, dy = e.clientY - this.py;
      this.px = e.clientX; this.py = e.clientY;
      if (this.drag === 'rot') {
        this.tSph.theta -= dx * 0.0052;
        this.tSph.phi = THREE.MathUtils.clamp(this.tSph.phi - dy * 0.0045, this.minP, this.maxP);
      } else {
        const s = this.tSph.radius * 0.0016;
        const right = new THREE.Vector3().setFromMatrixColumn(this.cam.matrix, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.cam.matrix, 1);
        this.tPan.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
      }
    });
    const up = e => { this.drag = null; };
    d.addEventListener('pointerup', up);
    d.addEventListener('pointercancel', up);
    d.addEventListener('wheel', e => {
      e.preventDefault();
      this.tSph.radius = THREE.MathUtils.clamp(
        this.tSph.radius * (1 + Math.sign(e.deltaY) * 0.09), this.minD, this.maxD);
    }, { passive: false });
  }
  /** 平滑飞向目标 */
  flyTo(pos, target, dur = 1500) {
    const from = { p: this.cam.position.clone(), t: this.pan.clone() };
    const off = pos.clone().sub(target);
    const toS = new THREE.Spherical().setFromVector3(off);
    if (dur > 0) { /* 保持平滑 */ }
    const s0 = new THREE.Spherical().setFromVector3(from.p.clone().sub(from.t));
    // 取最短角路径
    while (toS.theta - s0.theta > Math.PI) toS.theta -= Math.PI * 2;
    while (toS.theta - s0.theta < -Math.PI) toS.theta += Math.PI * 2;
    if (!(dur > 0)) {                       // 立即到位（防 0/0 = NaN）
      this.sph.copy(toS); this.tSph.copy(toS);
      this.pan.copy(target); this.tPan.copy(target);
      this.update(0);
      return;
    }
    const r0 = { s: s0, t: from.t }, r1 = { s: toS, t: target.clone() };
    const t0 = performance.now();
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / dur), e = ease(k);
      this.tSph.radius = THREE.MathUtils.lerp(r0.s.radius, r1.s.radius, e);
      this.tSph.phi = THREE.MathUtils.lerp(r0.s.phi, r1.s.phi, e);
      this.tSph.theta = THREE.MathUtils.lerp(r0.s.theta, r1.s.theta, e);
      this.tPan.copy(r0.t).lerp(r1.t, e);
      this.sph.copy(this.tSph); this.pan.copy(this.tPan);
      this.update(0);
      if (k < 1) requestAnimationFrame(step);
    };
    step();
  }
  update(dt) {
    if (this.auto && !this.drag) this.tSph.theta += this.spin * dt;
    const k = 0.12;
    this.sph.radius += (this.tSph.radius - this.sph.radius) * k;
    this.sph.phi += (this.tSph.phi - this.sph.phi) * k;
    this.sph.theta += (this.tSph.theta - this.sph.theta) * k;
    this.pan.lerp(this.tPan, k);
    const c = new THREE.Vector3().setFromSpherical(this.sph);
    this.cam.position.copy(this.pan).add(c);
    this.cam.lookAt(this.pan);
  }
}
const ctrl = new Orbit(camera, renderer.domElement);

/* ---------- 3. 调色板 & 材质工厂 ---------- */
const C = {
  grass: 0x9cb877, grass2: 0x87a463, meadow: 0xb3c98a,
  wheat: 0xdcbb63, wheat2: 0xc9a44e,
  soil: 0xa8845c, soilDark: 0x7d6244, path: 0xc4ab84,
  rock: 0x9a9086, rockDark: 0x6f6862, rockLight: 0xbdb3a6,
  cliff: 0x8a7f72,
  stone: 0xd8cdb8, stone2: 0xc2b49c, stoneDark: 0x9c8e78,
  wood: 0xa9714a, woodDark: 0x7c5136, woodLight: 0xc79268,
  roof: 0xa55c50, roof2: 0x8d4a44, roofBlue: 0x6d7f92,
  gold: 0xd8a94e, water: 0x7fb0c9, waterDeep: 0x4f7f9c,
  leaf: 0x6f9155, leaf2: 0x587c46, leaf3: 0x8aa86a,
  cloud: 0xfdf8f0, rose: 0xdd8f92, prince: 0x6f9c78, hair: 0xe8c463,
  skin: 0xf0c9a8, white: 0xf7f1e4, black: 0x4a3f36
};

const MATS = {};
function mat(color, opt = {}) {
  const key = color + '|' + JSON.stringify(opt);
  if (MATS[key]) return MATS[key];
  const m = new THREE.MeshStandardMaterial(Object.assign({
    color, roughness: opt.rough ?? 0.92, metalness: opt.metal ?? 0.0,
    flatShading: !!opt.flat
  }, opt.extra || {}));
  MATS[key] = m; return m;
}
/** 柔和的透明材质（水面 / 玻璃罩） */
function glassMat(color, opacity = 0.55) {
  return mat(color, { extra: { transparent: true, opacity, roughness: 0.25, metalness: 0.1, side: THREE.DoubleSide }, rough: 0.25 });
}

/* ---------- 通用几何助手 ---------- */
const G = {
  box: (w, h, d) => new THREE.BoxGeometry(w, h, d),
  cyl: (rt, rb, h, s = 12) => new THREE.CylinderGeometry(rt, rb, h, s),
  sph: (r, s = 12) => new THREE.SphereGeometry(r, s, Math.max(6, s >> 1)),
  cone: (r, h, s = 10) => new THREE.ConeGeometry(r, h, s),
  cap: (r, l, s = 8) => new THREE.CapsuleGeometry(r, l, 3, s),
};
function put(geo, material, x = 0, y = 0, z = 0, parent = null, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  (parent || scene).add(m);
  return m;
}
function group(x = 0, y = 0, z = 0, parent = null) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  (parent || scene).add(g);
  return g;
}

/* ---------- 4. 噪声 ---------- */
function hash2(x, y) {
  let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return h - Math.floor(h);
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct = 4) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += noise2(x * f, y * f) * amp; amp *= 0.5; f *= 2; }
  return s;
}
const smoothstep = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------- 5. 地形高程场（全局统一，建筑贴地用） ---------- */
const ISLAND_R = 62;
const PLATEAU = { x: 0, z: -26, r: 30, h: 8.4 };   // 城堡岩台
const LAKE = { x: 33, z: 20, r: 13.5 };            // 湖泊
const HILL = { x: -34, z: 26, r: 16, h: 6.2 };      // 西南丘陵（磨坊）

function terrainH(x, z) {
  const r = Math.hypot(x, z);
  let h = 0;
  // 基础起伏
  h += (fbm(x * 0.035 + 10, z * 0.035 + 10, 4) - 0.5) * 4.4;
  h += (fbm(x * 0.11, z * 0.11, 3) - 0.5) * 1.1;
  // 城堡岩台：抬升为台地
  const dp = Math.hypot(x - PLATEAU.x, z - PLATEAU.z);
  const plateau = (1 - smoothstep(PLATEAU.r * 0.62, PLATEAU.r * 1.06, dp));
  h += plateau * PLATEAU.h;
  // 岩台边缘做一圈陡崖（收窄过渡）
  h += (1 - smoothstep(PLATEAU.r * 0.86, PLATEAU.r * 1.02, dp)) * smoothstep(PLATEAU.r * 0.75, PLATEAU.r * 0.99, dp) * 2.2;
  // 西南丘陵
  const dh = Math.hypot(x - HILL.x, z - HILL.z);
  h += (1 - smoothstep(HILL.r * 0.5, HILL.r, dh)) * HILL.h;
  // 湖泊下凹
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
  h -= (1 - smoothstep(LAKE.r * 0.55, LAKE.r * 1.05, dl)) * 4.2;
  // 岛缘：向下垂落，形成浮空岛的"碗边"
  const edge = smoothstep(ISLAND_R * 0.80, ISLAND_R * 1.0, r);
  h -= edge * edge * 16;
  return h;
}
/** 地形分区（用于着色与撒点） */
function zoneOf(x, z) {
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
  if (dl < LAKE.r * 0.82) return 'lake';
  const dp = Math.hypot(x - PLATEAU.x, z - PLATEAU.z);
  if (dp < PLATEAU.r * 0.92) return 'plateau';
  if (x < -20 && z < -8) return 'forest';                     // 西北林
  if (x < -16 && z > 6) return 'wheat';                        // 西南麦田
  if (z > 6 && x > -16 && x < 24) return 'wheat';              // 南麦田
  if (x > 18 && z < 4) return 'forest';                         // 东北林
  return 'meadow';
}

/* ============================================================================
   6. 浮空岛：顶面（顶点着色网格）+ 底部岩锥
   ========================================================================== */
const island = group();

function buildIslandTop() {
  const RINGS = 84, SEGS = 132;
  const pos = [], col = [], idx = [];
  const c1 = new THREE.Color();
  const ZCOLOR = {
    plateau: [0.62, 0.68, 0.42], meadow: [0.60, 0.72, 0.45],
    wheat: [0.86, 0.74, 0.38], forest: [0.42, 0.56, 0.36],
    lake: [0.36, 0.55, 0.55]
  };
  for (let i = 0; i <= RINGS; i++) {
    const t = i / RINGS;
    const rr = Math.pow(t, 0.92) * ISLAND_R;
    for (let j = 0; j <= SEGS; j++) {
      const a = j / SEGS * Math.PI * 2;
      // 岛缘做成不规则花瓣形
      const lobe = 1 + 0.085 * Math.sin(a * 3 + 1.3) + 0.055 * Math.sin(a * 5 - 0.7) + 0.04 * Math.sin(a * 8 + 2.1);
      const R = ISLAND_R * lobe;
      const x = Math.cos(a) * rr * lobe, z = Math.sin(a) * rr * lobe;
      const y = terrainH(x, z);
      pos.push(x, y, z);
      // 颜色：按分区 + 坡度 + 高度混合
      const z0 = zoneOf(x, z);
      let base = ZCOLOR[z0];
      const slope = Math.max(0, 1 - Math.abs(terrainH(x + 1.4, z) - y) * 2.2 - Math.abs(terrainH(x, z + 1.4) - y) * 2.2);
      // 陡坡露岩
      const rockMix = 1 - THREE.MathUtils.clamp(slope, 0, 1);
      const n = fbm(x * 0.2, z * 0.2, 2);
      c1.setRGB(base[0], base[1], base[2]);
      const cs = new THREE.Color(0x9a9086);
      c1.lerp(cs, rockMix * 0.5);
      // 岛缘留一点草色，别让边缘一圈全是裸岩
      const edgeT = smoothstep(ISLAND_R * 0.74, ISLAND_R * 0.97, Math.hypot(x, z));
      c1.lerp(c1.clone().setHex(0x8fa068), edgeT * 0.45);
      c1.offsetHSL(0, 0, (n - 0.5) * 0.09);
      if (y < -3) c1.lerp(new THREE.Color(0x8a7f72), smoothstep(-3, -9, y));
      col.push(c1.r, c1.g, c1.b);
    }
  }
  for (let i = 0; i < RINGS; i++) {
    for (let j = 0; j < SEGS; j++) {
      const a = i * (SEGS + 1) + j, b = a + SEGS + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  // 必须双面：地形是一层没有厚度的曲面，单面的话从岛下方看会被整个剔除，
  // 看起来就像地面"透明"、直接透出天空
  const m = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.97, metalness: 0, flatShading: true,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.receiveShadow = true;
  island.add(mesh);
  return mesh;
}

function buildIslandBottom() {
  // 倒锥岩体：两层主峰 + 噪声，flatShading 出岩石棱面
  const RINGS = 26, SEGS = 72;
  const pos = [], col = [], idx = [];
  const c = new THREE.Color(), top = new THREE.Color(0xa99b86), bot = new THREE.Color(0x807465);
  const peaks = [{ x: 0, z: -14, w: 1.0, d: 88 }, { x: -26, z: 20, w: 0.55, d: 54 }, { x: 30, z: -6, w: 0.4, d: 44 }];
  for (let i = 0; i <= RINGS; i++) {
    const t = i / RINGS;                 // 0 = 岛缘, 1 = 底部尖端
    const rr = Math.pow(1 - t, 1.55);
    for (let j = 0; j <= SEGS; j++) {
      const a = j / SEGS * Math.PI * 2;
      const lobe = 1 + 0.085 * Math.sin(a * 3 + 1.3) + 0.055 * Math.sin(a * 5 - 0.7) + 0.04 * Math.sin(a * 8 + 2.1);
      let x = Math.cos(a) * ISLAND_R * lobe * rr;
      let z = Math.sin(a) * ISLAND_R * lobe * rr;
      // 多峰融合：越往下越向各峰心收拢
      let y = -Math.pow(t, 0.92) * 96;
      let k = t * t;
      for (const p of peaks) {
        x += (p.x - x) * k * p.w * 0.9;
        z += (p.z - z) * k * p.w * 0.9;
        y += (p.d - 96) * k * p.w * 0.16;
      }
      const n = fbm(x * 0.05 + 30, z * 0.05 + y * 0.03, 3) - 0.5;
      x += n * 7 * (0.3 + t); z += n * 7 * (0.3 + t);
      y += n * 5.5;
      pos.push(x, y, z);
      c.copy(top).lerp(bot, smoothstep(0.05, 0.85, t));
      c.offsetHSL(0, 0, (n + 0.5) * 0.1 - 0.03);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < RINGS; i++)
    for (let j = 0; j < SEGS; j++) {
      const a = i * (SEGS + 1) + j, b = a + SEGS + 1;
      idx.push(a, a + 1, b + 1, a, b + 1, b);   // 法线朝外
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, flatShading: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  island.add(mesh);
  // 岛底垂下的藤蔓 / 根须
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const rad = ISLAND_R * (0.5 + Math.random() * 0.45);
    const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
    const y0 = terrainH(x, z) - 1;
    const len = 8 + Math.random() * 26;
    const g2 = group(x, y0, z, island);
    const segs = 5;
    let px = 0, py = 0;
    for (let s = 0; s < segs; s++) {
      const h = len / segs;
      const seg = put(G.cyl(0.34 - s * 0.05, 0.42 - s * 0.05, h, 5), mat(0x5c6b42 + (s % 2) * 0x0a1206),
        px, -h / 2 - py, 0, g2, false);
      seg.rotation.z = (Math.random() - 0.5) * 0.35;
      seg.rotation.x = (Math.random() - 0.5) * 0.35;
      py += h; px += (Math.random() - 0.5) * 0.8;
      put(G.sph(0.9 - s * 0.12, 6), mat(0x5f7a4e), px, -py, 0, g2, false);
    }
  }
}

function ribbon(pts, w, yl, color, parent = nature, opt = {}) {
  const pos = [], idx = [];
  const N = pts.length;
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(N - 1, i + 1)];
    const dx = next.x - prev.x, dz = next.z - prev.z;
    const l = Math.hypot(dx, dz) || 1;
    const nx = -dz / l, nz = dx / l;
    const hw = typeof w === 'function' ? w(i / (N - 1)) : w;
    const y = (opt.absY ? (p.y !== undefined ? p.y : 0) : terrainH(p.x, p.z)) + yl;
    pos.push(p.x + nx * hw, y, p.z + nz * hw);
    pos.push(p.x - nx * hw, y, p.z - nz * hw);
    if (i < N - 1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, opt.material || mat(color, { extra: { side: THREE.DoubleSide } }));
  m.receiveShadow = true;
  (parent || nature).add(m);
  return m;
}
function pathPoints(list, step = 1.6) {
  // list: [{x,z}] 折线 -> 密集采样点
  const out = [];
  for (let i = 0; i < list.length - 1; i++) {
    const a = list[i], b = list[i + 1];
    const L = Math.hypot(b.x - a.x, b.z - a.z);
    const n = Math.max(2, Math.ceil(L / step));
    for (let k = 0; k < n; k++) out.push({ x: a.x + (b.x - a.x) * k / n, z: a.z + (b.z - a.z) * k / n });
  }
  out.push(list[list.length - 1]);
  return out;
}

}

function prismRoof(w, h, len, material, overhang = 0.6) {
  const W = w / 2 + overhang, L = len / 2 + overhang;
  const v = [
    -W, 0, -L, W, 0, -L, W, 0, L, -W, 0, L,   // 0..3 底
    0, h, -L, 0, h, L                          // 4,5 脊
  ];
  const f = [
    0, 3, 5, 0, 5, 4,     // 左坡
    1, 4, 5, 1, 5, 2,     // 右坡
    0, 4, 1,              // 前山墙
    3, 2, 5               // 后山墙
  ];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.setIndex(f); g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}
/** 雉堞（垛口）一圈 */
function crenellate(cx, cz, w, d, top, mat4, merlonH = 1.5, parent = castle) {
  // 沿矩形四边摆小方齿
  const step = 3.0, mw = 1.5;
  const sides = [
    { a: [-w / 2, -d / 2], b: [w / 2, -d / 2] },
    { a: [w / 2, -d / 2], b: [w / 2, d / 2] },
    { a: [w / 2, d / 2], b: [-w / 2, d / 2] },
    { a: [-w / 2, d / 2], b: [-w / 2, -d / 2] },
  ];
  for (const s of sides) {
    const L = Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1]);
    const n = Math.max(2, Math.round(L / step));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = s.a[0] + (s.b[0] - s.a[0]) * t, z = s.a[1] + (s.b[1] - s.a[1]) * t;
      if (i % 2 === 1) continue;
      const dx = (s.b[0] - s.a[0]) / L, dz = (s.b[1] - s.a[1]) / L;
      const px = -dz, pz = dx;
      const m = new THREE.Mesh(G.box(Math.abs(dx) > 0.5 ? L / n * 0.62 : mw, merlonH, Math.abs(dz) > 0.5 ? L / n * 0.62 : mw), mat4);
      m.position.set(cx + x + px * (Math.abs(dx) > .5 ? 0 : 0), top + merlonH / 2, cz + z + pz * 0);
      m.castShadow = true; m.receiveShadow = true;
      parent.add(m);
    }
  }
}
/** 圆形塔的雉堞 */
function crenellateRound(r, top, mat4, count = 8, h = 1.4, parent = castle, cy = 0) {
  for (let i = 0; i < count; i++) {
    if (i % 2 === 1) continue;
    const a = i / count * Math.PI * 2;
    const m = new THREE.Mesh(G.box(1.5, h, 1.5), mat4);
    m.position.set(Math.cos(a) * (r - 0.35), top + h / 2 + cy, Math.sin(a) * (r - 0.35));
    m.rotation.y = -a;
    m.castShadow = true; parent.add(m);
  }
}
/** 拱门（在墙上开洞效果）：两侧柱 + 上方拱 */
function arch(w, h, mat4, x, y, z, parent = castle, depth = 2.6) {
  const g = group(x, y, z, parent);
  const t = 0.9;
  box(t, h - w / 2, depth, mat4, -(w / 2 + t / 2), 0, 0, g);
  box(t, h - w / 2, depth, mat4, (w / 2 + t / 2), 0, 0, g);
  // 拱：用半圆环（TorusGeometry 半圈）
  const tor = new THREE.Mesh(new THREE.TorusGeometry(w / 2, w / 2 * 0.55, 8, 16, Math.PI),
    mat4);
  tor.rotation.z = 0; tor.position.set(0, h - w / 2, 0);
  tor.scale.set(1, 1, depth / (w * 0.55));
  g.add(tor);
  return g;
}

/* ---------- 角塔 & 中段塔 ---------- */
function tower(x, z, r, h, opt = {}) {
  const g = group(x, 0, z, castle);
  const body = new THREE.Mesh(G.cyl(r, r * 1.1, h, opt.sides || 16), opt.matBody || mWall);
  body.position.y = h / 2; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  wallsOut.push(body);
  // 石砌束带
  [h * 0.34, h * 0.68].forEach(y => {
    const b = new THREE.Mesh(G.cyl(r + 0.18, r + 0.18, 0.5, opt.sides || 16), mWall2);
    b.position.y = y; g.add(b);
  });
  // 顶部：雉堞 or 尖顶
  if (opt.spire) {
    crenellateRound(r, h, mWall2, opt.sides || 10, 1.5, g);
    const sp = new THREE.Mesh(G.cone(r * 1.32, opt.spireH || r * 2.1, 4), opt.matRoof || mTile);
    sp.position.y = h + 1.5 + (opt.spireH || r * 2.1) / 2;
    sp.rotation.y = Math.PI / 4;
    sp.castShadow = true; g.add(sp); roofs.push(sp);
    // 屋脊小尖 + 旗
    const fin = new THREE.Mesh(G.cone(0.28, 1.4, 6), mat(C.gold));
    fin.position.y = h + 1.5 + (opt.spireH || r * 2.1) + 0.7; g.add(fin);
  } else {
    crenellateRound(r, h, mWall2, opt.sides || 10, 1.6, g);
  }
  // 窗
  const wc = opt.windows ?? 2;
  for (let i = 0; i < wc; i++) {
    const a = (opt.winAngles ? opt.winAngles[i] : Math.random() * 6.28);
    const y = h * (0.45 + i * 0.18);
    const w = new THREE.Mesh(G.box(0.9, 1.5, 0.5), mDark);
    w.position.set(Math.cos(a) * (r - 0.1), y, Math.sin(a) * (r - 0.1));
    w.rotation.y = Math.PI / 2 - a; g.add(w);
    const glow = new THREE.Mesh(G.box(0.7, 1.2, 0.12),
      new THREE.MeshStandardMaterial({ color: 0xffcf8a, emissive: 0xffb457, emissiveIntensity: 0.1 }));
    glow.position.set(Math.cos(a) * (r + 0.06), y, Math.sin(a) * (r + 0.06));
    glow.rotation.y = Math.PI / 2 - a; g.add(glow); windows.push(glow);
  }
  if (opt.flag) {
    const pole = new THREE.Mesh(G.cyl(0.12, 0.12, 6, 6), mat(C.woodDark));
    pole.position.y = h + 4.6; g.add(pole);
    const flag = makeFlag(3.4, 2.0, opt.flagColor || 0xc0564f);
    flag.position.set(1.7, h + 6.2, 0); g.add(flag); flags.push(flag);
  }
  return g;
}
function makeFlag(w, h, color) {
  const g = new THREE.PlaneGeometry(w, h, 12, 5);
  g.translate(w / 2, 0, 0);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color, side: THREE.DoubleSide, roughness: 0.95
  }));
  m.userData.base = g.attributes.position.array.slice();
  m.castShadow = true;
  return m;
}

  window.__port = port;
  // 吊桥：从门楼跨过岩台边缘的深沟，一路落到岛面上
  const BR_N = 26, BR_STEP = 1.05, BR_DROP = 10.5, BR_Z0 = gz + 3.2;
  const bridgeY = u => -Math.pow(u, 1.35) * BR_DROP;
  const bridge = group(0, 0, BR_Z0, castle);
  for (let i = 0; i < BR_N; i++) {
    const u = i / (BR_N - 1), yy = bridgeY(u);
    box(7.4, 0.30, BR_STEP + 0.02, mWood2, 0, yy, i * BR_STEP, bridge);
    [-3.6, 3.6].forEach(x => {
      box(0.34, 0.85, BR_STEP + 0.02, mWood, x, yy + 0.42, i * BR_STEP, bridge);
      if (i % 3 === 0) box(0.26, 1.1, 0.26, mWood, x, yy + 0.3, i * BR_STEP, bridge);
    });
  }
  // 桥墩（落在岩台斜坡上）
  [6, 11, 16, 21].forEach(i => {
    const u = i / (BR_N - 1), yy = bridgeY(u), zl = BR_Z0 + i * BR_STEP;

  // 吊桥铁链（铰在门楼塔顶）
  [-3.6, 3.6].forEach(x => {

    chain.position.set(x, 8.4, BR_Z0 + 5.4); chain.rotation.x = 0.62; castle.add(chain);
  });
  // 门楼上的纹章（盾形）
  const shield = group(0, 10.5, gz + 3.0, castle);
  const sh = new THREE.Mesh(G.box(3.2, 3.8, 0.3), mat(C.roof));
  shield.add(sh);
  const shTop = new THREE.Mesh(G.cone(1.6, 1.2, 3), mat(C.roof));
  shTop.position.y = -2.4; shTop.rotation.x = Math.PI; shTop.rotation.y = Math.PI / 2; shTop.scale.set(1, 1, 0.22);

  lion.position.set(0, 0.3, 0.22); lion.scale.set(1, 1.2, 0.4); shield.add(lion);

  // 干壕沟：切在岩台南缘的斜坡上，吊桥从上方跨过
  {
    const zA = 27, zB = 32;
    const yAt = zl => bridgeY((zl - BR_Z0) / ((BR_N - 1) * BR_STEP));
    const yA = yAt(zA), yB = yAt(zB);
    const slope = Math.atan2(yA - yB, zB - zA);       // 沟底倾角
    const moat = group(0, 0, 0, castle);
    // 沟底（倾斜的深色石板）
    const bed = new THREE.Mesh(G.box(21, 0.8, 5.8), mat(0x4f4a41));
    bed.position.set(0, (yA + yB) / 2 - 4.3, (zA + zB) / 2);
    bed.rotation.x = slope; moat.add(bed);
    // 两侧垂直石壁
    [[zA, yA], [zB, yB]].forEach(([zl, yb]) => {
      const h = 6.0;
      const wallL = box(21, h, 1.1, texMat(stoneTexBase, 0xc8b99f, 7, 2), 0, yb - 0.6 - h, zl, moat);
      // 壁顶压檐
      box(21.4, 0.45, 1.6, texMat(stoneTexBase, 0xdcd0b8, 7, 1), 0, yb - 0.6 - 0.45, zl, moat);
    });
    [-10.5, 10.5].forEach(x => box(1.1, 6.0, 5.8, texMat(stoneTexBase, 0xc8b99f, 2, 2), x, ((yA + yB) / 2) - 4.4, (zA + zB) / 2, moat));
    // 沟底尖桩
    for (let i = 0; i < 11; i++) {
      const m = new THREE.Mesh(G.cone(0.2, 2.4, 5), mat(C.woodDark));
      const zl = zA + 0.9 + Math.random() * (zB - zA - 1.8);
      m.position.set((Math.random() - .5) * 16, yAt(zl) - 3.4, zl);
      m.rotation.x = slope; moat.add(m);
    }
  }
})();

/* ---------- 马厩 / 铁匠铺 / 谷仓 / 仆役房 ---------- */
function cottage(x, z, w, d, h, roofH, mRoof, opt = {}) {
  const g = group(x, 0, z, castle);
  const wallM = opt.matWall || texMat(stoneTexBase, 0xe8dcc2, 3, 2);
  const t = 0.9;
  box(w, h, t, wallM, 0, 0, -d / 2, g);
  box(w, h, t, wallM, 0, 0, d / 2, g);
  box(t, h, d, wallM, -w / 2, 0, 0, g);
  if (!opt.openSide || opt.openSide !== '+x') box(t, h, d, wallM, w / 2, 0, 0, g);
  box(w - t, 0.28, d - t, mFloor, 0, 0.02, 0, g);
  const roof = prismRoof(w + 1.0, roofH, d + 1.0, mRoof || mTile2, 0.8);
  roof.position.y = h; roof.castShadow = true; g.add(roof); roofs.push(roof);
  return g;
}

/** 巡游者：沿路径来回走 */
function walker(obj, pts, opt = {}) {
  // 预计算分段长度，避免每帧重算
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push(l); total += l;
  }
  const w = {
    obj, pts, segs, total,
    t: Math.random(), spd: opt.spd || 0.055, dir: 1,
    bob: Math.random() * 6.28,
    terrain: opt.terrain !== false,     // 城内建筑上的人固定高度，城外的人贴地形
    baseY: obj.position.y
  };
  obj.scale.setScalar(opt.scale || 1);
  anim.people.push(w);
  return w;
}

/* ---------- 城堡内的人 ---------- */
function cPerson(localX, localZ, o, propKind, walkPts, opt = {}) {
  const g = human(o);
  if (propKind) prop(g, propKind);
  g.position.set(CX + localX, CY + (opt.yOff || 0), CZ + localZ);
  people.add(g);
  if (walkPts) {
    walker(g, walkPts.map(p => [CX + p[0], CZ + p[1]]),
      { spd: opt.spd || 0.6, scale: o.scale || 1, terrain: false });
  } else {
    g.userData.idle = Math.random() * 6.28;
    anim.people.push({
      obj: g, idle: true, pts: null, bob: Math.random() * 6.28,
      scale: o.scale || 1, baseY: g.position.y, terrain: false
    });
  }
  return g;
}

    while (o) { if (o.userData && o.userData.label) { label = o.userData.label; break; } o = o.parent; }

    tagEl.textContent = label;

function pathSample(w, u) {
  const pts = w.pts, segs = w.segs;
  let d = THREE.MathUtils.clamp(u, 0, 1) * w.total;
  for (let i = 0; i < segs.length; i++) {
    if (d <= segs[i] || i === segs.length - 1) {
      const k = segs[i] ? Math.min(1, d / segs[i]) : 0;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
    }
    d -= segs[i];
  }
  return pts[pts.length - 1];
}

let inited = false;
function animate(t, dt) {
  /* 一次性基准记录 */
  if (!inited) {
    inited = true;
    anim.people.forEach(w => { if (w.baseY === undefined) w.baseY = w.obj.position.y; });
    anim.animals.forEach(a => { if (a.baseY === undefined) a.baseY = a.obj.position.y; });
    applyTime('day');
  }

  /* 旗帜 */
  for (const f of flags) {
    const pos = f.geometry.attributes.position, base = f.userData.base;
    for (let i = 0; i < pos.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      const k = x / 3.4;
      pos.array[i * 3 + 2] = Math.sin(t * 4.2 + k * 5.2 + y * 0.7) * 0.42 * k;
      pos.array[i * 3 + 1] = y + Math.sin(t * 3.1 + k * 4.4) * 0.10 * k;
    }
    pos.needsUpdate = true;
  }
  /* 云：绕岛缓慢公转 */
  for (const c of clouds) {
    const u = c.userData;
    u.a0 += u.sp * 0.055 * dt;
    c.position.set(Math.cos(u.a0) * u.R, u.baseY + Math.sin(t * 0.26 + u.sp * 90) * 2.6, Math.sin(u.a0) * u.R);
    c.rotation.y += dt * 0.012;
  }
  /* 太阳 / 月盘 */
  sunDisc.position.copy(sun.position).setLength(620);
  sunGlow.position.copy(sunDisc.position);
  sunGlow.scale.setScalar((TIME === 'night' ? 0.72 : 1) * (1 + Math.sin(t * 0.7) * 0.05));
  stars.rotation.y = t * 0.006;

  /* 火光闪烁 */
  const flick = 0.85 + Math.sin(t * 11.3) * 0.09 + Math.sin(t * 7.1) * 0.06;
  [window.__hallFire, window.__keepFire, window.__forgeFireMesh].forEach(f => {
    if (!f) return;
    f.scale.set(flick, flick * (0.9 + Math.sin(t * 9.7) * 0.12), flick);
    f.material.emissiveIntensity = 1.5 + Math.sin(t * 13.1) * 0.45;
    f.rotation.y = t * 0.9;
  });
  anim.fires.forEach(f => {
    if (f.type === 'flame') {
      f.m.scale.set(flick, flick * (0.9 + Math.sin(t * 10.1) * 0.14), flick);
      if (f.pl) f.pl.intensity = 0.9 + flick * 0.5;
    } else if (f.type === 'smoke') {
      f.g.children.forEach((m, i) => {
        const u = (m.userData.t + t * f.spd * 0.16) % 1;
        m.position.set(Math.sin(u * 7 + i) * u * 2.2, u * 9, Math.cos(u * 5 + i) * u * 1.6);
        m.scale.setScalar(0.4 + u * 2.2);
        m.material.opacity = 0.34 * (1 - u) * (1 - u);
      });
    }
  });
  /* 铁匠铺的烟 */
  if (window.__smoke) {
    window.__smoke.children.forEach((m, i) => {
      const u = (m.userData.t + t * 0.19) % 1;
      m.position.set(Math.sin(u * 6 + m.userData.a) * u * 2.6, u * 11, Math.cos(u * 4 + m.userData.a) * u * 2.0);
      m.scale.setScalar(0.5 + u * 3.0);
      m.material.opacity = 0.32 * (1 - u);
    });
  }
  /* 瀑布水雾 */
  if (window.__mist) {
    window.__mist.children.forEach((m, i) => {
      const u = (t * 0.14 + m.userData.a) % 1;
      m.position.y = u * 26 - 6;
      m.scale.setScalar(2.2 + u * 4.5);
      m.material.opacity = 0.26 * Math.sin(u * Math.PI);
    });
  }
  /* 风车 */
  anim.windmills.forEach(w => { w.g.rotation.z = t * w.spd; });
  /* 钟摆 */
  if (window.__bell) window.__bell.rotation.z = Math.sin(t * 0.9) * 0.045;
  /* 水井吊桶 */
  if (window.__wellBucket) window.__wellBucket.position.y = 3.3 + Math.sin(t * 0.5) * 0.35;
  /* 玻璃罩轻轻呼吸 */
  if (window.__roseDome) window.__roseDome.scale.setScalar(1 + Math.sin(t * 1.2) * 0.012);
  /* 小王子围巾 */
  if (window.__prince && window.__prince.userData.scarf)
    window.__prince.userData.scarf.rotation.z = 0.5 + Math.sin(t * 1.6) * 0.22;

  if (!LIVE) return;

  /* 人：行走 */
  for (const w of anim.people) {
    if (!w.pts) {
      const s = Math.sin(t * 1.7 + w.bob) * 0.035;
      w.obj.position.y = w.baseY + Math.abs(s);
      if (w.obj.userData.head) w.obj.userData.head.rotation.y = Math.sin(t * 0.7 + w.bob) * 0.35;
      const a = w.obj.userData.arms;
      if (a) { a[0].rotation.x = Math.sin(t * 1.1 + w.bob) * 0.08; a[1].rotation.x = -Math.sin(t * 1.1 + w.bob) * 0.08; }
      continue;
    }
    w.t += w.dir * w.spd * dt * 0.09;
    if (w.t > 1) { w.t = 1; w.dir = -1; }
    if (w.t < 0) { w.t = 0; w.dir = 1; }
    const [px, pz] = pathSample(w, w.t);
    const prevX = w.obj.position.x, prevZ = w.obj.position.z;
    const gy = w.terrain ? terrainH(px, pz) : w.baseY;
    w.obj.position.set(px, gy + Math.abs(Math.sin(t * 7.4 + w.bob)) * 0.075, pz);
    const dx = px - prevX, dz = pz - prevZ;
    if (dx * dx + dz * dz > 1e-6) w.obj.rotation.y = Math.atan2(dx, dz);
    const a = w.obj.userData.arms;
    if (a) {
      const sw = Math.sin(t * 7.4 + w.bob) * 0.55;
      a[0].rotation.x = sw; a[1].rotation.x = -sw;
    }
  }
  /* 动物 */
  for (const a of anim.animals) {
    const o = a.obj;
    if (a.kind === 'graze') {
      o.position.y = a.baseY + (Math.sin(t * 1.3 + a.ph) > 0.86 ? 0.05 : 0);
      o.rotation.y += Math.sin(t * 0.5 + a.ph) * dt * 0.25;
      o.rotation.x = Math.sin(t * 0.9 + a.ph) > 0.7 ? 0.22 : 0;
    } else if (a.kind === 'run') {
      const ang = t * a.spd + a.ph;
      o.position.set(a.home[0] + Math.cos(ang) * a.r, a.baseY + Math.abs(Math.sin(t * 9)) * 0.08, a.home[1] + Math.sin(ang) * a.r);
      o.rotation.y = -ang + Math.PI / 2;
    } else if (a.kind === 'swim') {
      const ang = t * a.spd + a.ph;
      o.position.set(a.cx + Math.cos(ang) * a.r, LAKE_Y + 0.06 + Math.sin(t * 2 + a.ph) * 0.05, a.cz + Math.sin(ang) * a.r);
      o.rotation.y = -ang + Math.PI / 2;
    } else if (a.kind === 'stable') {
      o.rotation.y += Math.sin(t * 0.6 + a.ph) * dt * 0.12;
      o.position.y = a.baseY + Math.sin(t * 1.6 + a.ph) * 0.02;
    } else if (a.kind === 'sit') {
      o.position.y = a.baseY + Math.sin(t * 1.1) * 0.018;
      o.rotation.y = 2.9 + Math.sin(t * 0.35) * 0.12;
      if (o.children[7]) o.children[7].rotation.y = Math.sin(t * 1.8) * 0.4;   // 尾巴
    }
  }
  /* 鸟 */
  for (const b of anim.birds) {
    const ang = t * b.spd + b.ph;
    b.obj.position.set(b.cx + Math.cos(ang) * b.r, b.y + Math.sin(t * 0.8 + b.ph) * 4.5, b.cz + Math.sin(ang) * b.r);
    b.obj.rotation.y = -ang + Math.PI / 2;
    b.obj.rotation.z = Math.sin(t * 1.2 + b.ph) * 0.12;
    const fl = Math.sin(t * 9 + b.ph) * 0.6;
    const ws = b.obj.userData.wings;
    if (ws) { ws[0].rotation.x = fl; ws[1].rotation.x = -fl; }
  }
  /* 蝴蝶 */
  for (const b of anim.butterflies) {
    const ang = t * b.spd + b.ph;
    const y = 2.5 + Math.sin(t * 1.9 + b.ph) * 1.6;
    b.obj.position.set(b.home[0] + Math.cos(ang) * b.r, terrainH(b.home[0] + Math.cos(ang) * b.r, b.home[1] + Math.sin(ang * 1.3) * b.r) + y,
      b.home[1] + Math.sin(ang * 1.3) * b.r);
    b.obj.rotation.y = -ang;
    const fl = Math.sin(t * 16 + b.ph) * 0.9;
    const ws = b.obj.userData.wings;
    if (ws) { ws[0].rotation.z = 0.3 + fl; ws[1].rotation.z = -0.3 - fl; }
  }
  /* 小舟 */
  for (const b of anim.boats) {
    const ang = t * 0.12 + b.ph;
    b.g.position.set(b.cx + Math.cos(ang) * 3.4, LAKE_Y + Math.sin(t * 1.4 + b.ph) * 0.07, b.cz + Math.sin(ang) * 3.4);
    b.g.rotation.y = -ang + Math.PI / 2 + 0.4;
  }
}

/* ---------- 初始视角 ---------- */
ctrl.flyTo(V(118, 62, 128), V(0, 6, -14), 0);

/* 调试钩子 */
window.__ctrl = ctrl;
window.__THREE = THREE;
window.__island = island;
window.__CY = CY;
window.__fly = (px, py, pz, tx, ty, tz) => ctrl.flyTo(V(px, py, pz), V(tx, ty, tz), 0);
window.__setTime = n => { document.querySelector(`[data-time="${n}"]`).click(); };

/* ---------- 主循环 ---------- */
let last = performance.now(), firstFrame = true;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now * 0.001;
  ctrl.update(dt);
  // 别让相机钻进地面
  const cp = camera.position;
  if (Math.hypot(cp.x, cp.z) < ISLAND_R * 1.02) {
    const gy = terrainH(cp.x, cp.z) + 1.4;
    if (cp.y < gy) cp.y = gy;
  }
  animate(t, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
/* 同步画出第一帧：保证打开即见画面，也让构建期异常能立刻暴露 */
try {
  ctrl.update(0);
  animate(0, 0.016);
  renderer.render(scene, camera);
  firstFrame = false;
  document.getElementById('loader').classList.add('hide');
  window.__DBG = {
    calls: renderer.info.render.calls,
    tris: renderer.info.render.triangles,
    progs: renderer.info.programs ? renderer.info.programs.length : -1
  };
} catch (err) {
  console.error(err);
  const ld = document.getElementById('loader');
  ld.querySelector('p').textContent = '搭建时出了点问题';
  ld.insertAdjacentHTML('beforeend',
    '<div class="err">' + (err && err.message ? err.message : err) + '</div>');
}

resize();
addEventListener('resize', resize);
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

requestAnimationFrame(tick);
</script>
