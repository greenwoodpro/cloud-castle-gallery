<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f2e9">
<title>星屿 STAR ISLE · 离线浮空城堡</title>
<style>
/*__FONTS__*/
:root{--paper:#f4f2e9;--ink:#4d5756;--sage:#93a286;--slate:#87979f;--gold:#c4a574;--bg:var(--paper);--text:var(--ink);--line:color-mix(in srgb,var(--ink) 15%,transparent)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 'Star Isle Sans',system-ui,'PingFang SC','Microsoft YaHei',sans-serif;height:100svh;overflow:hidden}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);padding:8px 13px;transition:background .2s}button:hover,button[aria-pressed=true]{background:color-mix(in srgb,var(--sage) 24%,var(--bg))}button:focus-visible{outline:2px solid var(--sage);outline-offset:3px}header{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--line);position:relative;z-index:2}.brand{font-size:23px;letter-spacing:5px;line-height:1.3}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--slate)}nav{display:flex;gap:8px}nav button{border:0;background:transparent}main{height:calc(100svh - 135px);position:relative}canvas{position:absolute;left:10%;top:0;width:90%;height:100%;touch-action:none}.intro{position:absolute;top:60px;left:40px;pointer-events:none}.intro small{letter-spacing:2px;color:var(--slate)}h1{font:400 48px/1.6 'Star Isle Serif','Star Isle Sans','Songti SC','SimSun',serif;letter-spacing:3px;margin:22px 0}p{color:color-mix(in srgb,var(--text) 78%,var(--bg))}.sky{position:absolute;top:35px;right:35px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);padding:18px;border-radius:12px;background:color-mix(in srgb,var(--bg) 90%,transparent)}.sky>div{display:flex;gap:6px}.toolbar{position:absolute;bottom:25px;left:55%;transform:translateX(-50%);display:flex;gap:6px;border:1px solid var(--line);border-radius:12px;padding:7px;background:var(--bg)}.toolbar button{border:0;white-space:nowrap}.story-link{position:absolute;bottom:30px;left:40px}.status{height:49px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:13px}.night,.sunset{transition:background .5s}body[data-time=night]{--bg:#343f46;--text:var(--paper);--line:color-mix(in srgb,var(--paper) 17%,transparent)}body[data-time=sunset]{--bg:#f1e8d8}dialog{border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);padding:30px;max-width:640px;width:90%;max-height:85svh;line-height:1.9}dialog::backdrop{background:color-mix(in srgb,var(--ink) 35%,transparent);backdrop-filter:blur(5px)}dialog h2{font:400 28px/1.5 'Star Isle Serif','Star Isle Sans','Songti SC',serif;margin-top:28px}dialog h3{font-size:16px;font-weight:500}dialog p{font-size:14px;color:var(--ink)}dialog>button{display:block;margin-left:auto}dialog section+section{margin-top:40px;border-top:1px solid var(--line)}@media(max-width:700px){header{height:75px;padding:0 20px}.brand{font-size:20px}header>button{font-size:12px;padding:6px 10px}nav{position:absolute;top:85px;left:12px;right:12px;justify-content:center;gap:0}nav button{font-size:12px;padding:7px 12px}.intro{top:78px;left:22px}.intro small{font-size:11px;letter-spacing:1px}h1{font-size:32px;margin-top:15px}.intro p{display:none}.sky{top:91px;right:15px;padding:8px;border:0;gap:8px;font-size:12px}.sky>div{gap:2px}.sky button{font-size:11px;padding:5px}main{height:calc(100svh - 124px);min-height:650px}canvas{left:-15%;top:22%;width:130%;height:65%}.toolbar{left:50%;bottom:25px;gap:0;padding:5px;max-width:95vw}.toolbar button{font-size:12px;padding:8px}.story-link{bottom:86px;left:22px;font-size:12px}.status{font-size:11px}body{overflow:auto}}
</style>
</head>
<body>
<header><div class="brand">星屿<small>STAR ISLE · 离线典藏</small></div><nav aria-label="场景区域"><button data-view="island" aria-pressed="true">浮岛全景</button><button data-view="castle" aria-pressed="false">城堡内部</button><button data-view="residents" aria-pressed="false">岛上居民</button><button data-view="nature" aria-pressed="false">自然秘境</button></nav><button id="export">导出 GLB 模型</button></header>
<main><canvas id="world" aria-label="可自由旋转的浮空城堡三维模型"></canvas><section class="intro"><small>一座漂浮在想象里的城堡</small><h1>在云的上面，<br>住一会儿。</h1><p>离世界远一点，离童话近一点。<br>在这座小小的浮岛上，<br>每一处风景，都值得慢慢发现。</p></section><aside class="sky"><span>此刻的天空</span><div><button data-time="morning" aria-pressed="true">晨光</button><button data-time="sunset" aria-pressed="false">落日</button><button data-time="night" aria-pressed="false">星夜</button></div></aside><button id="open-stories" class="story-link">阅读浮岛手记 ↗</button><div class="toolbar" aria-label="场景工具"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="reset">重置</button><button id="rotate" aria-pressed="false">环游</button><button id="cutaway" aria-pressed="false">内部剖视</button><button id="capture">明信片</button></div></main>
<footer id="status" class="status" role="status">正在托起一座小岛…</footer><dialog id="stories" aria-label="浮岛手记"><button id="close-stories">关闭</button><div id="story-body"></div></dialog>
<script>/*__BUNDLE__*/</script>
</body>
</html>
