<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe9ec">
<title>云端城堡 · 小王子手记</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./dist/app.js"></script>
</head>
<body>

<div id="stage">
  <div id="sky-day" class="sky"></div>
  <div id="sky-night" class="sky"></div>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<header id="masthead">
  <p class="eyebrow">LE PETIT PRINCE · CARNET DE VOYAGE <span>✦</span></p>
  <h1>云端城堡</h1>
  <p class="sub">一枚浮在云海上的小岛，和它全部的住户</p>
  <div class="rule"></div>
  <p class="lede">「重要的东西，用眼睛是看不见的。」<br>这里有一座可以掀开屋顶的城堡、<br>四十四次日落，以及一朵需要玻璃罩的玫瑰。</p>
</header>

<div id="freeview">
  <span class="dot"></span><b>自由视角</b><em>拖拽旋转 · 滚轮缩放 · 右键平移</em>
</div>

<div id="pin-layer"></div>

<aside id="guide">
  <div class="g-top">
    <div>
      <p class="g-eyebrow">FIELD NOTES / 导览图鉴</p>
      <h2>岛上札记</h2>
    </div>
    <button id="guide-close" class="icon-btn" title="收起图鉴" aria-label="收起图鉴">×</button>
  </div>

  <nav id="tabs"></nav>

  <div class="g-cat">
    <div class="g-cat-l">
      <span id="cat-en"></span>
      <h3 id="cat-title"></h3>
      <p id="cat-desc"></p>
    </div>
    <span id="cat-count" class="g-count"></span>
  </div>

  <div id="catalog">
    <div id="list-view"><div id="list-items"></div></div>
    <div id="detail-view" class="hide">
      <button id="d-back" class="back">← 返回目录</button>
      <p id="d-kicker" class="d-kicker"></p>
      <h3 id="d-title" class="d-title"></h3>
      <div class="d-rule"></div>
      <p id="d-text" class="d-text"></p>
      <dl id="d-facts" class="d-facts"></dl>
      <p id="d-index" class="d-index"></p>
      <div id="d-neighbors" class="d-neighbors"></div>
    </div>
  </div>

  <div class="g-foot"><span>点亮场景中的小点，也能听见它的故事</span><span>✦</span></div>
</aside>

<button id="guide-open">岛上札记 <span>✦</span></button>

<div id="toolbar">
  <div class="tgroup">
    <span class="tlabel">视角</span>
    <button data-view="overview" class="on">全岛</button>
    <button data-view="castle">城堡</button>
    <button data-view="cutaway">剖面</button>
    <button data-view="garden">花园</button>
    <button data-view="starry">星海</button>
    <button data-view="under">岛底</button>
  </div>
  <span class="tsep"></span>
  <div class="tgroup">
    <span class="tlabel">开关</span>
    <button data-toggle="cut">掀屋顶</button>
    <button data-toggle="night">星夜</button>
    <button data-toggle="auto">自转</button>
    <button data-toggle="pins" class="on">标注</button>
  </div>
</div>

<p id="hint">按 1—6 切换视角 &nbsp;·&nbsp; C 剖面 &nbsp;·&nbsp; N 星夜 &nbsp;·&nbsp; R 自转 &nbsp;·&nbsp; ← → 翻页</p>

<div id="loading">
  <div class="ld-orbit"><i></i><i></i><i></i></div>
  <p class="ld-small">CHAPTER ONE</p>
  <h2>正在把星星搬上天空</h2>
  <p class="ld-note">一座城堡，一朵玫瑰，和等待被点亮的窗</p>
</div>

</body>
</html>
